function extenso(v){
  const U=['','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez','onze','doze','treze','quatorze','quinze','dezesseis','dezessete','dezoito','dezenove'],
    D=['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'],
    C=['','cento','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];
  const ate999=n=>{ if(n===100)return 'cem'; const c=Math.floor(n/100), r=n%100, p=[];
    if(c)p.push(C[c]); if(r<20){ if(r)p.push(U[r]) } else { p.push(D[Math.floor(r/10)]+(r%10?' e '+U[r%10]:'')) } return p.join(' e ') };
  const inteiro=n=>{ if(!n)return 'zero'; const mi=Math.floor(n/1e6), mil=Math.floor(n%1e6/1000), r=n%1000, p=[];
    if(mi)p.push(mi===1?'um milhão':ate999(mi)+' milhões'); if(mil)p.push(mil===1?'mil':ate999(mil)+' mil');
    if(r){ if(p.length&&(r<100||r%100===0))return p.join(' ')+' e '+ate999(r); p.push(ate999(r)) }
    return p.join(' ') };
  const ct=Math.round(v*100), r=Math.floor(ct/100), c=ct%100;
  const pr=r?inteiro(r)+(r===1?' real':(r%1e6===0?' de reais':' reais')):'', pc=c?ate999(c)+(c===1?' centavo':' centavos'):'';
  return [pr,pc].filter(Boolean).join(' e ')||'zero reais';
}
const dataLonga=iso=>{ const [a,m,d]=iso.split('-'); return `${+d} de ${MESES[+m-1]} de ${a}` };
const dataCheia=iso=>{ const [a,m,d]=String(iso).split('-'); return `${d}/${m}/${a}` };

const DESCR={estetica:'procedimentos estéticos',odonto:'atendimentos odontológicos',psico:'atendimentos psicoterapêuticos'};
/* uma linha por sessão do mês: avulsa pelo valor pago, pacote pelo valor de cada sessão */
function linhasRecibo(cid,mes){
  const hj=hojeISO(), ls=[];
  S.vendas.filter(v=>v.clienteId===cid).forEach(v=>{ const k=conta(v); if(k.estornado&&k.devolvido>=k.bruto)return;
    const fator=k.bruto?(k.bruto-k.devolvido)/k.bruto:1;
    if(k.sessoes>1)(v.usadas||[]).forEach(d=>{ if(mesDe(d)===mes&&d<=hj)ls.push({data:d,valor:k.porSessao*fator}) });
    else { const d=v.sessao||v.data; if(mesDe(d)===mes)ls.push({data:d,valor:k.bruto*fator}) } });
  return ls.sort((a,b)=>a.data.localeCompare(b.data));
}

/* ══════════ DADOS POR ÁREA ══════════
   Cada área tem a sua gaveta: o paciente da psicologia nunca aparece na odontologia.
   O 'lucra:v1' continua existindo e fica com a área que já estava nele. */
const CHAVE_BASE='lucra:v1', AREAS_OK=['estetica','odonto','psico'];
function chaveDe(a){
  if(UI.chaves[a])return UI.chaves[a];
  const usada=Object.values(UI.chaves).includes(CHAVE_BASE);
  UI.chaves[a]=a==='estetica'&&!usada?CHAVE_BASE:CHAVE_BASE+':'+a; salvarUI(); return UI.chaves[a];
}
function prepararArea(){
  if(!AREAS_OK.includes(UI.area)){
    let a='estetica';
    try{ const d=JSON.parse(localStorage.getItem(CHAVE_BASE)||'null'); if(d&&AREAS_OK.includes(d.area))a=d.area }catch(e){}
    UI.area=a; UI.chaves={}; UI.chaves[a]=CHAVE_BASE; UI.clinicas={}; UI.clinicas[a]=UI.clinica; salvarUI();
  }
  CHAVE=chaveDe(UI.area);
  if(UI.clinicas[UI.area]!=null)UI.clinica=UI.clinicas[UI.area];
}
/* troca a gaveta inteira: salva a área atual e carrega a outra */
function trocaGaveta(k){
  salvar(); UI.clinicas[UI.area]=UI.clinica;
  const t=S.tema; UI.clinica=UI.clinicas[k]||''; UI.area=k; CHAVE=chaveDe(k);   /* nome primeiro: chaveDe já grava as preferências */
  S=JSON.parse(JSON.stringify(PAD)); carregar(); S.area=k; S.tema=t;
  mesSel=mesAtual(); salvar(); salvarUI();
}
/* fotos de quem não existe em nenhuma área são apagadas; as das outras áreas ficam */
function fotosOrfas(){
  const ids=new Set(S.clientes.map(c=>c.id));
  AREAS_OK.filter(a=>a!==UI.area&&UI.chaves[a]).forEach(a=>{ try{ const d=JSON.parse(localStorage.getItem(UI.chaves[a])||'null');
    if(d&&Array.isArray(d.clientes))d.clientes.forEach(c=>ids.add(c.id)) }catch(e){} });
  return FOTOS.todos().then(rs=>Promise.all(rs.filter(r=>!ids.has(r.clienteId)).map(r=>FOTOS.apagar(r.id)))).catch(()=>{});
}

  if(!el.querySelector(':scope > [data-pn=esq]')){ const d=document.createElement('div'); d.className='pn-dir pn-so'; el.querySelectorAll(':scope > [data-pn=dir]').forEach(c=>d.appendChild(c)); k.after(d); return }

const ehCelular=()=>/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
function partesZap(url){ try{ const u=new URL(url,location.href);
  if(u.hostname==='wa.me')return {fone:u.pathname.replace(/\D/g,''),texto:u.searchParams.get('text')||''};
  if(/(^|\.)whatsapp\.com$/.test(u.hostname)&&/send/.test(u.pathname))return {fone:(u.searchParams.get('phone')||'').replace(/\D/g,''),texto:u.searchParams.get('text')||''};
  }catch(e){} return null }
function abreZap(url){ const p=partesZap(url);
  if(!p||ehCelular()){ window.open(url,'_blank','noopener'); return }
  const q=`${p.fone?'phone='+p.fone+'&':''}text=${encodeURIComponent(p.texto)}`;
  if(UI.zap==='app'){ location.href='whatsapp://send?'+q; return }
  const w=window.open('https://web.whatsapp.com/send?'+q,'lucra-whatsapp');
  if(w){ try{w.focus()}catch(e){} } }
function perguntaZap(depois){
  abrirSheet('WhatsApp neste computador','Pergunto uma vez só. Dá para mudar em Ajustes.',

const soDig=v=>String(v||'').replace(/\D/g,'');

  return d.length>10?molde(d,'(##) #####-####'):molde(d,'(##) ####-####') }

const fmtCnpj=v=>molde(soDig(v).slice(0,14),'##.###.###/####-##');
const fmtDoc=v=>{ const d=soDig(v); if(!d)return String(v||''); return d.length>11?fmtCnpj(d):fmtCpf(d) };
const MASC=[['#c-tel,input[inputmode=tel]',fmtTel],['#c-cpf,#rb-cpf,#rb-pc',fmtCpf],['#rb-d,#pf-doc',fmtDoc]];
document.addEventListener('input',e=>{ const t=e.target; if(!t||t.tagName!=='INPUT')return;
  const m=MASC.find(z=>t.matches(z[0])); if(!m)return;
  const fim=t.selectionStart===t.value.length, novo=m[1](t.value); if(novo===t.value)return;
  t.value=novo; if(fim)try{t.setSelectionRange(novo.length,novo.length)}catch(err){} },true);

/* ── conversa com o servidor ── */
async function sb(caminho,{metodo='GET',corpo,auth=true}={}){
  const h={apikey:SB_KEY,'Content-Type':'application/json'};
  if(auth&&SES)h.Authorization='Bearer '+SES.access_token;
  let r;
  try{ r=await fetch(SB_URL+caminho,{method:metodo,headers:h,body:corpo==null?undefined:JSON.stringify(corpo)}) }
  catch(e){ const x=new Error('sem_internet'); x.rede=true; throw x }
  const t=await r.text(); let d=null; try{ d=t?JSON.parse(t):null }catch(e){ d=t }
  if(!r.ok){ const x=new Error((d&&(d.msg||d.message||d.error_description||d.error_code||d.error))||('erro '+r.status)); x.status=r.status; x.dados=d; throw x }
  return d;
}
function guardaSessao(d){
  if(!d||!d.access_token)return;
  SES={access_token:d.access_token,refresh_token:d.refresh_token,
    expires_at:d.expires_at?+d.expires_at:Math.floor(Date.now()/1000)+(+d.expires_in||3600),
    user:{id:(d.user||{}).id||(SES&&SES.user.id),email:(d.user||{}).email||(SES&&SES.user.email)}};
  gravarJ(K_SES,SES);
}
async function garanteToken(){
  if(!SES)throw Object.assign(new Error('sem_login'),{status:401});
  if(Date.now()/1000<SES.expires_at-90)return;
  try{ guardaSessao(await sb('/auth/v1/token?grant_type=refresh_token',{metodo:'POST',corpo:{refresh_token:SES.refresh_token},auth:false})) }
  catch(e){ if(!e.rede){ e.status=401 } throw e }
}

function msgErro(e){

  if(/Invalid login/i.test(m))return 'E-mail ou senha não conferem.';
  if(/not confirmed/i.test(m))return 'Falta confirmar o e-mail: abra o link que enviamos para você.';
  if(/already registered|already been registered|user_already_exists/i.test(m))return 'Já existe uma conta com esse e-mail. Entre com a sua senha.';
  if(/at least 6|weak_password|Password should/i.test(m))return 'A senha precisa ter pelo menos 6 caracteres.';
  if(/rate limit|over_email_send_rate/i.test(m))return 'O servidor atingiu o limite de e-mails por hora. Tente de novo mais tarde.';
  if(/valid email|email_address_invalid|invalid format/i.test(m))return 'Esse e-mail não parece válido.';

    try{
      if(modo==='entrar'){ guardaSessao(await sb('/auth/v1/token?grant_type=password',{metodo:'POST',corpo:{email:em,password:se},auth:false})); return entrar() }
      if(modo==='criar'){ const nome=$('#pt-nome').value.trim();
        const d=await sb('/auth/v1/signup?redirect_to='+encodeURIComponent(SITE()),{metodo:'POST',corpo:{email:em,password:se,data:{nome}},auth:false});
        gravarJ('lucra:nome-novo',nome);
        if(d&&d.access_token){ guardaSessao(d); return entrar() }
        return porta('confira','',{email:em}) }
      if(modo==='esqueci'){ await sb('/auth/v1/recover?redirect_to='+encodeURIComponent(SITE()),{metodo:'POST',corpo:{email:em},auth:false});
        return porta('entrar','Se esse e-mail tem conta, o link para criar uma senha nova já está a caminho.',{email:em}) }
      if(modo==='nova'){ await api('/auth/v1/user',{metodo:'PUT',corpo:{password:se}}); toast('Senha nova salva'); return entrar() }
    }catch(err){ porta(modo,msgErro(err),{email:em,nome:nm}) }
  };
  const pri=p.querySelector('input'); if(pri&&!pri.value)setTimeout(()=>pri.focus(),60);
}

/* ── entrar: descobre a clínica e o papel; sem internet usa o que ficou guardado ── */
let depoisDeEntrar=()=>{};
async function entrar(op){
  op=op||{}; porta('carregando');
  let conta=null;
  try{
    await rpc('aceitar_convites');
    const ms=await api(`/rest/v1/membros?select=clinica_id,papel,nome,email&user_id=eq.${SES.user.id}`);
    const m=(ms||[])[0];
    if(!m)return criarClinica();
    const c=((await api(`/rest/v1/clinicas?select=id,nome,area&id=eq.${m.clinica_id}`))||[])[0];
    if(!c)return criarClinica();
    conta={cid:c.id,area:c.area,clinica:c.nome,papel:m.papel,nome:m.nome,email:SES.user.email,uid:SES.user.id};
    gravarJ(K_CONTA,conta);
  }catch(e){
    if(e.status===401){ sairDaConta(true,'A sessão expirou. Entre de novo.'); return }
    const cache=lerJ(K_CONTA);
    if(e.rede&&cache&&cache.uid===(SES.user||{}).id){ conta=cache; syncEst='off' }
    else return porta('entrar',msgErro(e));
  }
  ativar(conta,op);
}
function ativar(conta,op){
  CONTA=conta;
  document.body.classList.add('nuvem','papel-'+CONTA.papel);
  UI.area=CONTA.area; UI.clinica=CONTA.clinica||''; if(!ehDono())UI.boasVindas=true;
  CHAVE='lucra:nuvem:'+CONTA.cid;
  const t=S.tema;
  S=JSON.parse(JSON.stringify(PAD));
  if(op&&op.importar){ Object.assign(S,JSON.parse(JSON.stringify(op.importar))); normalizar(); salvarLocal(); BASE={} }
  else { carregar(); BASE=lerJ(CHAVE+':base')||{} }
  if(!podeClinico())CLINICO.forEach(k=>S[k]=[]);
  S.area=CONTA.area; S.tema=S.tema||t;
  salvarUI(); tema(); aparencia(); aplicaNav(); marca(); aplicarPapel();
  fechaPorta(); mesSel=mesAtual();
  if(!permitido(tela))tela=telaInicial(); marcaMenu(tela);
  depoisDeEntrar(); depoisDeEntrar=()=>render();
  pintaSync(); sincronizar();
}

/* ── sincronização: junta as mudanças daqui com as da equipe ── */
const canon=v=>Array.isArray(v)?'['+v.map(canon).join(',')+']'
  :v&&typeof v==='object'?'{'+Object.keys(v).filter(k=>v[k]!==undefined).sort().map(k=>JSON.stringify(k)+':'+canon(v[k])).join(',')+'}':JSON.stringify(v===undefined?null:v);
const igual=(a,b)=>canon(a)===canon(b);
const chaveItem=x=>x&&typeof x==='object'&&!Array.isArray(x)?(x.id!=null?'i:'+x.id:x.clienteId!=null?'c:'+x.clienteId:null):null;
function mergeLista(b,l,r){
  const mapa=a=>new Map(a.map(x=>[chaveItem(x),x])), mb=mapa(b), ml=mapa(l), mr=mapa(r);
  const ordem=[...new Set([...r.map(chaveItem),...l.map(chaveItem)])], res=[];
  ordem.forEach(k=>{ const xb=mb.get(k), xl=ml.get(k), xr=mr.get(k);
    const v=igual(xl,xb)?xr:igual(xr,xb)?xl:(xl!==undefined?xl:xr);   /* os dois mexeram: vale o daqui */
    if(v!==undefined)res.push(v) });
  return res;
}
function merge3(b,l,r){
  b=b||{}; l=l||{}; r=r||{}; const out={};
  new Set([...Object.keys(l),...Object.keys(r)]).forEach(k=>{
    const vb=b[k], vl=l[k], vr=r[k]; let v;
    if(Array.isArray(vl)&&Array.isArray(vr)&&vl.concat(vr).every(chaveItem))v=mergeLista(Array.isArray(vb)?vb:[],vl,vr);
    else v=igual(vl,vb)?vr:vl;
    if(v!==undefined)out[k]=v });
  return out;
}
function parteDe(obj,p){ const o={};
  Object.keys(obj).forEach(k=>{ if(k==='tema'||k==='area')return; if(CLINICO.includes(k)===(p==='clinico'))o[k]=obj[k] });
  return JSON.parse(JSON.stringify(o)) }
const partes=()=>podeClinico()?['dados','clinico']:['dados'];
function aplicaParte(p,estado){
  const t=S.tema;
  Object.keys(parteDe(S,p)).forEach(k=>{ if(!(k in estado))delete S[k] });
  Object.assign(S,JSON.parse(JSON.stringify(estado)));
  S.tema=t; S.area=CONTA.area; normalizar(); salvarLocal(); renderSeguro();
}
const pendente=()=>CONTA&&partes().some(p=>!igual(parteDe(S,p),(BASE[p]||{estado:{}}).estado));
async function sincParte(p,tent){
  const cid=CONTA.cid, rem=((await api(`/rest/v1/${p}?select=estado,versao&clinica_id=eq.${cid}`))||[])[0];
  if(!rem||!CONTA||CONTA.cid!==cid)return;
  const base=BASE[p]||{estado:{},versao:-1}, local=parteDe(S,p);
  let fim=local;
  if(base.versao<0){
    /* aparelho sem histórico (acabou de entrar): o que está na nuvem manda. Os valores padrão daqui não são mudanças de ninguém */
    if(rem.versao>0){ fim=JSON.parse(JSON.stringify(rem.estado||{})); aplicaParte(p,fim) }
  }else if(rem.versao!==base.versao){ fim=merge3(base.estado,local,rem.estado||{}); if(!igual(fim,local))aplicaParte(p,fim) }
  BASE[p]={estado:rem.estado||{},versao:rem.versao}; gravarJ(CHAVE+':base',BASE);
  if(igual(fim,rem.estado||{}))return;
  try{ const nova=await rpc('salvar',{p_cid:cid,p_parte:p,p_estado:fim,p_versao:rem.versao});
    BASE[p]={estado:fim,versao:+nova}; gravarJ(CHAVE+':base',BASE) }
  catch(e){ if(/conflito/.test(e.message)&&(tent||0)<3)return sincParte(p,(tent||0)+1); throw e }
}
async function sincronizar(){
  if(!CONTA||!SES)return;
  if(syncRodando){ syncFila=true; return }
  syncRodando=true; syncEst='indo'; pintaSync();
  try{ if(ehDono()&&UI.clinica!==CONTA.clinica){
      await api(`/rest/v1/clinicas?id=eq.${CONTA.cid}`,{metodo:'PATCH',corpo:{nome:UI.clinica}}); CONTA.clinica=UI.clinica; gravarJ(K_CONTA,CONTA) }
    for(const p of partes())await sincParte(p);
    syncEst='ok' }
  catch(e){ syncEst=e.rede?'off':'erro'; if(e.status===401)sairDaConta(true,'A sessão expirou. Entre de novo.') }
  syncRodando=false; pintaSync();
  if(syncFila){ syncFila=null; sincronizar() }
}
let tSync=null;
function agendaSync(){ clearTimeout(tSync); syncEst=syncEst==='off'?'off':'espera'; pintaSync(); tSync=setTimeout(sincronizar,1200) }
function renderSeguro(){
  const at=document.activeElement;
  if(document.querySelector('.sheet-bg')||document.querySelector('.ob')||document.querySelector('#porta')||(at&&/^(INPUT|TEXTAREA|SELECT)$/.test(at.tagName))){ renderPendente=true; return }
  renderPendente=false; render();
}
setInterval(()=>{ if(renderPendente)renderSeguro() },2500);
setInterval(()=>{ if(CONTA&&!document.hidden)sincronizar() },30000);
addEventListener('online',()=>{ if(CONTA)sincronizar() });
document.addEventListener('visibilitychange',()=>{ if(CONTA&&!document.hidden)sincronizar() });
function pintaSync(){
  let s=$('#sync-st');
  if(!CONTA){ if(s)s.remove(); return }
  if(!s){ const l=$('.logo-tx'); if(!l)return; s=document.createElement('span'); s.id='sync-st'; s.setAttribute('role','status'); l.appendChild(s) }
  const m={ok:['ok','Salvo na nuvem'],indo:['indo','Sincronizando…'],espera:['indo','Salvando…'],off:['off','Sem internet · salvo neste aparelho'],erro:['erro','Não sincronizou · tento de novo']}[syncEst]||['indo','Conectando…'];
  s.className='sync '+m[0]; s.textContent=m[1];
}

/* ── sair de verdade ── */
function sairDaConta(sem,aviso){
  const fazer=()=>{ const cid=CONTA&&CONTA.cid;
    if(SES)sb('/auth/v1/logout',{metodo:'POST'}).catch(()=>{});
    if(cid){ try{ localStorage.removeItem('lucra:nuvem:'+cid); localStorage.removeItem('lucra:nuvem:'+cid+':base') }catch(e){} }
    gravarJ(K_SES,null); gravarJ(K_CONTA,null); SES=null; CONTA=null; BASE={};
    document.body.classList.remove('nuvem','papel-dono','papel-profissional','papel-recepcao'); pintaSync();
    S=JSON.parse(JSON.stringify(PAD)); $('#view').innerHTML='';
    porta('entrar',aviso||'') };
  if(sem)return fazer();
  if(pendente())return confirmar('Ainda tem coisa para enviar','O que você lançou por último ainda não chegou na nuvem. Conecte à internet e espere aparecer "Salvo na nuvem". Se sair agora, isso se perde.','Sair mesmo assim',fazer);
  confirmar('Sair da conta?','Para entrar de novo, use o seu e-mail e senha.','Sair',fazer);
}

async function nuvemIniciar(depois){
  depoisDeEntrar=depois;
  const h=location.hash.slice(1);
  if(/access_token=|error=/.test(h)){
    const q=new URLSearchParams(h); history.replaceState(null,'',location.pathname+location.search);
    if(q.get('error'))return porta('entrar',/expired/i.test(q.get('error_code')||q.get('error_description')||'')?'O link expirou. Entre com e-mail e senha ou peça outro.':'Não deu para usar esse link. Entre com e-mail e senha.');
    SES={access_token:q.get('access_token'),refresh_token:q.get('refresh_token'),expires_at:+q.get('expires_at')||Math.floor(Date.now()/1000)+(+q.get('expires_in')||3600),user:{}};
    try{ const u=await sb('/auth/v1/user'); SES.user={id:u.id,email:u.email}; gravarJ(K_SES,SES) }catch(e){ SES=null; return porta('entrar',msgErro(e)) }
    if(q.get('type')==='recovery')return porta('nova');
    return entrar();
  }
  SES=lerJ(K_SES);
  if(!SES||!SES.access_token||!SES.user||!SES.user.id){ SES=null; return porta('entrar') }
  entrar();
}

    if(q('#ob-pula'))q('#ob-pula').onclick=()=>{ guarda(); passo++; desenha() };
    if(q('#ob-fora'))q('#ob-fora').onclick=()=>sair();
    if(q('#ob-demo'))q('#ob-demo').onclick=()=>{ demoArea(); sair('Exemplo carregado') };
    if(q('#ob-fim'))q('#ob-fim').onclick=()=>{ const tem=!!serv(servId); sair(); if(!tem)ir('servicos') };
    if(q('#ob-cx'))q('#ob-cx').onclick=()=>{ sair(); ir('registrar') };
    bg.querySelectorAll('[data-sug]').forEach(b=>b.onclick=()=>{ guarda(); const i=b.dataset.sug;
      if(sel[i])delete sel[i]; else sel[i]={preco:SUGX()[i][1],custo:SUGX()[i][2]}; const y=bg.scrollTop; desenha(); bg.scrollTop=y });
    bg.querySelectorAll('[data-tira]').forEach(b=>b.onclick=()=>{ guarda(); delete sel[b.dataset.tira]; const y=bg.scrollTop; desenha(); bg.scrollTop=y });
    bg.querySelectorAll('[data-area]').forEach(b=>b.onclick=()=>{ guarda(); mudaArea(b.dataset.area,true); desenha() });
    bg.querySelectorAll('[data-eq]').forEach(b=>b.onclick=()=>{ UI.mod.equipe=b.dataset.eq==='1'; salvarUI();
      bg.querySelectorAll('[data-eq]').forEach(z=>z.setAttribute('aria-pressed',String(z===b))) });
    bg.querySelectorAll('[data-meta]').forEach(b=>b.onclick=()=>{ q('#ob-meta').value=b.dataset.meta; q('#ob-ok').focus() });
    const f=q('[data-foco]')||q('#ob-ok')||q('#ob-fim'); if(f)setTimeout(()=>{try{f.focus({preventScroll:true})}catch(e){}},80);
  };
  bg.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.tagName==='INPUT'&&q('#ob-ok')){ e.preventDefault(); avanca() } });
  desenha();
}

/* ── exemplo ── */
/* Exemplo com preços de mercado de 2026 e taxas reais da InfinitePay
   (Mastercard/Visa, faturamento até R$ 20 mil). Custos de produto são
   estimativas de mercado — cada clínica ajusta para os próprios. */
function demo(){
  const t=S.tema;
  S=JSON.parse(JSON.stringify(PAD)); S.tema=t; S.meta=25000; S.imposto=6;
  const sv=[
    {nome:'Limpeza de pele profunda',        preco:220,  custo:24,  comissao:30, retorno:45,  qtd:22},
    {nome:'Peeling químico superficial',     preco:280,  custo:45,  comissao:30, retorno:30,  qtd:6},
    {nome:'Microagulhamento facial',         preco:380,  custo:90,  comissao:30, retorno:30,  qtd:8},
    {nome:'Radiofrequência facial',          preco:200,  custo:15,  comissao:30, retorno:15,  qtd:10},
    {nome:'Drenagem linfática (1h)',         preco:130,  precoMax:160, custo:12, comissao:40, retorno:7, qtd:18},
    {nome:'Massagem modeladora (1h)',        preco:150,  precoMax:200, custo:15, comissao:40, retorno:7, qtd:8},
    {nome:'Criolipólise · 1 área',           preco:480,  custo:60,  comissao:20, retorno:60,  qtd:6},
    {nome:'Laser · axilas',                  preco:150,  custo:18,  comissao:20, retorno:40,  qtd:14},
    {nome:'Laser · virilha completa',        preco:280,  custo:30,  comissao:20, retorno:40,  qtd:7},
    {nome:'Toxina botulínica · 3 áreas',     preco:1500, custo:520, comissao:0,  retorno:180, qtd:3}
  ].map(s=>Object.assign({id:uid()},s));
  S.servicos=sv.map(({id,nome,preco,precoMax,custo,comissao,retorno})=>
    ({id,nome,preco,precoMax:precoMax||0,custo,comissao,retorno}));
  S.custoDomicilio=35;

  /* mês fechado anterior, para o exemplo ter um mês inteiro de movimento */
  const h=new Date(), ant=new Date(h.getFullYear(),h.getMonth()-1,1);
  const mes=`${ant.getFullYear()}-${String(ant.getMonth()+1).padStart(2,'0')}`;
  const ultimo=new Date(ant.getFullYear(),ant.getMonth()+1,0).getDate();
  const dia=d=>`${mes}-${String(Math.max(1,Math.min(ultimo,d))).padStart(2,'0')}`;

  /* mistura de pagamento parecida com a de clínica pequena */
  const formas=[['pix',1],['pix',1],['pix',1],['debito',1],['debito',1],
    ['cred1',1],['cred1',1],['cred1',1],['parc',3],['parc',3],['parc',6],['parc',10]];
  let seed=20261101; const rnd=n=>{seed=(seed*1103515245+12345)%2147483648;return Math.floor(seed/2147483648*n)};

  S.clientes=['Juliana Prado','Camila Torres','Fernanda Lopes','Patrícia Melo','Roberta Dias','Luana Freitas']
    .map(n=>({id:uid(),nome:n,tel:'',email:'',nasc:'',obs:''}));

  sv.forEach(s=>{ for(let i=0;i<s.qtd;i++){
    const f=formas[rnd(formas.length)];
    /* procedimento caro quase nunca sai à vista no débito */
    const forma=(s.preco>=480&&f[0]==='debito')?'parc':f[0];
    const parc=forma==='parc'?(f[0]==='parc'?f[1]:6):1;
    const c=S.clientes[rnd(S.clientes.length)];
    S.vendas.push({id:uid(),data:dia(1+rnd(ultimo)),servicoId:s.id,valor:s.preco,
      forma,parcelas:parc,clienteId:c.id,cliente:c.nome});
  }});

  /* pacotes vendidos e atendimento em domicílio */
  const eu=S.clientes[0];
  S.vendas.push({id:uid(),data:dia(9),servicoId:sv[4].id,valor:700,forma:'pix',parcelas:1,
    sessoes:5,usadas:[dia(9),dia(13),dia(17)],desloc:0,clienteId:eu.id,cliente:eu.nome});
  S.vendas.push({id:uid(),data:dia(16),servicoId:sv[5].id,valor:1500,forma:'parc',parcelas:2,
    sessoes:10,usadas:[dia(16),dia(20)],desloc:35,clienteId:eu.id,cliente:eu.nome});

  /* alguns horários marcados para os próximos dias */
  const hj=hojeISO();
  const horas=['09:00','10:30','13:00','14:30','16:00','17:30'];
  for(let d=0;d<6;d++){ const qt=d===0?3:1+rnd(3);
    for(let i=0;i<qt;i++){
      const s=sv[rnd(sv.length)], c=S.clientes[rnd(S.clientes.length)];
      S.agenda.push({id:uid(),data:somaDias(hj,d),hora:horas[(i+d)%horas.length],
        clienteId:c.id,servicoId:s.id,obs:'',status:'marcado'});
    }}

  S.despesas=[
    {id:uid(),data:dia(5),  desc:'Aluguel da sala',                 valor:2200, servicoId:''},
    {id:uid(),data:dia(5),  desc:'Energia, água e internet',        valor:480,  servicoId:''},
    {id:uid(),data:dia(6),  desc:'Contador',                        valor:300,  servicoId:''},
    {id:uid(),data:dia(7),  desc:'Impulsionamento no Instagram',    valor:400,  servicoId:''},
    {id:uid(),data:dia(8),  desc:'Compra de toxina botulínica',     valor:1600, servicoId:sv[9].id},
    {id:uid(),data:dia(10), desc:'Cosméticos e descartáveis',       valor:520,  servicoId:sv[0].id},
    {id:uid(),data:dia(14), desc:'Ponteiras de microagulhamento',   valor:700,  servicoId:sv[2].id},
    {id:uid(),data:dia(18), desc:'Mantas e gel de criolipólise',    valor:380,  servicoId:sv[6].id},
    {id:uid(),data:dia(22), desc:'Óleos e cremes de massagem',      valor:240,  servicoId:sv[4].id},
    {id:uid(),data:dia(25), desc:'Sistema de agendamento',          valor:150,  servicoId:''}
  ];
  mesSel=mes;
  salvar();
}
