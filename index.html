    </div>
    <div class="grid2">
      <div class="field"><label>Forma de pagamento</label>
        <select id="f-forma">${FORMAS.map(f=>`<option value="${f.k}" ${edV&&edV.forma===f.k?'selected':''}>${f.n}</option>`).join('')}</select></div>
      <div class="field" id="box-parc" style="display:${edV&&edV.forma==='parc'?'':'none'}"><label>Parcelas</label>
        <select id="f-parc">${Array.from({length:11},(_,i)=>i+2).map(n=>`<option value="${n}" ${edV&&edV.parcelas===n?'selected':''}>${n}x</option>`).join('')}</select></div>
    </div>
    <div class="grid2">
      <div class="field"><label>Pacote de sessões</label>
        <select id="f-sess">${Array.from({length:12},(_,i)=>i+1).map(n=>
          `<option value="${n}" ${edV&&(edV.sessoes||1)===n?'selected':''}>${n===1?'Sessão avulsa':n+' sessões'}</option>`).join('')}</select></div>
      ${ehPsico()?`<input type="hidden" id="f-desloc" value="${edV&&edV.desloc?edV.desloc:''}">`:`<div class="field"><label>Ir até o cliente (R$ por visita)</label>
        <input id="f-desloc" inputmode="decimal" placeholder="0,00 = na sala" value="${edV&&edV.desloc?edV.desloc:''}"></div>`}
    </div>
    ${campoProf('f-prof',edV?edV.profId:'')}
    <div class="field"><label>Cliente</label>
      <select id="f-cli"><option value="">Sem cadastro</option>
      ${S.clientes.slice().sort((a,b)=>a.nome.localeCompare(b.nome)).map(c=>`<option value="${c.id}" ${edV&&edV.clienteId===c.id?'selected':''}>${esc(c.nome)}</option>`).join('')}</select></div>
    <div class="nota" id="previa">Escolha o procedimento e o valor para ver quanto sobra.</div>
    <div class="row" style="margin-top:12px">
      <button class="btn pri" id="f-add" style="flex:1">${ic(edV?'check':'plus')}${edV?'Salvar alterações':'Registrar atendimento'}</button>
      ${edV?'<button class="btn soft" id="f-cancel">Cancelar</button>':''}</div>
  </div></div>`;

  if(todasV.length+todasD.length>4)
    x+=`<div class="sec" data-cx="busca"><input id="x-busca" type="search" placeholder="buscar por procedimento, cliente, descrição, data ou valor" value="${esc(buscaCx)}"></div>`;

  x+=`<div class="sec" data-cx="atd"><div class="sec-top"><h2>Atendimentos do mês</h2>
    <span class="pill">${vs.length}${qx&&todasV.length!==vs.length?' de '+todasV.length:''}</span></div><div class="card">`;
  if(!vs.length){ x+=`<div class="vazio"><b>${qx?'Nada encontrado':'Nenhum atendimento ainda'}</b>
    <p>${qx?'Tente outro termo.':'Toque em Registrar a cada cliente atendido. Na hora você já vê quanto sobra depois da maquininha e do produto.'}</p></div>` }
  else vs.forEach(v=>{ const c=conta(v);
    x+=`<div class="item"><div class="mn"><b>${esc(c.nome)} ${c.sessoes>1?`<span class="pill">pacote ${c.usadas}/${c.sessoes}</span>`:''} ${c.estornado?'<span class="pill bad">estornado</span>':''}</b>
      <small>${dataBR(v.data)} · ${FORMAS.find(f=>f.k===v.forma)?.n||v.forma}${v.forma==='parc'?' '+v.parcelas+'x':''}${nomeCli(v)?' · '+esc(nomeCli(v)):''}${nomeProf(v)?' · atendeu '+esc(nomeProf(v)):''}${c.desloc?' · domicílio':''}${c.estornado?' · devolvido '+brl(c.devolvido):''}</small></div>
      <div class="vr">${brl(c.bruto)}<small class="${c.lucro>=0?'v-ok':'v-bad'}">${c.estornado?'resultado':'sobra'} ${brl(c.lucro)}</small></div>
      <div class="acts">
      ${c.sessoes>1&&c.restam&&!c.estornado?`<button class="btn sm pri" data-ses-v="${v.id}">${ic('check',16)}Usar sessão</button>`:''}
      <button class="btn sm soft" data-ed-v="${v.id}" aria-label="Editar" title="Editar">${ic('edit',16)}Editar</button>
      <button class="btn sm danger ic" data-del-v="${v.id}" aria-label="Excluir">${ic('trash',18)}</button></div></div>`});
  x+=`</div></div>`;

  x+=cxTag('atd',secReceber());
  x+=cxTag('sai',secContas());

  const edD=S.despesas.find(d=>d.id===emEdicao('desp'));
  x+=`<div class="sec" data-cx="sreg"><div class="card" ${edD?'style="border-color:var(--ac)"':''}>
    <h2 style="margin-bottom:12px">${edD?'Editar saída':'Registrar saída'}</h2>
    <div class="grid2">
      <div class="field"><label>Descrição</label><input id="d-desc" placeholder="aluguel, compra de toxina..." value="${edD?esc(edD.desc||''):''}"></div>

    </div>
    <div class="grid2">
      <div class="field"><label>Data</label><input id="d-data" type="date" value="${edD?edD.data:hojeISO()}"></div>
      ${ehPsico()?'<input type="hidden" id="d-serv" value="">':`<div class="field"><label>É compra de produto de qual serviço?</label>
        <select id="d-serv"><option value="">Não é produto (despesa geral)</option>
        ${S.servicos.map(s=>`<option value="${s.id}" ${edD&&edD.servicoId===s.id?'selected':''}>${esc(s.nome)}</option>`).join('')}</select></div>`}
    </div>
    <div class="row">
      <button class="btn ${edD?'pri':'soft'}" id="d-add" style="flex:1">${ic(edD?'check':'plus')}${edD?'Salvar alterações':'Registrar saída'}</button>
      ${edD?'<button class="btn soft" id="d-cancel">Cancelar</button>':''}</div>
  </div></div>`;

  x+=`<div class="sec" data-cx="sai"><div class="sec-top"><h2>Saídas do mês</h2>
    <span class="pill">${ds.length}${qx&&todasD.length!==ds.length?' de '+todasD.length:''}</span></div><div class="card">`;
  if(!ds.length){ x+=`<div class="vazio"><b>${qx?'Nada encontrado':'Nenhuma saída registrada'}</b>
    <p>${qx?'Tente outro termo.':'Lance aluguel, luz, internet e compras de produto. Sem as saídas, a sobra do mês parece maior do que é.'}</p></div>` }
  else ds.forEach(d=>{ const s=serv(d.servicoId);
    x+=`<div class="item"><div class="mn"><b>${esc(d.desc||'Saída')}</b>
      <small>${dataBR(d.data)}${s?' · produto de '+esc(s.nome):''}</small></div>
      <div class="vr v-bad">${brl(-num(d.valor))}</div>
      <div class="acts"><button class="btn sm soft" data-ed-d="${d.id}" aria-label="Editar" title="Editar">${ic('edit',16)}Editar</button>
      <button class="btn sm danger ic" data-del-d="${d.id}" aria-label="Excluir">${ic('trash',18)}</button></div></div>`});
  x+=`</div></div>`;

  el.innerHTML=x; ligarMes();
  ligarContas(); ligarReceber();
  const bx=$('#x-busca');
  if(bx)bx.addEventListener('input',()=>{buscaCx=bx.value;const pz=bx.selectionStart;render();
    const n=$('#x-busca');if(n){n.focus();try{n.setSelectionRange(pz,pz)}catch(e){}}});

  const fs=$('#f-serv'), fv=$('#f-valor'), ff=$('#f-forma'), fp=$('#f-parc'),
        fn=$('#f-sess'), fd=$('#f-desloc');
  const sincronizar=()=>{
    $('#box-parc').style.display = ff.value==='parc'?'':'none';
    const s=serv(fs.value); if(s&&!fv.value)fv.placeholder=String(s.preco).replace('.',',');
    const n=parseInt(fn.value)||1;
    const valor=num(fv.value)||(s?s.preco*n:0);
    const c=conta({servicoId:fs.value,valor,forma:ff.value,parcelas:fp.value,sessoes:n,desloc:num(fd.value)});
    $('#previa').innerHTML=`Cobrando <b>${brl(c.bruto)}</b>${n>1?` pelas ${n} sessões (<b>${brl(c.porSessao)}</b> cada)`:''}:
      maquininha <b>${brl(c.taxa)}</b> (${pct(c.tx)}),
      ${ehPsico()&&!c.custo?'':`produto <b>${brl(c.custo)}</b>${n>1?` (${n}×)`:''}`}${c.desloc?`, deslocamento <b>${brl(c.desloc)}</b>`:''}${c.comissao?`, comissão <b>${brl(c.comissao)}</b> (${pct(c.cp)})`:''}${c.imposto?`, imposto <b>${brl(c.imposto)}</b>`:''}.
      Sobra <b class="${c.lucro>=0?'v-ok':'v-bad'}">${brl(c.lucro)}</b> (${pct(c.margem)}).`;
  };
  [fs,fv,ff,fp,fn,fd].forEach(e=>{e.addEventListener('input',sincronizar);e.addEventListener('change',sincronizar)});
  sincronizar();

  $('#f-add').onclick=()=>{
    const s=serv(fs.value); if(!s)return toast('Escolha um procedimento');
    const n=parseInt(fn.value)||1;
    const valor=num(fv.value)||s.preco*n;
    if(valor<=0)return toast('Informe o valor cobrado');
    const cid=$('#f-cli').value;
    const dados={data:$('#f-data').value||hojeISO(),servicoId:s.id,valor,
      forma:ff.value,parcelas:ff.value==='parc'?parseInt(fp.value):1,
      sessoes:n,desloc:num(fd.value),profId:$('#f-prof')?$('#f-prof').value:((edV&&edV.profId)||''),
      clienteId:cid,cliente:cid?(cli(cid)||{}).nome:''};
    if(edV&&Array.isArray(edV.usadas)&&edV.usadas.length>n)edV.usadas.length=n;
    mesSel=mesDe(dados.data);
    if(edV){ Object.assign(edV,dados); salvar(); toast('Atendimento atualizado'); fecharEdicao() }
    else { S.vendas.push(Object.assign({id:uid(),usadas:n>1?[dados.data]:[]},dados));
      salvar(); toast(n>1?'Pacote registrado · 1ª sessão marcada':'Atendimento registrado'); render() }
  };
  if($('#f-cancel'))$('#f-cancel').onclick=fecharEdicao;
  document.querySelectorAll('[data-ed-v]').forEach(b=>b.onclick=()=>abrirEdicao('venda',b.dataset.edV));
  document.querySelectorAll('[data-ses-v]').forEach(b=>b.onclick=()=>usarSessao(b.dataset.sesV));
  document.querySelectorAll('[data-desfaz-v]').forEach(b=>b.onclick=()=>{
    const v=S.vendas.find(z=>z.id===b.dataset.desfazV); if(!v)return;
    confirmar('Desfazer o estorno?','Este atendimento volta a contar normalmente nos números do mês.','Desfazer estorno',
      ()=>{ delete v.estorno; salvar(); toast('Estorno desfeito'); render() });
  });
  document.querySelectorAll('[data-est-v]').forEach(b=>b.onclick=()=>estornar(b.dataset.estV));
  $('#d-add').onclick=()=>{
    const v=num($('#d-valor').value); if(v<=0)return toast('Informe o valor da saída');
    const dados={data:$('#d-data').value||hojeISO(),desc:$('#d-desc').value.trim(),
      valor:v,servicoId:$('#d-serv').value||''};
    if(edD){ Object.assign(edD,dados); salvar(); toast('Saída atualizada'); fecharEdicao() }
    else { S.despesas.push(Object.assign({id:uid()},dados)); salvar(); toast('Saída registrada'); render() }
  };
  if($('#d-cancel'))$('#d-cancel').onclick=fecharEdicao;
  document.querySelectorAll('[data-ed-d]').forEach(b=>b.onclick=()=>abrirEdicao('desp',b.dataset.edD));
  document.querySelectorAll('[data-del-v]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.delV;
    confirmar('Excluir este atendimento?','Ele sai do caixa e dos números do mês. Não dá para desfazer.','Excluir',
      ()=>{ S.vendas=S.vendas.filter(v=>v.id!==id); salvar(); render(); toast('Excluído') },true)});
  document.querySelectorAll('[data-del-d]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.delD;
    confirmar('Excluir esta saída?','Ela deixa de ser descontada da sobra do mês. Não dá para desfazer.','Excluir',
      ()=>{ S.despesas=S.despesas.filter(d=>d.id!==id); salvar(); render(); toast('Excluída') },true)});
};

/* ── pacotes: marcar uma sessão como usada ── */
function pacotesAbertos(){
  return S.vendas.filter(v=>!v.estorno&&(parseInt(v.sessoes)||1)>1)
    .map(v=>({venda:v,c:conta(v),cliente:cli(v.clienteId)}))
    .filter(p=>p.c.restam>0)
    .sort((a,b)=>a.venda.data.localeCompare(b.venda.data));
}
function usarSessao(id,aoTerminar){
  const v=S.vendas.find(z=>z.id===id); if(!v)return;
  const c=conta(v), q=cli(v.clienteId);
  if(!Array.isArray(v.usadas))v.usadas=[];
  abrirSheet('Marcar sessão do pacote',
    `${q?esc(q.nome)+' · ':''}${esc(c.nome)} · ${c.usadas} de ${c.sessoes} já feitas`,
    `<div class="field"><label>Dia da sessão</label><input id="ps-data" type="date" value="${hojeISO()}"></div>
     <div class="nota">O pacote já foi pago em ${dataBR(v.data)}, então esta sessão não entra como novo faturamento.
       Ela só desconta do saldo: ficam <b>${c.restam-1}</b> depois desta.</div>
     ${c.usadas?`<button class="btn soft full" id="ps-undo" style="margin-top:12px">Desfazer a última sessão marcada</button>`:''}
     <div class="row" style="margin-top:12px">
       <button class="btn pri" id="ps-ok" style="flex:1">Marcar sessão</button>
       <button class="btn soft" id="ps-no">Cancelar</button></div>`,
    fechar=>{
      $('#ps-no').onclick=fechar;
      if($('#ps-undo'))$('#ps-undo').onclick=()=>{
        v.usadas.pop(); salvar(); fechar(); toast('Sessão desfeita'); render();
        if(aoTerminar)setTimeout(aoTerminar,240);
      };
      $('#ps-ok').onclick=()=>{
        v.usadas.push($('#ps-data').value||hojeISO());
        if(v.usadas.length>c.sessoes)v.usadas.length=c.sessoes;
        salvar(); fechar();
        toast(c.restam-1<=0?'Pacote concluído':`Sessão marcada · faltam ${c.restam-1}`);
        render(); if(aoTerminar)setTimeout(aoTerminar,240);
      };
    });
}

/* ── estorno de um atendimento ── */
function estornar(id,aoTerminar){
  const v=S.vendas.find(z=>z.id===id); if(!v)return;
  const base=conta(v), c=cli(v.clienteId);
  abrirSheet('Cancelar e estornar',`${c?esc(c.nome)+' · ':''}${esc(base.nome)} · ${brl(base.bruto)}`,
    `<div class="field"><label>Valor devolvido ao cliente</label>
       <input id="e-valor" inputmode="decimal" value="${base.bruto}"></div>
     <p class="sub" style="margin:-4px 0 12px">Devolveu só parte? Coloque o valor devolvido. O que ficou retido conta como multa de cancelamento.</p>
     <div class="card" style="padding:4px 14px;margin-bottom:12px">
       <div class="ck-l"><label class="sw"><input type="checkbox" id="e-tx"> <span>A maquininha devolveu a taxa</span></label>
         <small>Na maioria das maquininhas a taxa <b>não</b> volta num estorno.</small></div>
       ${ehPsico()?'<input type="checkbox" id="e-prod" checked hidden>':`<div class="ck-l"><label class="sw"><input type="checkbox" id="e-prod" checked> <span>O produto já tinha sido usado</span></label>
         <small>Se o procedimento foi feito, o insumo não volta para o estoque.</small></div>`}
       <div class="ck-l"><label class="sw"><input type="checkbox" id="e-com"> <span>A comissão já foi paga</span></label>
         <small>Se já caiu para quem atendeu, não dá para recuperar.</small></div>
       <div class="ck-l"><label class="sw"><input type="checkbox" id="e-imp" checked> <span>O imposto é recuperável</span></label>
         <small>Costuma ser, quando o estorno acontece no mesmo mês.</small></div>
     </div>
     <div class="field"><label>Motivo (opcional)</label>
       <input id="e-motivo" placeholder="desistiu, reação alérgica, remarcou..."></div>
     <div class="nota" id="e-previa"></div>
     <div class="row" style="margin-top:14px">
       <button class="btn pri" id="e-ok" style="flex:1">${ic('undo')}Confirmar estorno</button>
       <button class="btn soft" id="e-no">Cancelar</button></div>`,
    fechar=>{
      const campos=['#e-valor','#e-tx','#e-prod','#e-com','#e-imp'].map(s=>$(s));
      const monta=()=>({valor:num($('#e-valor').value),taxaVolta:$('#e-tx').checked,
        produtoUsado:$('#e-prod').checked,comissaoPaga:$('#e-com').checked,impostoVolta:$('#e-imp').checked});
      const atualiza=()=>{
        const k=conta(Object.assign({},v,{estorno:monta()}));
        const perda=base.lucro-k.lucro;
        $('#e-previa').innerHTML=`Você devolve <b>${brl(k.devolvido)}</b> e recupera <b>${brl(k.recuperado)}</b>
          de taxa, produto, comissão ou imposto.<br>
          Este atendimento, que ia deixar <b>${brl(base.lucro)}</b>, passa a deixar
          <b class="${k.lucro>=0?'v-ok':'v-bad'}">${brl(k.lucro)}</b>
          — uma perda de <b class="v-bad">${brl(perda)}</b>.`;
      };
      campos.forEach(e=>{e.addEventListener('input',atualiza);e.addEventListener('change',atualiza)});
      atualiza();
      $('#e-no').onclick=fechar;
      $('#e-ok').onclick=()=>{
        const d=monta(); if(d.valor<=0)return toast('Informe o valor devolvido');
        v.estorno=Object.assign(d,{data:hojeISO(),motivo:$('#e-motivo').value.trim()});
        salvar(); fechar(); toast('Estorno registrado'); render();
        if(aoTerminar)setTimeout(aoTerminar,240);
      };
    });
}

/* ══════════ SIMULADOR ══════════ */
T.sim=function(el){
  let x=`<h1>Simulador</h1><p class="sub">Antes de fechar o preço, veja quanto sobra para você</p>${S.servicos.length?abasSim():''}`;
  if(simAba==='orc'&&S.servicos.length)return telaOrc(el,x);
  if(!S.servicos.length){
    x+=`<div class="card" style="margin-top:14px"><div class="vazio"><b>Cadastre um serviço primeiro</b>
      <p>Com um serviço cadastrado, você compara Pix, débito e crédito parcelado e vê quanto cada forma de pagamento tira do seu lucro.</p>
      <button class="btn pri" id="ir-serv">${ic('arrow')}Ir para Serviços</button></div></div>`;
    el.innerHTML=x; $('#ir-serv').onclick=()=>ir('servicos'); return;
  }
  x+=`<div class="sec"><div class="card">
    <div class="grid2">
      <div class="field"><label>Procedimento</label>
        <select id="x-serv">${S.servicos.map(s=>`<option value="${s.id}">${esc(s.nome)}${s.precoMax?' · '+brl(s.preco)+' a '+brl(s.precoMax):''}</option>`).join('')}</select></div>
      <div class="field"><label>Valor a cobrar</label><input id="x-valor" inputmode="decimal" placeholder="usa o preço do serviço"></div>
    </div>
  </div></div>
  <div class="sec" id="x-res"></div>`;
  el.innerHTML=x;

  const calc=()=>{
    const s=serv($('#x-serv').value); if(!s)return;
    const valor=num($('#x-valor').value)||s.preco;
    const linhas=[{k:'pix',n:'Pix',p:1},{k:'dinheiro',n:'Dinheiro',p:1},{k:'debito',n:'Débito',p:1},
      {k:'cred1',n:'Crédito à vista',p:1},{k:'parc',n:'Crédito 2x',p:2},{k:'parc',n:'Crédito 3x',p:3},
      {k:'parc',n:'Crédito 6x',p:6},{k:'parc',n:'Crédito 10x',p:10},{k:'parc',n:'Crédito 12x',p:12}];
    const dados=linhas.map(l=>Object.assign({n:l.n,p:l.p},conta({servicoId:s.id,valor,forma:l.k,parcelas:l.p})));
    const melhor=dados.reduce((a,b)=>b.lucro>a.lucro?b:a);
    const pior=dados.reduce((a,b)=>b.lucro<a.lucro?b:a);
    const maxL=Math.max(...dados.map(d=>Math.abs(d.lucro)))||1;
    let h=`<div class="card">
      <h2>${esc(s.nome)} por ${brl(valor)}</h2>
      <p class="sub" style="margin-bottom:14px">${ehPsico()&&!num(s.custo)?'sessão':'produto '+brl(s.custo)}${s.comissao?` · comissão ${pct(s.comissao)}`:''}${S.imposto?` · imposto ${pct(num(S.imposto))}`:''}</p>`;
    dados.forEach(d=>{
      const dest=d===melhor?'<span class="pill ok">melhor</span>':(d===pior?'<span class="pill bad">pior</span>':'');
      h+=`<div class="simrow">
        <div class="simtop"><b>${d.n}</b>${dest}
          <b class="val ${d.lucro>=0?'v-ok':'v-bad'}">${brl(d.lucro)}</b></div>
        <div class="simsub"><span>taxa ${pct(d.tx)} · ${brl(d.taxa)}</span>
          <span>recebe ${brl(d.liquido)} · ${pct(d.margem)}</span></div>
        <div class="bar"><i style="width:${Math.abs(d.lucro)/maxL*100}%"></i></div></div>`});
    h+=`<div class="nota" style="margin-top:16px">A diferença entre <b>${melhor.n}</b> e <b>${pior.n}</b>
        é de <b>${brl(melhor.lucro-pior.lucro)}</b> neste atendimento.
        Para empatar com o Pix cobrando em 12x, o preço teria que ser
        <b>${brl(valor*(1+(dados[8].tx-dados[0].tx)/100))}</b>.</div>
    </div>`;
    $('#x-res').innerHTML=h;
  };
  $('#x-serv').onchange=calc; $('#x-valor').addEventListener('input',calc); calc();
};

/* ══════════ RESERVAS ══════════ */
T.reserva=function(el){
  const res=reservas(mesSel).sort((a,b)=>b.falta-a.falta);
  const r=resumo(mesSel);
  const total=res.reduce((a,b)=>a+b.reservar,0), gasto=res.reduce((a,b)=>a+b.gasto,0), falta=res.reduce((a,b)=>a+b.falta,0);
  const livre=r.lucro+r.custo-r.compras;   /* sobra, menos o que foi comprado além do que foi usado */

  let x=`<div class="sec-top"><div><h1>${modOn('estoque')?'Reservas e estoque':'Reservas'}</h1>
    <p class="sub">O dinheiro que não é seu: é da reposição</p></div>${seletorMes()}</div>`;

  x+=`<div class="stats" style="margin-top:14px">
    <div class="stat"><span class="lb">Produto consumido</span><span class="vl">${brl(total)}</span>
      <span class="ex">no mês inteiro</span></div>
    <div class="stat"><span class="lb">Já comprado</span><span class="vl v-ok">${brl(gasto)}</span>
      <span class="ex">registrado nas saídas</span></div>
    <div class="stat"><span class="lb">Ainda a separar</span><span class="vl ${falta>0?'v-ac':'v-ok'}">${brl(falta)}</span>
      <span class="ex">${falta>0?'guarde antes de retirar':'nada pendente'}</span></div>
    <div class="stat"><span class="lb">Livre para retirar</span>
      <span class="vl ${livre-falta>=0?'v-ok':'v-bad'}">${brl(livre-falta)}</span>
      <span class="ex">depois de tudo separado</span></div>
  </div>`;

  x+=`<div class="sec"><div class="card">`;
  if(!res.length){ x+=`<div class="vazio"><b>Sem movimento neste mês</b><p>Cada atendimento registrado consome produto. Aqui aparece quanto separar para repor antes de fazer a sua retirada.</p></div>` }
  else res.forEach(a=>{
    const p=a.reservar?Math.min(100,a.gasto/a.reservar*100):100;
    x+=`<div style="padding:13px 0;border-bottom:1px solid var(--line)">
      <div style="display:flex;justify-content:space-between;gap:10px;margin-bottom:8px">
        <div><b style="font-size:14.5px">${esc(a.nome)}</b>
          <div style="font-size:12.5px;color:var(--tx3);font-weight:500">${a.qtd} atendimento(s)</div></div>
        <div style="text-align:right">
          <b style="font-size:14.5px" class="${a.falta>0?'v-ac':'v-ok'}">${a.falta>0?brl(a.falta)+' a separar':'em dia'}</b>
          <div style="font-size:12px;color:var(--tx3);font-weight:600">${brl(a.gasto)} de ${brl(a.reservar)}</div></div>
      </div><div class="bar"><i style="width:${p}%"></i></div></div>`});
  x+=`</div></div>`;

  x+=`<div class="sec"><div class="nota">
    <b>Como ler esta tela.</b> Cada atendimento consome produto. O valor desse produto não é lucro: ele precisa voltar
    para o estoque. Enquanto você não registra a compra nas saídas, ele aparece aqui como <b>a separar</b>.
    Assim o mês não fecha com dinheiro na conta e sem toxina na geladeira.
  </div></div>`;

  x+=secEstoque();
  el.innerHTML=x; ligarMes(); ligarEstoque();
};

  else ret.slice(0,25).forEach(r=>{
    const msg=`Oi, ${r.cliente.nome.split(' ')[0]}! Tudo bem? Já faz ${diasEntre(r.ultimo,hoje)} dias desde a sua última sessão de ${r.servico.nome}. Quer que eu reserve um horário para você?`;

    /* concluir: vira venda, pela folha deslizante */
    const s=serv(a.servicoId); if(!s)return toast('Serviço não existe mais');
    const c=cli(a.clienteId);
    abrirSheet('Fechar atendimento', `${c?esc(c.nome)+' · ':''}${esc(s.nome)}`,

            Sobra <b class="${k.lucro>=0?'v-ok':'v-bad'}">${brl(k.lucro)}</b>.`;
        };
        [kv,kf,kp].forEach(e=>{e.addEventListener('input',atualiza);e.addEventListener('change',atualiza)});
        atualiza();
        $('#k-no').onclick=fechar; ligarExtrasFechar(a,s,fechar);
        $('#k-ok').onclick=()=>{
          const valor=num(kv.value); if(valor<=0)return toast('Informe o valor cobrado');
          S.vendas.push({id:uid(),data:a.data,servicoId:s.id,valor,
            forma:kf.value,parcelas:kf.value==='parc'?parseInt(kp.value):1,
            clienteId:a.clienteId,cliente:nomeCli(a),profId:$('#k-prof')?$('#k-prof').value:''});
          a.status='concluido'; salvar(); fechar();
          toast('Lançado no caixa'); render(); posAtender(a);
        };
      });
  });
};
function linhaAg(a,atrasado){
  const s=serv(a.servicoId), c=cli(a.clienteId);
  const st={concluido:'<span class="pill ok">atendido</span>',faltou:'<span class="pill war">faltou</span>',
    cancelado:'<span class="pill bad">cancelado</span>'}[a.status]||'';
  if(a.status!=='marcado')
    return `<div class="item" data-item-ag="${a.id}" style="opacity:.62"><div class="mn">
      <b>${c?esc(c.nome):'Sem cadastro'} ${st}</b>
      <small>${a.hora?'<b>'+a.hora+'</b> · ':''}${s?esc(s.nome):'serviço removido'}</small></div>
      <div class="acts">${btnNota(a)}<button class="btn sm soft" data-ed-a="${a.id}" aria-label="Editar" title="Editar">${ic('edit',16)}Editar</button>
      <button class="btn sm danger ic" data-ag="${a.id}" data-acao="excluir" aria-label="Excluir">${ic('trash',18)}</button></div></div>`;

    <b>${c?esc(c.nome):'Sem cadastro'} ${pillsMsg(a)}</b>
    <small>${a.hora?'<b>'+a.hora+'</b> · ':''}${s?esc(s.nome):'serviço removido'}${atrasado?' · '+dataBR(a.data):''}${a.serie?' · semanal':''}${a.link?' · online':''}${a.obs?' · '+esc(a.obs):''}</small></div>
    <div class="acts">
      <button class="btn sm pri" data-ag="${a.id}" data-acao="concluir">${ic('check',16)}Atendeu</button>
      ${btnLink(a)}${btnMsg(a)}
      <button class="btn sm soft" data-ag="${a.id}" data-acao="faltou">Faltou</button>
      <button class="btn sm soft" data-ed-a="${a.id}" aria-label="Editar" title="Editar">${ic('edit',16)}Editar</button>
      <button class="btn sm danger ic" data-ag="${a.id}" data-acao="excluir" aria-label="Excluir">${ic('trash',18)}</button></div></div>`;
}

let buscaCli='';
T.clientes=function(el){

  const lista=S.clientes.slice()
    .filter(c=>!q||c.nome.toLowerCase().includes(q)||(c.email||'').toLowerCase().includes(q)

      const vs=S.vendas.filter(v=>v.clienteId===c.id);
      const total=vs.reduce((a,v)=>a+num(v.valor),0);
      const lucro=vs.reduce((a,v)=>a+conta(v).lucro,0);
      const ult=vs.reduce((a,v)=>v.data>a?v.data:a,'');
      return {c,qtd:vs.length,total,lucro,ult};

  let x=`<h1>Clientes</h1><p class="sub">${S.clientes.length} cadastrado(s)${ehPsico()?'':' · quem mais deixa lucro para a clínica'}</p>`;

    </div>
    <div class="grid2"><div class="field"><label>E-mail</label><input id="c-email" type="email" inputmode="email" autocomplete="email"
      placeholder="nome@email.com" value="${ed?esc(ed.email||''):''}"></div>
      <div class="field"><label>CPF (para recibo)</label><input id="c-cpf" inputmode="numeric" placeholder="000.000.000-00" value="${ed?esc(ed.cpf||''):''}"></div></div>
    <div class="grid2">
      <div class="field"><label>Aniversário (opcional)</label><input id="c-nasc" type="date" value="${ed?esc(ed.nasc||''):''}"></div>
      <div class="field"><label>Observação</label><input id="c-obs" placeholder="alergia, preferência, indicação..." value="${ed?esc(ed.obs||''):''}"></div>
    </div>

      <button class="btn pri" id="c-add" style="flex:1">${ic(ed?'check':'plus')}${ed?'Salvar alterações':'Cadastrar cliente'}</button>

  if(S.clientes.length){

    <p>${S.clientes.length?(ordCli==='sumidos'&&!q?'Ninguém está sem aparecer há '+sumidoDias+' dias ou mais. Bom sinal.':'Tente outro nome.'):'Cadastre o primeiro acima. Ligando cada atendimento ao cliente, você descobre quem mais traz lucro e quem já está na hora de voltar.'}</p></div>` }
  else lista.forEach(i=>{

      <div class="acts">

/* histórico de um cliente: o que ele comprou, quando e quanto rendeu */
function historico(id){
  const c=cli(id); if(!c)return;
  const vs=S.vendas.filter(v=>v.clienteId===id).sort((a,b)=>b.data.localeCompare(a.data));
  const total=vs.reduce((a,v)=>a+num(v.valor),0);
  const lucro=vs.reduce((a,v)=>a+conta(v).lucro,0);
  const primeiro=vs.length?vs[vs.length-1].data:'';

  /* agrupado por procedimento, com o retorno previsto */
  const porServ={};
  vs.forEach(v=>{ const k=v.servicoId||'x', s=serv(k);
    const a=porServ[k]||(porServ[k]={nome:s?s.nome:'Serviço removido',retorno:s?s.retorno:0,qtd:0,total:0,ultima:''});
    a.qtd++; a.total+=num(v.valor); if(v.data>a.ultima)a.ultima=v.data; });
  const grupos=Object.values(porServ).sort((a,b)=>b.total-a.total);
  const ags=S.agenda.filter(a=>a.clienteId===id&&a.status==='marcado'&&a.data>=hojeISO())
    .sort((a,b)=>a.data.localeCompare(b.data));

  let corpo=ehPsico()?fichaPac(c,vs,ags):`<div class="stats">
    <div class="stat"><span class="lb">Já pagou</span><span class="vl">${brl(total)}</span>
      <span class="ex">em ${vs.length} atendimento(s)</span></div>
    <div class="stat"><span class="lb">Sobrou para a clínica</span>
      <span class="vl ${lucro>=0?'v-ok':'v-bad'}">${brl(lucro)}</span>
      <span class="ex">já sem taxa, produto, comissão e imposto</span></div>
  </div>`;
  if(!ehPsico())corpo+=`<p class="sub" style="margin-top:10px">${primeiro?'Cliente desde '+dataBR(primeiro):'Sem atendimentos ainda'}${c.tel?' · '+esc(c.tel):''}${c.email?' · '+esc(c.email):''}${c.obs?' · '+esc(c.obs):''}</p>`;

  if(ags.length){
    corpo+=`<div class="sec"><div class="sec-top"><h2>${ehPsico()?'Próximas sessões':'Já agendado'}</h2><span class="pill">${ags.length}</span></div><div class="card">`;
    ags.slice(0,ehPsico()?4:99).forEach(a=>{const s=serv(a.servicoId);
      corpo+=`<div class="item"><div class="mn"><b>${s?esc(s.nome):'serviço removido'}</b>
        <small>${dataBR(a.data)} · ${diaSemana(a.data)}${a.hora?' às '+a.hora:''}</small></div>
        <div class="acts"><button class="btn sm soft" data-adi="${a.id}">${ic('calendar',16)}Adiantar ou mudar</button></div></div>`});
    corpo+=`</div></div>`;
  }

  corpo+=topoHist(c);
  if(!vs.length){
    corpo+=`<div class="sec"><div class="card"><div class="vazio"><b>Ainda não comprou nada</b>
      <p>Quando houver um atendimento registrado para ${esc(c.nome.split(' ')[0])}, ele aparece aqui.</p></div></div></div>`;
  }else{
    if(!ehPsico()){ corpo+=`<div class="sec"><div class="sec-top"><h2>Procedimentos que já fez</h2></div><div class="card">`;
    grupos.forEach(g=>{
      const prev=g.retorno?somaDias(g.ultima,g.retorno):'';
      const atraso=prev?diasEntre(prev,hojeISO()):null;
      corpo+=`<div class="item"><div class="mn"><b>${esc(g.nome)}</b>
        <small>${g.qtd}x · última em ${dataBR(g.ultima)}${prev?' · volta em '+dataBR(prev):''}</small></div>
        <div class="vr">${brl(g.total)}${prev?`<small class="${atraso>=0?'v-ac':''}">${atraso>=0?'em atraso':'em dia'}</small>`:''}</div></div>`});
    corpo+=`</div></div>`; }

    corpo+=`<div class="sec"><div class="sec-top"><h2>${ehPsico()?'Pagamentos':'Cada atendimento'}</h2><span class="pill">${vs.length}</span></div>
      <p class="sub" style="margin-bottom:8px">Precisa devolver o dinheiro de algum? Use o botão de estornar.</p><div class="card">`;
    vs.forEach(v=>{ const k=conta(v);
      corpo+=`<div class="item"><div class="mn"><b>${esc(k.nome)} ${k.estornado?'<span class="pill bad">estornado</span>':''}</b>
        <small>${dataBR(v.data)} · ${FORMAS.find(f=>f.k===v.forma)?.n||v.forma}${v.forma==='parc'?' '+v.parcelas+'x':''}${k.estornado?' · devolvido '+brl(k.devolvido):''}</small></div>
        <div class="vr">${brl(k.bruto)}<small class="${k.lucro>=0?'v-ok':'v-bad'}">${k.estornado?'resultado':'sobrou'} ${brl(k.lucro)}</small></div>
        <div class="acts">${k.estornado
          ?`<button class="btn sm soft" data-desfaz-v="${v.id}">Desfazer estorno</button>`
          :`<button class="btn sm soft" data-est-v="${v.id}">${ic('undo',16)}Estornar</button>`}</div></div>`});
    corpo+=`</div></div>`;
  }
  corpo+=`<div class="sec" id="h-fotos"></div>`;
  corpo+=`<button class="btn soft full" id="h-fechar" style="margin-top:14px">Fechar</button>`;

  abrirSheet(c.nome,ehPsico()?'Ficha do paciente':'Histórico completo',corpo,fechar=>{
    $('#h-fechar').onclick=fechar;
    if(!ehPsico())pintaFotos(id); ligarTopoHist(id,fechar);
    document.querySelectorAll('.sheet [data-est-v]').forEach(b=>b.onclick=()=>{
      const vid=b.dataset.estV; fechar(); setTimeout(()=>estornar(vid,()=>historico(id)),240) });
    document.querySelectorAll('.sheet [data-desfaz-v]').forEach(b=>b.onclick=()=>{
      const v=S.vendas.find(z=>z.id===b.dataset.desfazV); if(!v)return;
      confirmar('Desfazer o estorno?','Este atendimento volta a contar normalmente nos números do mês.','Desfazer estorno',
        ()=>{ delete v.estorno; salvar(); toast('Estorno desfeito'); fechar(); render(); setTimeout(()=>historico(id),320) }) });
  });
}

  <div class="sec"><div class="card">

  </div></div>
  <p class="sub" style="text-align:center;margin-top:26px">Lucra · versão 1</p>`;

  const baixa=(n,t,m)=>{const u=URL.createObjectURL(new Blob([t],{type:m})),a=document.createElement('a');
    a.href=u;a.download=n;a.style.display='none';document.body.appendChild(a);a.click();
    setTimeout(()=>{a.remove();URL.revokeObjectURL(u)},3000)};

  $('#a-nome-ok').onclick=()=>{ UI.clinica=$('#a-nome').value.trim(); salvarUI(); marca(); toast('Nome salvo') };
  $('#a-nome').addEventListener('keydown',e=>{if(e.key==='Enter')$('#a-nome-ok').click()});
  $('#a-ob').onclick=()=>boasVindas();
  ligarAparencia(); ligarMsgs(); ligarMods(); ligarInstalar(); ligarAjustesArea();
  $('#a-exp').onclick=()=>exportarBackup();
  $('#a-csv').onclick=()=>{
    let c='tipo;data;descricao;forma;bruto;taxa;custo;lucro\n';
    S.vendas.forEach(v=>{const k=conta(v);
      c+=`venda;${v.data};${(k.nome||'').replace(/;/g,',')};${v.forma}${v.forma==='parc'?' '+v.parcelas+'x':''};${k.bruto.toFixed(2)};${k.taxa.toFixed(2)};${k.custo.toFixed(2)};${k.lucro.toFixed(2)}\n`});
    S.despesas.forEach(d=>{c+=`saida;${d.data};${(d.desc||'').replace(/;/g,',')};;-${num(d.valor).toFixed(2)};;;\n`});
    baixa('lucra-movimento.csv',c,'text/csv;charset=utf-8');
  };
  $('#a-imp').onclick=()=>{
    const i=document.createElement('input'); i.type='file'; i.accept='application/json,.json';
    i.onchange=()=>{const f=i.files&&i.files[0]; if(!f)return; const rd=new FileReader();
      el.innerHTML=ESQUELETO;                       /* lendo o arquivo: mostra o esqueleto */
      rd.onerror=()=>{toast('Não consegui ler o arquivo');render()};
      rd.onload=()=>{try{const d=JSON.parse(rd.result);
        if(!d||typeof d!=='object'||Array.isArray(d))throw 0;
        const fts=Array.isArray(d.fotos)?d.fotos:null; delete d.fotos;
        const aBk=AREAS_OK.includes(d.area)?d.area:UI.area; d.area=aBk;
        if(aBk!==UI.area){ salvar(); UI.clinicas[UI.area]=UI.clinica; UI.clinica=UI.clinicas[aBk]||UI.clinica; UI.area=aBk; CHAVE=chaveDe(aBk); salvarUI() }
        S=Object.assign(JSON.parse(JSON.stringify(PAD)),d); normalizar(); salvar(); tema(); aplicaNav(); marca(); mesSel=mesAtual();
        UI.boasVindas=true; salvarUI();
        if(fts)Promise.resolve().then(()=>Promise.all(fts.filter(f=>f&&typeof f.id==='string'&&typeof f.clienteId==='string')
          .map(f=>FOTOS.salvar({id:f.id,clienteId:f.clienteId,titulo:String(f.titulo||''),data:String(f.data||''),
            antes:fotoOk(f.antes)?f.antes:'',depois:fotoOk(f.depois)?f.depois:''})))).then(fotosOrfas).catch(()=>{});
        toast('Backup restaurado'); ir('painel');
      }catch(e){toast('Arquivo inválido');render()}};
      rd.readAsText(f)};
    i.click();
  };
  if($('#a-demo'))$('#a-demo').onclick=()=>confirmar('Carregar o exemplo?','Isso <b>substitui os dados da área ${AREAS[area()].n}</b> por um exemplo fictício. As outras áreas não mudam. Se você já lançou algo de verdade, baixe um backup antes.',
    'Carregar exemplo',()=>{ demoArea(); fotosOrfas(); UI.boasVindas=true; salvarUI(); toast('Exemplo carregado'); ir('painel') },true);
  $('#a-del').onclick=()=>confirmar('Apagar tudo?','Tudo o que é da área <b>${AREAS[area()].n}</b> sai deste aparelho: serviços, atendimentos, clientes, fotos, agenda, contas e taxas. As outras áreas não mudam. <b>Não dá para desfazer.</b>',
    'Apagar tudo',()=>{ const t=S.tema, ar=S.area; S=JSON.parse(JSON.stringify(PAD)); S.tema=t; S.area=ar; salvar(); fotosOrfas(); toast('Tudo apagado'); ir('painel') },true);
};

/* ══════════ EXTRAS ══════════
   Confirmação por WhatsApp · aniversariantes · contas a pagar · ranking de clientes ·
   orçamento com lucro previsto · equipe e repasse · estoque · fotos de antes e depois.
   Nada aqui mexe em conta(), resumo(), reservas(), retornos() ou usarSessao(). */
const qtdBR=n=>num(n).toLocaleString('pt-BR',{maximumFractionDigits:2});

/* ── 2 · aniversariantes do mês (usa o campo de aniversário do cadastro) ── */
function secNiver(){
  const h=hojeISO(), mm=h.slice(5,7), dd=h.slice(8,10);
  const ns=S.clientes.filter(c=>c.nasc&&String(c.nasc).slice(5,7)===mm)
    .sort((a,b)=>a.nasc.slice(8,10).localeCompare(b.nasc.slice(8,10)));
  if(!ns.length)return '';
  let x=`<div class="sec" data-pn="dir"><div class="sec-top"><h2>Aniversariantes de ${MESES[+mm-1]}</h2><span class="pill">${ns.length}</span></div><div class="card">`;
  ns.forEach(c=>{ const d=c.nasc.slice(8,10), eh=d===dd, passou=d<dd;
    const l=zap(c.tel,`Oi, ${c.nome.split(' ')[0]}! ${eh?'Hoje é o seu dia':'Este é o seu mês'}: feliz aniversário! Preparei um mimo especial para você comemorar aqui. Quer que eu reserve um horário?`);
    x+=`<div class="item" ${passou?'style="opacity:.62"':''}><div class="mn"><b>${esc(c.nome)} ${eh?'<span class="pill ok">é hoje</span>':''}</b>
      <small>dia ${d}/${mm}${passou?' · já passou':''}</small></div>
      <div class="acts">${l?`<a class="btn sm soft" href="${l}" target="_blank" rel="noopener">${ic('chat',16)}Dar parabéns</a>`:'<span class="pill">sem telefone</span>'}</div></div>` });
  return x+`</div></div>`;
}

/* ── 3 · contas a pagar: só viram saída (e entram na conta do mês) quando são pagas ── */
function proxMes(iso){ const [a,m,d]=iso.split('-').map(Number); const u=new Date(a,m+1,0).getDate(); const n=new Date(a,m,Math.min(d,u));
  return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}` }
function estadoConta(c){ const d=diasEntre(hojeISO(),c.venc);
  return d<0?['bad',`venceu há ${-d} dia(s)`]:d===0?['war','vence hoje']:d<=7?['war',`vence em ${d} dia(s)`]:['',`vence em ${dataBR(c.venc)}`] }
function contasDaSemana(){ return S.contas.filter(c=>diasEntre(hojeISO(),c.venc)<=7) }
function secContas(){
  if(!modOn('contas'))return '';
  const cs=S.contas.slice().sort((a,b)=>a.venc.localeCompare(b.venc)), tot=cs.reduce((a,c)=>a+num(c.valor),0);
  let x=`<div class="sec"><div class="sec-top"><h2>Contas a pagar</h2>${cs.length?`<span class="pill war">${brl(tot)} em aberto</span>`:''}</div><div class="card">`;
  if(!cs.length)x+=`<div class="vazio"><b>Nenhuma conta agendada</b><p>Anote o que ainda vai vencer: aluguel, boleto de fornecedor, parcela de equipamento. O Painel avisa na semana do vencimento e, quando você paga, o valor entra nas saídas do mês.</p></div>`;
  else cs.forEach(c=>{ const e=estadoConta(c), s=serv(c.servicoId);
    x+=`<div class="item"><div class="mn"><b>${esc(c.desc||'Conta')} <span class="pill ${e[0]}">${e[1]}</span></b>
      <small>${dataBR(c.venc)}${c.rep?' · repete todo mês':''}${s?' · produto de '+esc(s.nome):''}</small></div>
      <div class="vr">${brl(num(c.valor))}</div>
      <div class="acts"><button class="btn sm pri" data-ct-pg="${c.id}">${ic('check',16)}Paguei</button>
        <button class="btn sm danger ic" data-ct-del="${c.id}" aria-label="Excluir">${ic('trash',18)}</button></div></div>` });
  x+=`<details class="dobra" ${cs.length?'':'open'}><summary class="btn soft full">${ic('plus')}Agendar uma conta</summary>
    <div class="grid2" style="margin-top:14px">
      <div class="field"><label>Descrição</label><input id="ct-desc" placeholder="aluguel, boleto, parcela..."></div>
      <div class="field"><label>Valor</label><input id="ct-valor" inputmode="decimal" placeholder="0,00"></div></div>
    <div class="grid2">
      <div class="field"><label>Vencimento</label><input id="ct-venc" type="date" value="${hojeISO()}"></div>
      ${ehPsico()?'<input type="hidden" id="ct-serv" value="">':`<div class="field"><label>É produto de qual serviço?</label><select id="ct-serv"><option value="">Não é produto (despesa geral)</option>
        ${S.servicos.map(s=>`<option value="${s.id}">${esc(s.nome)}</option>`).join('')}</select></div>`}</div>
    <div class="ck-l"><label class="sw"><input type="checkbox" id="ct-rep"> <span>Repete todo mês</span></label></div>
    <button class="btn pri full" id="ct-add" style="margin-top:10px">${ic('plus')}Agendar conta</button>
  </details></div></div>`;
  return x;
}
function ligarContas(){
  if(!$('#ct-add'))return;
  $('#ct-add').onclick=()=>{
    const v=num($('#ct-valor').value); if(v<=0)return toast('Informe o valor da conta');
    S.contas.push({id:uid(),desc:$('#ct-desc').value.trim(),valor:v,venc:$('#ct-venc').value||hojeISO(),
      servicoId:$('#ct-serv').value||'',rep:$('#ct-rep').checked});
    salvar(); toast('Conta agendada'); render() };
  document.querySelectorAll('[data-ct-pg]').forEach(b=>b.onclick=()=>{
    const c=S.contas.find(z=>z.id===b.dataset.ctPg); if(!c)return;
    S.despesas.push({id:uid(),data:hojeISO(),desc:c.desc||'Conta',valor:num(c.valor),servicoId:c.servicoId||''});
    if(c.rep)c.venc=proxMes(c.venc); else S.contas=S.contas.filter(z=>z.id!==c.id);
    mesSel=mesAtual(); salvar(); toast(c.rep?'Pago · próxima em '+dataBR(c.venc):'Pago · lançado nas saídas'); render() });
  document.querySelectorAll('[data-ct-del]').forEach(b=>b.onclick=()=>{ const id=b.dataset.ctDel;
    confirmar('Excluir esta conta?','Ela sai da lista de contas a pagar. Nada é lançado nas saídas.','Excluir',
      ()=>{ S.contas=S.contas.filter(z=>z.id!==id); salvar(); render(); toast('Conta excluída') },true) });
}

/* ── 4 · ranking e frequência de clientes ── */
let ordCli='lucro', sumidoDias=60;
const ORD_CLI={ lucro:(a,b)=>b.lucro-a.lucro, total:(a,b)=>b.total-a.total,
  sumidos:(a,b)=>a.ult.localeCompare(b.ult), nome:(a,b)=>a.c.nome.localeCompare(b.c.nome) };
const filtroCli=i=>ordCli!=='sumidos'||(!!i.ult&&diasEntre(i.ult,hojeISO())>=sumidoDias);
function chipsCli(){
  const o=ehPsico()?[['nome','A–Z'],['prox','Próxima sessão'],['sumidos','Sumidos']]:[['lucro','Mais lucro'],['total','Mais faturamento'],['sumidos','Sumidos'],['nome','A–Z']];
  return `<div class="chips" role="group" aria-label="Ordenar clientes" style="margin-top:10px">${o.map(z=>
    `<button class="chip" data-ord-c="${z[0]}" aria-pressed="${ordCli===z[0]}">${z[1]}</button>`).join('')}</div>

function rankCli(i,lista){ if((ordCli!=='lucro'&&ordCli!=='total')||buscaCli.trim()||!i.qtd)return '';
  const p=lista.indexOf(i); return p>=0&&p<3?`<span class="rank">${p+1}º</span>`:'' }
const msgCli=c=>ordCli==='sumidos'
  ?`Oi, ${c.nome.split(' ')[0]}! Faz um tempinho que você não aparece por aqui. Quer que eu veja um horário para você esta semana?`
  :`Oi, ${c.nome.split(' ')[0]}! Tudo bem?`;

/* ── 5 · orçamento com lucro previsto ── */
let simAba='formas';
let orc={clienteId:'',itens:[],desc:'',forma:'pix',parcelas:2};
document.addEventListener('click',e=>{ const b=e.target.closest&&e.target.closest('[data-sim-aba]');
  if(b){ simAba=b.dataset.simAba; render() } });
function abasSim(){ return `<div class="abas" role="group" aria-label="Tipo de simulação">
  <button data-sim-aba="formas" aria-pressed="${simAba!=='orc'}">Formas de pagamento</button>
  <button data-sim-aba="orc" aria-pressed="${simAba==='orc'}">Orçamento</button></div>` }
function calcOrc(o){
  const bruto=o.itens.reduce((a,i)=>a+num(i.valor),0), desc=Math.min(Math.max(0,num(o.desc)),bruto), f=bruto?(bruto-desc)/bruto:0;
  const t={bruto,desc,f,total:bruto-desc,taxa:0,custo:0,comissao:0,imposto:0,lucro:0};
  o.itens.forEach(i=>{ const k=conta({servicoId:i.servicoId,valor:num(i.valor)*f,forma:o.forma,parcelas:o.parcelas,sessoes:i.sessoes});
    t.taxa+=k.taxa; t.custo+=k.custo; t.comissao+=k.comissao; t.imposto+=k.imposto; t.lucro+=k.lucro });
  t.margem=t.total?t.lucro/t.total*100:0; return t;
}

      <div class="field"><label>Pagamento</label><select id="o-forma">${FORMAS.map(f=>`<option value="${f.k}" ${orc.forma===f.k?'selected':''}>${f.n}</option>`).join('')}</select></div>
      <div class="field" id="o-boxparc" style="display:${orc.forma==='parc'?'':'none'}"><label>Parcelas</label>
        <select id="o-parc">${Array.from({length:11},(_,i)=>i+2).map(n=>`<option value="${n}" ${orc.parcelas===n?'selected':''}>${n}x</option>`).join('')}</select></div>
    </div>

  }else x+=`<p class="sub" style="margin-top:12px">Junte os procedimentos que a cliente quer. Antes de enviar o preço, você vê quanto sobra para você depois da maquininha, do produto, da comissão e do imposto. Ela só recebe os valores.</p>`;

  }
  el.innerHTML=x;

  const pinta=()=>{ const r=$('#o-res'); if(!r)return; const t=calcOrc(orc), c=cli(orc.clienteId);

/* ── 6 · equipe e repasse de comissão ── */
const prof=id=>S.equipe.find(p=>p.id===id)||null;
const nomeProf=v=>{const p=prof(v.profId);return p?p.nome:''};
function campoProf(id,sel){ if(!modOn('equipe')||!S.equipe.length)return '';
  return `<div class="field"><label>Quem atendeu</label><select id="${id}"><option value="">Sem profissional</option>
    ${S.equipe.map(p=>`<option value="${p.id}" ${sel===p.id?'selected':''}>${esc(p.nome)}</option>`).join('')}</select></div>` }
function repasses(mes){
  const m={};
  S.vendas.filter(v=>mesDe(v.data)===mes).forEach(v=>{ const k=conta(v), e=v.estorno; let c=k.comissao;
    if(e&&!e.comissaoPaga&&k.bruto)c*=1-k.devolvido/k.bruto;      /* comissão recuperada num estorno não é repassada */
    if(c<0.005)return; const p=prof(v.profId), id=p?p.id:'';
    const a=m[id]||(m[id]={nome:p?p.nome:'Sem profissional',qtd:0,valor:0}); a.qtd++; a.valor+=c });
  return Object.values(m).sort((a,b)=>b.valor-a.valor);
}
function secRepasses(mes){
  if(!modOn('equipe')||!S.equipe.length)return ''; const rs=repasses(mes); if(!rs.length)return '';
  let x=`<div class="sec" data-pn="esq"><div class="sec-top"><h2>Comissões a repassar</h2><span class="pill">${brl(rs.reduce((a,r)=>a+r.valor,0))}</span></div><div class="card">`;

/* ── 7 · estoque simples: você conta uma vez e o Lucra desconta a cada atendimento ── */
function sessoesFeitas(sid,desde){ let n=0;
  S.vendas.forEach(v=>{ if(v.servicoId!==sid)return; if(v.estorno&&!v.estorno.produtoUsado)return;
    if(Math.max(1,parseInt(v.sessoes)||1)>1)n+=(v.usadas||[]).filter(d=>d>=desde).length; else if(v.data>=desde)n++ });
  return n }
function saldo(p){ if(!p.servicoId||!num(p.porAtend)||!serv(p.servicoId))return num(p.qtd);
  return num(p.qtd)-num(p.porAtend)*Math.max(0,sessoesFeitas(p.servicoId,p.contadoEm||hojeISO())-(p.jaNoDia||0)) }
const estoqueBaixo=()=>modOn('estoque')?S.produtos.filter(p=>saldo(p)<=num(p.min)):[];

      <div class="acts"><button class="btn sm soft" data-pr-conta="${p.id}">${ic('edit',16)}Contar</button>
        <button class="btn sm danger ic" data-pr-del="${p.id}" aria-label="Excluir">${ic('trash',18)}</button></div></div>` });
  x+=`<details class="dobra" ${S.produtos.length?'':'open'}><summary class="btn soft full">${ic('plus')}Cadastrar produto</summary>

    <button class="btn pri full" id="pr-add">${ic('plus')}Cadastrar produto</button>

/* ── 8 · fotos de antes e depois, por cliente ──
   Ficam no IndexedDB deste aparelho (cabem bem mais que no localStorage) e entram no backup. */
const FOTOS={ db:null,
  abrir(){ return new Promise((ok,er)=>{ if(this.db)return ok(this.db); if(!window.indexedDB)return er(new Error('sem IndexedDB'));
    const r=indexedDB.open('lucra-fotos',1);
    r.onupgradeneeded=()=>{ r.result.createObjectStore('registros',{keyPath:'id'}).createIndex('cli','clienteId') };
    r.onsuccess=()=>{ this.db=r.result; ok(this.db) }; r.onerror=()=>er(r.error) }) },
  tx(modo,fn){ return this.abrir().then(db=>new Promise((ok,er)=>{ const t=db.transaction('registros',modo), q=fn(t.objectStore('registros'));
    t.oncomplete=()=>ok(q&&q.result); t.onerror=()=>er(t.error); t.onabort=()=>er(t.error) })) },
  doCliente(id){ return this.tx('readonly',s=>s.index('cli').getAll(id)) },
  todos(){ return this.tx('readonly',s=>s.getAll()) },
  salvar(r){ return this.tx('readwrite',s=>s.put(r)) },
  apagar(id){ return this.tx('readwrite',s=>s.delete(id)) },
  limpar(){ return this.tx('readwrite',s=>s.clear()) } };
const fotoOk=u=>typeof u==='string'&&u.startsWith('data:image/');
function apagaFotosDe(cid){ FOTOS.doCliente(cid).then(rs=>rs.forEach(r=>FOTOS.apagar(r.id))).catch(()=>{}) }
/* reduz para no máximo 1280 px e JPEG: foto de celular cai de vários MB para ~200 KB */
function reduzFoto(file){ return new Promise((ok,er)=>{ const u=URL.createObjectURL(file), im=new Image();
  im.onload=()=>{ const k=Math.min(1,1280/Math.max(im.width,im.height)), c=document.createElement('canvas');
    c.width=Math.round(im.width*k); c.height=Math.round(im.height*k);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height); URL.revokeObjectURL(u); ok(c.toDataURL('image/jpeg',.82)) };
  im.onerror=()=>{ URL.revokeObjectURL(u); er(new Error('imagem inválida')) }; im.src=u }) }
function escolheFoto(aoEscolher){ const i=document.createElement('input'); i.type='file'; i.accept='image/*';
  i.onchange=()=>{ const f=i.files&&i.files[0]; if(!f)return;
    reduzFoto(f).then(aoEscolher).catch(()=>toast('Não consegui abrir essa imagem')) }; i.click() }
const ROT_FOTO={antes:'Antes',depois:'Depois'};
function pintaFotos(cid){
  const el=$('#h-fotos'); if(!el)return;
  FOTOS.doCliente(cid).then(rs=>{
    if(!el.isConnected)return;
    rs.sort((a,b)=>String(b.data).localeCompare(String(a.data))||String(b.id).localeCompare(String(a.id)));
    let h=`<div class="sec-top"><h2>Antes e depois</h2><button class="btn sm soft" id="ft-novo">${ic('plus',16)}Novo registro</button></div>`;
    if(!rs.length)h+=`<div class="card"><div class="vazio"><b>Nenhuma foto ainda</b><p>Fotografe antes do procedimento e depois do resultado. Lado a lado, as duas mostram a evolução para a cliente. As fotos ficam só neste aparelho.</p></div></div>`;
    else rs.forEach(r=>{ h+=`<div class="card ft"><div class="ft-top"><div><b>${esc(r.titulo||'Registro')}</b><small>${dataBR(r.data)}</small></div>
        <button class="btn sm danger ic" data-ft-del="${esc(r.id)}" aria-label="Excluir registro">${ic('trash',18)}</button></div><div class="ft-par">`;
      ['antes','depois'].forEach(t=>{ h+=fotoOk(r[t])
        ?`<button class="ft-slot" data-ft-ver="${esc(r.id)}" data-t="${t}" aria-label="Ver foto de ${t}"><img src="${esc(r[t])}" alt="${ROT_FOTO[t]}"><span>${ROT_FOTO[t]}</span></button>`
        :`<button class="ft-slot vago" data-ft-add="${esc(r.id)}" data-t="${t}">${ic('plus',22)}<span>Foto de ${t}</span></button>` });
      h+=`</div></div>` });
    el.innerHTML=h;
    const acha=id=>rs.find(r=>r.id===id);
    $('#ft-novo').onclick=()=>abrirSheet('Novo antes e depois','Crie o registro e adicione as fotos quando quiser',
      `<div class="field"><label>Procedimento</label><select id="fn-serv">${S.servicos.map(s=>`<option>${esc(s.nome)}</option>`).join('')}<option value="">Outro</option></select></div>
       <div class="field"><label>Data</label><input id="fn-data" type="date" value="${hojeISO()}"></div>
       <div class="row"><button class="btn pri" id="fn-ok" style="flex:1">${ic('check')}Criar registro</button><button class="btn soft" id="fn-no">Cancelar</button></div>`,
      fechar=>{ $('#fn-no').onclick=fechar;
        $('#fn-ok').onclick=()=>FOTOS.salvar({id:uid(),clienteId:cid,titulo:$('#fn-serv').value||'Registro',data:$('#fn-data').value||hojeISO(),antes:'',depois:''})
          .then(()=>{ fechar(); pintaFotos(cid) }).catch(()=>toast('Não consegui salvar neste navegador')) });
    el.querySelectorAll('[data-ft-add]').forEach(b=>b.onclick=()=>{ const r=acha(b.dataset.ftAdd); if(!r)return;
      escolheFoto(u=>{ r[b.dataset.t]=u; FOTOS.salvar(r).then(()=>{ toast('Foto guardada'); pintaFotos(cid) }).catch(()=>toast('Sem espaço para guardar a foto')) }) });
    el.querySelectorAll('[data-ft-del]').forEach(b=>b.onclick=()=>{ const id=b.dataset.ftDel;
      confirmar('Excluir este registro?','As fotos de antes e depois dele são apagadas deste aparelho. Não dá para desfazer.','Excluir',
        ()=>FOTOS.apagar(id).then(()=>{ toast('Registro excluído'); pintaFotos(cid) }),true) });
    el.querySelectorAll('[data-ft-ver]').forEach(b=>b.onclick=()=>{ const r=acha(b.dataset.ftVer), t=b.dataset.t; if(!r)return;
      abrirSheet(r.titulo||'Registro',dataBR(r.data),
        `<div class="ft-par grande">${['antes','depois'].filter(z=>fotoOk(r[z])).map(z=>`<figure><img src="${esc(r[z])}" alt="${ROT_FOTO[z]}"><figcaption>${ROT_FOTO[z]}</figcaption></figure>`).join('')}</div>
         <div class="row" style="margin-top:14px"><button class="btn soft" id="fv-troca" style="flex:1">${ic('upload')}Trocar foto de ${t}</button>
           <button class="btn danger" id="fv-tira">${ic('trash')}Remover</button></div>`,
        fechar=>{
          $('#fv-troca').onclick=()=>escolheFoto(u=>{ r[t]=u; FOTOS.salvar(r).then(()=>{ fechar(); toast('Foto trocada'); pintaFotos(cid) }) });
          $('#fv-tira').onclick=()=>{ r[t]=''; FOTOS.salvar(r).then(()=>{ fechar(); toast('Foto removida'); pintaFotos(cid) }) } }) });
  }).catch(()=>{ el.innerHTML=`<div class="sec-top"><h2>Antes e depois</h2></div><div class="nota">Este navegador não deixou guardar fotos. Isso acontece em janela anônima ou com o armazenamento bloqueado.</div>` });
}

/* ══════════ APARÊNCIA: cor, letra e tamanho escolhidos por quem usa ══════════
   Fica em 'lucra:ui'. A cor escolhida é ajustada sozinha para manter o contraste nos dois temas. */
const FONTES={
  padrao:{n:'Lucra (padrão)'},
  redonda:{n:'Arredondada',sans:"'Nunito'",serif:"'Nunito'",url:'family=Nunito:wght@400;500;600;700;800'},
  elegante:{n:'Elegante',sans:"'DM Sans'",serif:"'Playfair Display',Georgia",url:'family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700'},
  legivel:{n:'Alta legibilidade',sans:"'Atkinson Hyperlegible'",serif:"'Atkinson Hyperlegible'",url:'family=Atkinson+Hyperlegible:wght@400;700'},
  aparelho:{n:'Do aparelho (sem baixar nada)',sans:'system-ui',serif:'system-ui'}
};
const TAMS=[['p','Pequeno',.92],['m','Padrão',1],['g','Grande',1.1],['gg','Maior',1.2]];
const CORES=[['Ameixa','#7A2E4D'],['Sálvia','#2F6B57'],['Petróleo','#1F5F78'],['Terracota','#A4502F'],['Lavanda','#6A4C9C'],['Grafite','#3F4450']];
const COR_PADRAO='#7A2E4D';
const rgbDe=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const hexDe=r=>'#'+r.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
const mistura=(a,b,t)=>{const x=rgbDe(a),y=rgbDe(b);return hexDe(x.map((v,i)=>v+(y[i]-v)*t))};
const lumin=h=>{const c=rgbDe(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2]};
const contraste=(a,b)=>{const x=lumin(a),y=lumin(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)};
/* a mesma cor em duas versões: escura o bastante para o tema claro, clara o bastante para o escuro */
function tonsDe(base){ let cl=base, es=base, i=0;
  while(contraste(cl,'#FFFFFF')<5.5&&i++<30)cl=mistura(cl,'#000000',.07);
  i=0; while(contraste(es,'#221820')<6.5&&i++<40)es=mistura(es,'#FFFFFF',.07);
  return {cl,es} }
function aparencia(){
  const a=UI.ap, r=document.documentElement.style, f=FONTES[a.fonte]||FONTES.padrao;
  const RESTO="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif";
  if(f.sans){ r.setProperty('--sans',f.sans+','+RESTO); r.setProperty('--serif',f.serif+','+RESTO) }
  else{ r.removeProperty('--sans'); r.removeProperty('--serif') }
  if(f.url&&!document.getElementById('fonte-'+a.fonte)){ const l=document.createElement('link'); l.id='fonte-'+a.fonte; l.rel='stylesheet';
    l.href='https://fonts.googleapis.com/css2?'+f.url+'&display=swap'; document.head.appendChild(l) }
  const z=(TAMS.find(t=>t[0]===a.tam)||TAMS[1])[2];
  r.setProperty('--z',z); document.body.style.zoom=z===1?'':String(z);
  const base=corDaArea(a.cor), ps=['--ac','--on-ac','--foco','--ac-soft','--hero1','--hero2','--marca'];
  if(base.toUpperCase()===COR_PADRAO){ ps.forEach(p=>r.removeProperty(p)); return }
  const t=tonsDe(base), esc=S.tema==='escuro', c=esc?t.es:t.cl, q=rgbDe(c);
  r.setProperty('--ac',c); r.setProperty('--foco',c); r.setProperty('--on-ac',esc?'#1F1418':'#FFF8F3');
  r.setProperty('--ac-soft',`rgba(${q[0]},${q[1]},${q[2]},${esc?.14:.09})`);
  r.setProperty('--hero2',mistura(t.cl,'#000000',esc?.45:.12)); r.setProperty('--hero1',mistura(t.cl,'#000000',esc?.72:.55));
  r.setProperty('--marca',t.cl);
}
function secAparencia(){
  const a=UI.ap, outra=!CORES.some(c=>c[1].toUpperCase()===String(a.cor).toUpperCase());
  return `<div class="sec"><div class="card">
    <h2 style="margin-bottom:4px">Aparência</h2>
    <p class="sub" style="margin-bottom:14px">Deixe o Lucra com a cara do seu espaço. Vale só para este aparelho.</p>
    <label id="ap-lcor">Cor principal</label>
    <div class="cores" role="group" aria-labelledby="ap-lcor">${CORES.map(c=>
      `<button class="cor" data-ap-cor="${c[1]}" aria-pressed="${c[1].toUpperCase()===corDaArea(a.cor).toUpperCase()}" aria-label="${c[0]}" title="${c[0]}" style="--c:${c[1]}"></button>`).join('')}
      <label class="cor outra" aria-pressed="${outra}" title="Outra cor" style="--c:${outra?esc(a.cor):'transparent'}">${outra?'':ic('plus',20)}
        <input type="color" id="ap-outra" value="${esc(/^#[0-9a-f]{6}$/i.test(a.cor)?a.cor:COR_PADRAO)}" aria-label="Escolher outra cor"></label></div>
    <div class="field" style="margin-top:16px"><label>Letra</label>
      <select id="ap-fonte">${Object.keys(FONTES).map(k=>`<option value="${k}" ${a.fonte===k?'selected':''}>${FONTES[k].n}</option>`).join('')}</select></div>
    <label id="ap-ltam">Tamanho</label>
    <div class="abas" role="group" aria-labelledby="ap-ltam" style="margin-top:0">${TAMS.map(t=>
      `<button data-ap-tam="${t[0]}" aria-pressed="${a.tam===t[0]}">${t[1]}</button>`).join('')}</div>
    <button class="btn-tx" id="ap-reset" style="margin-top:10px">Voltar ao padrão do Lucra</button>
  </div></div>`;
}
function ligarAparencia(){
  const aplica=(refaz)=>{ salvarUI(); aparencia(); if(refaz)render() };
  document.querySelectorAll('[data-ap-cor]').forEach(b=>b.onclick=()=>{UI.ap.cor=b.dataset.apCor;aplica(true)});
  const o=$('#ap-outra');
  o.addEventListener('input',()=>{UI.ap.cor=o.value;aplica(false)});      /* prévia ao vivo enquanto arrasta */
  o.addEventListener('change',()=>{UI.ap.cor=o.value;aplica(true)});
  $('#ap-fonte').onchange=()=>{UI.ap.fonte=$('#ap-fonte').value;aplica(true)};
  document.querySelectorAll('[data-ap-tam]').forEach(b=>b.onclick=()=>{UI.ap.tam=b.dataset.apTam;aplica(true)});
  $('#ap-reset').onclick=()=>{UI.ap={fonte:'padrao',tam:'m',cor:COR_PADRAO};aplica(true);toast('Aparência padrão')};
}

/* ══════════ MENSAGENS DO WHATSAPP ══════════
   Três modelos editáveis nos Ajustes: horário reservado, lembrete e orçamento.
   O texto sempre passa por uma prévia editável antes de abrir o WhatsApp. */
const MSG_PAD={
  reserva:'Oi, *{nome}*! Seu horário está garantido: *{data}*, às *{hora}*, para *{procedimento}*. Se surgir algum imprevisto, me avise com antecedência para eu conseguir remarcar. Até lá!',
  lembrete:'Oi, {nome}! Passando para lembrar do seu horário em {data}, às {hora}. Posso confirmar a sua presença?\nSe não puder vir, me avise assim que souber.',
  orcamento:'Oi, {nome}! Seu orçamento ficou pronto:\n\n*O que está incluso:* {itens}\n*Investimento:* {total}\n*Válido até:* {validade}\n\nFicou com alguma dúvida ou quer ajustar alguma coisa? É só me chamar por aqui.'
};
MSG_PAD.cobranca='Oi, {nome}! Tudo bem? Passando para lembrar do valor em aberto de {total}, referente a {itens}. Pode acertar pelo Pix quando puder. Qualquer dúvida, me chama!';
const MSG_ROT={cobranca:'Cobrança',reserva:'Horário reservado',lembrete:'Lembrete',orcamento:'Orçamento'};
const msgDe=k=>(S.msgs&&typeof S.msgs[k]==='string'&&S.msgs[k].trim())?S.msgs[k]:MSG_PAD[k];
const dataMsg=iso=>{const p=String(iso||'').split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0].slice(2)}`:''};
const dataMsgLonga=iso=>{const p=String(iso||'').split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:''};
function preenche(t,v){
  if(!v.hora)t=t.replace(/,?\s*às \*?\{hora\}\*?/g,'');            /* sem hora marcada: tira o trecho inteiro */
  if(!v.nome)t=t.replace(/,?\s*\*?\{nome\}(\.\*)?\*?/g,'');        /* sem cadastro: "Oi! Seu orçamento..." */
  if(!v.procedimento)t=t.replace(/,?\s*para (realizar )?\*?\{procedimento\}\*?/g,'');
  return t.replace(/\{(\w+)\}/g,(m,k)=>v[k]!=null&&v[k]!==''?v[k]:m);
}
const linkZap=(c,msg)=>(c&&c.tel&&zap(c.tel,msg))||'https://wa.me/?text='+encodeURIComponent(msg);
function textoAg(a,tipo){ const c=cli(a.clienteId), s=serv(a.servicoId);
  return preenche(msgDe(tipo),{nome:c?c.nome.split(' ')[0]:'',data:dataMsg(a.data),hora:a.hora||'',procedimento:s?s.nome:'',clinica:UI.clinica||'',link:urlSessao(a.link)||a.link||''}) + (a.link&&!msgDe(tipo).includes('{link}')&&tipo!=='cancelamento'?'\n\nLink da sessão: '+(urlSessao(a.link)||a.link):'') }
function textoOrc(o){ const c=cli(o.clienteId), t=calcOrc(o);
  return preenche(msgDe('orcamento'),{nome:c?c.nome.split(' ')[0]:'',clinica:UI.clinica||'',total:brl(t.total),
    validade:dataMsgLonga(o.validade||proxMes(o.data||hojeISO())),
    itens:o.itens.map(i=>{const s=serv(i.servicoId);return `${Math.max(1,parseInt(i.sessoes)||1)}x ${s?s.nome:'Procedimento'}`}).join(', ')}) }

/* prévia editável + botão de envio. marcar(tipo) roda quando a pessoa toca em enviar */
function folhaMsg(titulo,sub,c,tipos,textoDe,marcar){
  let tipo=tipos[0];
  abrirSheet(titulo,sub,
    `${tipos.length>1?`<div class="abas" role="group" aria-label="Qual mensagem" style="margin:0 0 12px">${tipos.map(t=>
        `<button data-mz="${t}" aria-pressed="${t===tipo}">${MSG_ROT[t]}</button>`).join('')}</div>`:''}
     <div class="field"><label for="mz-tx">Mensagem (pode ajustar antes de enviar)</label><textarea id="mz-tx" rows="8"></textarea></div>
     ${c&&c.tel?'':'<div class="nota" style="margin-bottom:12px">Sem telefone no cadastro: o WhatsApp vai pedir para você escolher o contato.</div>'}
     <div class="row"><a class="btn pri" id="mz-ok" style="flex:1" target="_blank" rel="noopener" href="#">${ic('chat')}Enviar no WhatsApp</a>
       <button class="btn soft" id="mz-no">Agora não</button></div>
     <p class="sub" style="margin-top:10px">O texto padrão muda em Ajustes, na parte de mensagens do WhatsApp.</p>`,
    fechar=>{ const tx=$('#mz-tx'), ok=$('#mz-ok'); tx.value=textoDe(tipo);
      document.querySelectorAll('[data-mz]').forEach(b=>b.onclick=()=>{ tipo=b.dataset.mz; tx.value=textoDe(tipo);
        document.querySelectorAll('[data-mz]').forEach(z=>z.setAttribute('aria-pressed',String(z===b))) });
      $('#mz-no').onclick=fechar;
      ok.addEventListener('click',e=>{ e.preventDefault(); zapAbrir(linkZap(c,tx.value)); marcar(tipo); setTimeout(()=>{fechar();render()},500) }) });
}
function msgAgenda(a,tipo){ const c=cli(a.clienteId), s=serv(a.servicoId);
  folhaMsg(tipo==='reserva'?'Avisar a cliente':'Enviar lembrete',
    `${c?esc(c.nome):'Sem cadastro'} · ${dataBR(a.data)}${a.hora?' às '+a.hora:''}${s?' · '+esc(s.nome):''}`,
    c,tipo==='reserva'?['reserva','lembrete']:['lembrete','reserva'],t=>textoAg(a,t),
    t=>{ if(t==='reserva')a.reservaMsg=true; else a.avisado=true; salvar() }) }
function msgOrc(o){ const c=cli(o.clienteId);
  folhaMsg('Enviar orçamento',`${c?esc(c.nome):'Sem cadastro'} · ${brl(calcOrc(o).total)}`,c,['orcamento'],()=>textoOrc(o),()=>{}) }
function btnMsg(a){ if(!cli(a.clienteId)||a.data<hojeISO())return '';
  return `<button class="btn sm soft" data-msg-a="${a.id}">${ic('chat',16)}Lembrete</button>` }
const pillsMsg=a=>(a.reservaMsg?' <span class="pill ac">reserva avisada</span>':'')+(a.avisado?' <span class="pill ac">lembrete enviado</span>':'');
function ligarMsg(){ document.querySelectorAll('[data-msg-a]').forEach(b=>b.onclick=()=>{
  const a=S.agenda.find(z=>z.id===b.dataset.msgA); if(a)msgAgenda(a,'lembrete') }) }

function secMsgs(){
  const campo=(k,dica)=>`<div class="field"><label for="mg-${k}">${MSG_ROT[k]}</label>
    <textarea id="mg-${k}" rows="${k==='orcamento'?9:5}">${esc(msgDe(k))}</textarea><p class="sub">${dica}</p></div>`;
  return `<div class="sec"><div class="card">
    <h2 style="margin-bottom:4px">Mensagens do WhatsApp</h2>
    <p class="sub" style="margin-bottom:14px">Escreva do seu jeito. O que está entre chaves é trocado pelos dados de cada cliente, e os asteriscos deixam o trecho em negrito no WhatsApp.</p>
    ${campo('reserva','Oferecida logo depois de agendar. Usa {nome}, {data}, {hora} e {procedimento}.')}
    ${campo('lembrete','Botão “Lembrete” em cada horário da Agenda. Usa {nome}, {data}, {hora} e {procedimento}.')}
    ${campo('cancelamento','Usada em “Imprevisto? Cancelar os horários deste dia”, na Agenda. Usa {nome}, {data}, {hora} e {motivo}.')}
    ${campo('cobranca','Botão “Cobrar” em A receber, no Caixa. Usa {nome}, {total} e {itens}.')}
    ${campo('orcamento','Botão “Enviar orçamento” no Simulador. Usa {nome}, {itens}, {total} e {validade}.')}
    <div class="row"><button class="btn pri" id="mg-ok" style="flex:1">${ic('check')}Salvar mensagens</button>
      <button class="btn soft" id="mg-pad">Voltar ao texto original</button></div>
  </div></div>`;
}
function ligarMsgs(){
  $('#mg-ok').onclick=()=>{ S.msgs={}; Object.keys(MSG_PAD).forEach(k=>{ const v=$('#mg-'+k).value; if(v.trim()&&v!==MSG_PAD[k])S.msgs[k]=v });
    salvar(); toast('Mensagens salvas'); render() };
  $('#mg-pad').onclick=()=>confirmar('Voltar ao texto original?','As mensagens voltam ao texto que veio com o Lucra.','Voltar ao original',
    ()=>{ delete S.msgs; salvar(); toast('Mensagens restauradas'); render() });
}

/* ══════════ MENOS NA TELA ══════════
   Registro rápido (botão +), seções que abrem só quando a pessoa quer,
   recursos opcionais desligados por padrão e lembrete de backup. */

/* ── recursos opcionais: aparecem se a pessoa ligar nos Ajustes ou se já houver dados ── */
const MODS={equipe:['Equipe e comissões','Quem atendeu cada cliente e quanto repassar de comissão.',()=>S.equipe.length>0],
  estoque:['Estoque de produtos','Quantidade de cada produto e aviso quando estiver acabando.',()=>S.produtos.length>0],
  contas:['Contas a pagar','Boletos e contas com vencimento, com aviso na semana.',()=>S.contas.length>0]};
const modOn=k=>UI.mod[k]!=null?!!UI.mod[k]:MODS[k][2]();
function secMods(){
  return `<div class="sec"><div class="card">
    <h2 style="margin-bottom:4px">O que aparece no app</h2>
    <p class="sub" style="margin-bottom:8px">Ligue só o que você usa. Desligar esconde a parte do app, sem apagar nenhum dado.</p>
    ${Object.keys(MODS).map(k=>`<div class="ck-l"><label class="sw"><input type="checkbox" data-mod="${k}" ${modOn(k)?'checked':''}> <span>${MODS[k][0]}</span></label>
      <small>${MODS[k][1]}</small></div>`).join('')}
  </div></div>`;
}
function ligarMods(){ document.querySelectorAll('[data-mod]').forEach(c=>c.onchange=()=>{ UI.mod[c.dataset.mod]=c.checked; salvarUI();
  toast(c.checked?'Ligado':'Escondido') }) }

/* ── seções que começam fechadas: o título vira um botão de abrir ── */
const DOBRAS={
  painel:['Aniversariantes','Comissões a repassar','Lucro por procedimento','Lucro por dia'],
  vendas:['Registrar atendimento','Contas a pagar','Registrar saída'],
  agenda:['Novo agendamento','Aniversariantes'], clientes:['Novo cliente'],
  servicos:['Novo serviço','Taxas e encargos','Equipe'],
  ajustes:['O que aparece no app','Mensagens do WhatsApp','Aparência','Exemplo','Apagar']
};
let dobra={};
function abertoPadrao(t){
  if(t==='Novo cliente')return !S.clientes.length;
  if(t==='Novo serviço')return !S.servicos.length;
  if(t==='Novo agendamento')return !S.agenda.length;
  if(t==='Aniversariantes'){ const h=hojeISO().slice(5); return S.clientes.some(c=>c.nasc&&String(c.nasc).slice(5)===h) }
  return false;
}
function dobrar(el){
  const ts=DOBRAS[tela]; if(!ts||window.__tudoAberto)return;
  el.querySelectorAll(':scope > .sec').forEach(sec=>{
    const h=sec.querySelector('h2'); if(!h)return;
    const tit=h.textContent.trim(), t=ts.find(z=>tit.startsWith(z)); if(!t)return;
    const cab=h.closest('.sec-top')||h, cont=cab.parentElement, k=tela+':'+t;
    let ab=k in dobra?dobra[k]:abertoPadrao(t);
    cab.classList.add('dobravel'); cab.setAttribute('role','button'); cab.tabIndex=0;
    cab.insertAdjacentHTML('beforeend',`<span class="seta">${ic('right',18)}</span>`);
    const aplica=()=>{ Array.from(cont.children).forEach(c=>{ if(c!==cab)c.hidden=!ab });
      cab.setAttribute('aria-expanded',String(ab)); cont.classList.toggle('fechada',!ab) };
    const troca=()=>{ ab=!ab; dobra[k]=ab; aplica() };
    cab.addEventListener('click',e=>{ const a=e.target.closest('button,a,input,select'); if(a&&a!==cab)return; troca() });
    cab.addEventListener('keydown',e=>{ if(e.target===cab&&(e.key==='Enter'||e.key===' ')){ e.preventDefault(); troca() } });
    aplica();
  });
}

/* ── backup: função única, e um lembrete discreto no Painel ── */
function baixaArq(n,t,m){ const u=URL.createObjectURL(new Blob([t],{type:m})), a=document.createElement('a');
  a.href=u; a.download=n; a.style.display='none'; document.body.appendChild(a); a.click();
  setTimeout(()=>{a.remove();URL.revokeObjectURL(u)},3000) }
function exportarBackup(){ return FOTOS.todos().catch(()=>[]).then(fs=>{ const ids=new Set(S.clientes.map(c=>c.id)); fs=(fs||[]).filter(f=>ids.has(f.clienteId));
  baixaArq('lucra-backup.json',JSON.stringify(fs&&fs.length?Object.assign({},S,{fotos:fs}):S),'application/json');
  UI.backupEm=hojeISO(); salvarUI(); toast('Backup baixado') }) }
function lembreteBackup(el){
  if(tela!=='painel'||S.vendas.length<3)return;
  const d=UI.backupEm?diasEntre(UI.backupEm,hojeISO()):-1; if(d>=0&&d<7)return;
  el.insertAdjacentHTML('beforeend',`<div class="sec"><div class="nota bk"><span>Seus dados ficam só neste aparelho.
    ${d<0?'Você ainda não fez nenhum backup.':`O último backup foi há <b>${d} dias</b>.`}</span>
    <button class="btn sm soft" id="bk-ja">${ic('download',16)}Baixar backup</button></div></div>`);
  $('#bk-ja').onclick=()=>exportarBackup().then(render);
}

/* ── registro rápido: o atendimento do dia em poucos toques, de qualquer tela ── */
let rapForma='pix';
function servMaisUsado(){ const m={}; S.vendas.slice(-40).forEach(v=>m[v.servicoId]=(m[v.servicoId]||0)+1);
  return S.servicos.slice().sort((a,b)=>(m[b.id]||0)-(m[a.id]||0))[0] }
function registroRapido(){
  if(!S.servicos.length)return ir('servicos');
  const s0=servMaisUsado(), cs=S.clientes.slice().sort((a,b)=>a.nome.localeCompare(b.nome));
  if(!FORMAS.some(f=>f.k===rapForma))rapForma=FORMAS[0].k;
  abrirSheet('Registrar atendimento','Hoje, '+dataBR(hojeISO()),
    `<div class="field"><label>Procedimento</label><select id="r-serv">${S.servicos.map(s=>
        `<option value="${s.id}" ${s.id===s0.id?'selected':''}>${esc(s.nome)}</option>`).join('')}</select></div>
     <div class="grid2">
       <div class="field"><label>Valor cobrado</label><input id="r-valor" inputmode="decimal" value="${String(s0.preco).replace('.',',')}"></div>
       <div class="field"><label>Cliente (opcional)</label><select id="r-cli"><option value="">Sem cadastro</option>
         ${cs.map(c=>`<option value="${c.id}">${esc(c.nome)}</option>`).join('')}</select></div></div>
     <label id="r-lf">Como pagou</label>
     <div class="chips" role="group" aria-labelledby="r-lf" style="margin:0 0 12px">${FORMAS.map(f=>
       `<button class="chip" data-rf="${f.k}" aria-pressed="${f.k===rapForma}">${f.n}</button>`).join('')}</div>
     <div class="field" id="r-boxparc" hidden><label>Parcelas</label><select id="r-parc">${Array.from({length:11},(_,i)=>i+2).map(n=>`<option value="${n}">${n}x</option>`).join('')}</select></div>
     ${modOn('equipe')?campoProf('r-prof',''):''}
     <div class="rap-sobra" id="r-sobra" aria-live="polite"></div>
     <button class="btn pri full lg" id="r-ok" style="margin-top:12px">${ic('check')}Registrar</button>
     <button class="btn-tx" id="r-mais" style="display:block;margin:6px auto 0">Pacote, outra data ou atendimento em domicílio</button>`,
    fechar=>{
      const rs=$('#r-serv'), rv=$('#r-valor'), rp=$('#r-parc');
      const dados=()=>({servicoId:rs.value,valor:num(rv.value),forma:rapForma,parcelas:rapForma==='parc'?parseInt(rp.value)||2:1,sessoes:1,desloc:0});
      const pinta=()=>{ $('#r-boxparc').hidden=rapForma!=='parc'; const k=conta(dados());
        $('#r-sobra').innerHTML=`<span>Sobra para você</span><b class="${k.lucro>=0?'v-ok':'v-bad'}">${brl(k.lucro)}</b>` };
      rs.onchange=()=>{ const s=serv(rs.value); if(s)rv.value=String(s.preco).replace('.',','); pinta() };
      rv.addEventListener('input',pinta); rp.onchange=pinta;
      document.querySelectorAll('[data-rf]').forEach(b=>b.onclick=()=>{ rapForma=b.dataset.rf;
        document.querySelectorAll('[data-rf]').forEach(z=>z.setAttribute('aria-pressed',String(z===b))); pinta() });
      $('#r-mais').onclick=()=>{ fechar(); ir('registrar') };
      $('#r-ok').onclick=()=>{ const d=dados(); if(d.valor<=0)return toast('Informe o valor cobrado');
        const cid=$('#r-cli').value, lucro=conta(d).lucro;
        S.vendas.push(Object.assign({id:uid(),usadas:[],data:hojeISO(),profId:$('#r-prof')?$('#r-prof').value:'',
          clienteId:cid,cliente:cid?(cli(cid)||{}).nome:''},d));
        mesSel=mesAtual(); salvar(); fechar(); toast('Registrado · sobra '+brl(lucro)); render() };
      pinta();
    });
}
function fab(){
  let b=$('#fab');
  if(!b){ b=document.createElement('button'); b.id='fab'; b.className='fab'; b.setAttribute('aria-label','Registrar atendimento');
    b.innerHTML=ic('plus',26)+'<span>Registrar</span>'; b.onclick=registroRapido; document.body.appendChild(b) }
  b.hidden=!S.servicos.length||['ajustes','servicos','taxas','registrar','novoag'].includes(tela);
  const r=$('#b-reg'); if(r)r.hidden=!S.servicos.length;
}
function posRender(el){ extrasAgenda(el); dobrar(el); lembreteBackup(el); arrumaPainel(el); fab(); ligarArea(el); traduz(el) }

/* ══════════ IMPREVISTO NO DIA ══════════
   Faltou luz, alguém adoeceu: avisa cada cliente do dia pelo WhatsApp, marca como cancelado

MSG_PAD.cancelamento='Oi, {nome}! Tive um imprevisto ({motivo}) e não vou conseguir te atender no dia {data}, às {hora}. Peço desculpas pelo transtorno. Qual o melhor dia e horário para a gente remarcar?';

function trTx(t){ const R=VOC[area()]; if(!R||!R.length||typeof t!=='string'||t.includes('{'))return t;
  R.forEach(([a,b])=>t=t.split?t.replace(a,b):t); return t }
function traduz(raiz){
  const R=VOC[area()]; if(!raiz||!R||!R.length)return;
  const w=document.createTreeWalker(raiz,NodeFilter.SHOW_TEXT,{acceptNode:n=>{ const p=n.parentElement;
    if(!p||p.closest('textarea,script,style,[data-livre]'))return NodeFilter.FILTER_REJECT;
    return /[a-z]/i.test(n.nodeValue)&&!n.nodeValue.includes('{')?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT }});
  const ns=[]; while(w.nextNode())ns.push(w.currentNode);
  ns.forEach(n=>{ const t=trTx(n.nodeValue); if(t!==n.nodeValue)n.nodeValue=t });
  const ph=PH[area()]||{};
  raiz.querySelectorAll('[placeholder],[aria-label],[title]').forEach(e=>['placeholder','aria-label','title'].forEach(k=>{
    const v=e.getAttribute(k); if(!v)return; const t=ph[v]!=null?ph[v]:trTx(v); if(t!==v)e.setAttribute(k,t) }));
}

function addMes(iso,n){ const [a,m,d]=iso.split('-').map(Number); const u=new Date(a,m-1+n+1,0).getDate(), x=new Date(a,m-1+n,Math.min(d,u));
  return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}` }
function camposAgenda(ed){

      <div class="field" id="a-vezes-box" style="display:none"><label>Por quanto tempo</label><select id="a-vezes"><option value="" selected>Escolha</option>

      <input id="a-link" type="url" inputmode="url" placeholder="https://meet.google.com/..." value="${esc(ed&&ed.link||'')}"></div>`;

/* cria as próximas datas da série; devolve quantas criou */
function repete(a){
  const r=$('#a-rep'), v=$('#a-vezes'); if(!r||!r.value)return 0;
  const n=Math.max(1,parseInt(v&&v.value)||1); a.serie=uid();
  for(let i=1;i<n;i++){ const d=r.value==='m'?addMes(a.data,i):somaDias(a.data,i*parseInt(r.value));
    S.agenda.push({id:uid(),data:d,hora:a.hora,clienteId:a.clienteId,servicoId:a.servicoId,obs:a.obs,link:a.link||'',status:'marcado',serie:a.serie}) }
  return n-1;
}
function excluirAg(a){
  const futuros=a.serie?S.agenda.filter(z=>z.serie===a.serie&&z.id!==a.id&&z.status==='marcado'&&z.data>a.data):[];
  if(!futuros.length)return confirmar('Excluir este agendamento?','O horário some da agenda. Não dá para desfazer.','Excluir',
    ()=>{ S.agenda=S.agenda.filter(z=>z.id!==a.id); salvar(); render(); toast('Excluído') },true);
  abrirSheet('Excluir horário','Este horário faz parte de uma série que se repete',

  return x+`</div></div>`;

/* ══════════ EVOLUÇÃO POR SESSÃO (psicologia) ══════════ */
const SINAIS=['Sinais depressivos','Ansiedade intensa','Alteração de sono','Alteração de apetite','Isolamento social','Uso de substâncias','Sinais de risco'];
const EVOL={melhora:['Evoluindo','ok'],estavel:['Estável',''],piora:['Regredindo','bad']};
const evolucoesDe=cid=>S.evolucoes.filter(e=>e.clienteId===cid).sort((a,b)=>a.data.localeCompare(b.data)||String(a.id).localeCompare(String(b.id)));
function anotarSessao(cid,agId,data,evoId){

    `${ant?`<div class="nota" style="margin-bottom:14px">Sessão anterior (${dataBR(ant.data)}): humor <b>${ant.humor}/10</b>${ant.evolucao?' · '+EVOL[ant.evolucao][0].toLowerCase():''}${ant.proximo?`<br>Combinado: <b>${esc(ant.proximo)}</b>`:''}</div>`:''}
     <div class="field"><label for="ev-data">Data da sessão</label><input id="ev-data" type="date" value="${d.data}"></div>

     <label for="ev-humor">Humor hoje: <b id="ev-hv">${d.humor}</b> de 10</label>

function graficoHumor(evs){
  const pts=evs.slice(-16); if(pts.length<2)return '';
  const W=320,H=120,px=14,py=12, X=i=>px+i*(W-2*px)/(pts.length-1), Y=v=>H-py-(v-1)*(H-2*py)/9;
  return `<svg class="humor" viewBox="0 0 ${W} ${H}" role="img" aria-label="Humor nas últimas ${pts.length} sessões, de ${pts[0].humor} para ${pts[pts.length-1].humor}">
    ${[1,5,10].map(v=>`<line x1="${px}" x2="${W-px}" y1="${Y(v)}" y2="${Y(v)}" class="g"/><text x="0" y="${Y(v)+3}">${v}</text>`).join('')}
    <polyline points="${pts.map((e,i)=>X(i)+','+Y(e.humor)).join(' ')}" class="l"/>
    ${pts.map((e,i)=>`<circle cx="${X(i)}" cy="${Y(e.humor)}" r="${e.sinais.includes('Sinais de risco')?5:3.5}" class="${e.sinais.includes('Sinais de risco')?'r':'p'}"><title>${dataBR(e.data)}: humor ${e.humor}</title></circle>`).join('')}
  </svg><div class="humor-x"><span>${dataBR(pts[0].data)}</span><span>${dataBR(pts[pts.length-1].data)}</span></div>`;
}
function pintaEvolucao(cid){
  const el=$('#h-evo'); if(!el)return;
  const evs=evolucoesDe(cid), ult=evs[evs.length-1];
  const med=a=>a.length?a.reduce((s,e)=>s+e.humor,0)/a.length:0, rec=evs.slice(-4), antes=evs.slice(-8,-4);
  const sin={}; rec.forEach(e=>e.sinais.forEach(s=>sin[s]=(sin[s]||0)+1));
  let h=`<div class="sec-top"><h2>Evolução</h2><button class="btn sm pri" id="ev-nova">${ic('plus',16)}Anotar sessão</button></div>`;
  if(!evs.length)h+=`<div class="card"><div class="vazio"><b>Nenhuma sessão anotada</b><p>Anote o foco, o humor de 1 a 10 e como o paciente está evoluindo. Com algumas sessões, aparece aqui o gráfico do humor ao longo dos meses.</p></div></div>`;
  else{
    h+=`<div class="card">${graficoHumor(evs)||`<p class="sub">O gráfico aparece a partir da segunda sessão anotada.</p>`}
      <div class="stats" style="margin-top:12px">
