function msgOrc(o){ const c=cli(o.clienteId);
  folhaMsg('Enviar orçamento',`${c?esc(c.nome):'Sem cadastro'} · ${brl(calcOrc(o).total)}`,c,['orcamento'],()=>textoOrc(o),()=>{}) }
function btnMsg(a){ if(!cli(a.clienteId)||a.data<hojeISO())return '';

const pillsMsg=a=>(a.reservaMsg?' <span class="pill ac">reserva avisada</span>':'')+(a.avisado?' <span class="pill ac">lembrete enviado</span>':'');
function ligarMsg(){ document.querySelectorAll('[data-msg-a]').forEach(b=>b.onclick=()=>{

    ${campo('cancelamento','Usada em “Imprevisto? Cancelar os horários deste dia”, na Agenda. Usa {nome}, {data}, {hora} e {motivo}.')}
    ${campo('cobranca','Botão “Cobrar” em A receber, no Caixa. Usa {nome}, {total} e {itens}.')}

    <div class="row"><button class="btn pri" id="mg-ok" style="flex:1">${ic('check')}Salvar mensagens</button>
      <button class="btn soft" id="mg-pad">Voltar ao texto original</button></div>
  </div></div>`;
}

/* ── seções que começam fechadas: o título vira um botão de abrir ── */
const DOBRAS={
  painel:['Aniversariantes','Comissões a repassar','Lucro por procedimento','Lucro por dia'],
  vendas:['Valor do atendimento','Contas a pagar','Registrar saída'],
  agenda:['Novo agendamento','Aniversariantes'], clientes:['Novo cliente'],
  servicos:['Novo serviço','Taxas e encargos','Equipe'],
  ajustes:['O que aparece no app','Mensagens do WhatsApp','Aparência','Exemplo','Apagar']
};
let dobra={};
function abertoPadrao(t){
  if(t==='Novo cliente')return !S.clientes.length;
  if(t==='Novo serviço')return !S.servicos.length;
  if(t==='Novo agendamento')return !S.agenda.length;
  if(t==='Aniversariantes'){ const h=hojeISO().slice(5); return S.clientes.some(c=>c.nasc&&String(c.nasc).slice(5)===h) }
  return false;
}
function dobrar(el){
  const ts=DOBRAS[tela]; if(!ts||window.__tudoAberto)return;
  el.querySelectorAll(':scope > .sec').forEach(sec=>{
    const h=sec.querySelector('h2'); if(!h)return;
    const tit=h.textContent.trim(), t=ts.find(z=>tit.startsWith(z)); if(!t)return;
    const cab=h.closest('.sec-top')||h, cont=cab.parentElement, k=tela+':'+t;
    let ab=k in dobra?dobra[k]:abertoPadrao(t);
    cab.classList.add('dobravel'); cab.setAttribute('role','button'); cab.tabIndex=0;
    cab.insertAdjacentHTML('beforeend',`<span class="seta">${ic('right',18)}</span>`);
    const aplica=()=>{ Array.from(cont.children).forEach(c=>{ if(c!==cab)c.hidden=!ab });
      cab.setAttribute('aria-expanded',String(ab)); cont.classList.toggle('fechada',!ab) };
    const troca=()=>{ ab=!ab; dobra[k]=ab; aplica() };
    cab.addEventListener('click',e=>{ const a=e.target.closest('button,a,input,select'); if(a&&a!==cab)return; troca() });
    cab.addEventListener('keydown',e=>{ if(e.target===cab&&(e.key==='Enter'||e.key===' ')){ e.preventDefault(); troca() } });
    aplica();
  });
}

/* ── backup: função única, e um lembrete discreto no Painel ── */
function baixaArq(n,t,m){ const u=URL.createObjectURL(new Blob([t],{type:m})), a=document.createElement('a');
  a.href=u; a.download=n; a.style.display='none'; document.body.appendChild(a); a.click();
  setTimeout(()=>{a.remove();URL.revokeObjectURL(u)},3000) }
function exportarBackup(){ return FOTOS.todos().catch(()=>[]).then(fs=>{ const ids=new Set(S.clientes.map(c=>c.id)); fs=(fs||[]).filter(f=>ids.has(f.clienteId));
  baixaArq('lucra-backup.json',JSON.stringify(fs&&fs.length?Object.assign({},S,{fotos:fs}):S),'application/json');
  UI.backupEm=hojeISO(); salvarUI(); toast('Backup baixado') }) }
function lembreteBackup(el){
  if(tela!=='painel'||S.vendas.length<3)return;

  el.insertAdjacentHTML('beforeend',`<div class="sec"><div class="nota bk"><span>Seus dados ficam só neste aparelho.
    ${d<0?'Você ainda não fez nenhum backup.':`O último backup foi há <b>${d} dias</b>.`}</span>
    <button class="btn sm soft" id="bk-ja">${ic('download',16)}Baixar backup</button></div></div>`);
  $('#bk-ja').onclick=()=>exportarBackup().then(render);
}

  return preenche(t,{nome:c?c.nome.split(' ')[0]:'',data:dataMsg(a.data),hora:a.hora||'',procedimento:s?s.nome:'',motivo:motivo,clinica:UI.clinica||''}) }
function cancelarDia(dia){

    `<div class="field"><label for="cd-mot">O que aconteceu? (entra na mensagem)</label>

     <div id="cd-lista"></div>
     <p class="sub" style="margin:12px 0">O WhatsApp abre uma conversa por vez, com a mensagem pronta. Quem você avisa sai da agenda do dia e vai para a lista “Para remarcar”.</p>

function trTx(t){ const R=VOC[area()]; if(!R||!R.length||typeof t!=='string'||t.includes('{'))return t;
  R.forEach(([a,b])=>t=t.split?t.replace(a,b):t); return t }
function traduz(raiz){
  const R=VOC[area()]; if(!raiz||!R||!R.length)return;
  const w=document.createTreeWalker(raiz,NodeFilter.SHOW_TEXT,{acceptNode:n=>{ const p=n.parentElement;
    if(!p||p.closest('textarea,script,style,[data-livre]'))return NodeFilter.FILTER_REJECT;
    return /[a-z]/i.test(n.nodeValue)&&!n.nodeValue.includes('{')?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT }});
  const ns=[]; while(w.nextNode())ns.push(w.currentNode);
  ns.forEach(n=>{ const t=trTx(n.nodeValue); if(t!==n.nodeValue)n.nodeValue=t });
  const ph=PH[area()]||{};
  raiz.querySelectorAll('[placeholder],[aria-label],[title]').forEach(e=>['placeholder','aria-label','title'].forEach(k=>{
    const v=e.getAttribute(k); if(!v)return; const t=ph[v]!=null?ph[v]:trTx(v); if(t!==v)e.setAttribute(k,t) }));
}

/* ══════════ AGENDA: horário fixo que se repete e link da sessão online ══════════ */
function addMes(iso,n){ const [a,m,d]=iso.split('-').map(Number); const u=new Date(a,m-1+n+1,0).getDate(), x=new Date(a,m-1+n,Math.min(d,u));
  return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}` }
function camposAgenda(ed){
  const p=ehPsico();
  let x='';
  if(!ed)x+=`<div class="grid2">
      <div class="field"><label>Repetir</label><select id="a-rep">
        ${[['','Não repete'],['7','Toda semana'],['14','A cada 2 semanas'],['m','Todo mês']].map(o=>`<option value="${o[0]}">${o[1]}</option>`).join('')}</select></div>
      <div class="field" id="a-vezes-box" style="display:none"><label>Por quanto tempo</label><select id="a-vezes"><option value="" selected>Escolha</option>
        ${[4,8,12,24].map(n=>`<option value="${n}">${n} vezes</option>`).join('')}</select></div></div>`;
  if(p||(ed&&ed.link))x+=`<div class="field"><label>Link da sessão online (opcional)</label>
      <input id="a-link" type="url" inputmode="url" placeholder="https://meet.google.com/..." value="${esc(ed&&ed.link||'')}"></div>`;
  return x;
}
/* cria as próximas datas da série; devolve quantas criou */
function repete(a){
  const r=$('#a-rep'), v=$('#a-vezes'); if(!r||!r.value)return 0;
  const n=Math.max(1,parseInt(v&&v.value)||1); a.serie=uid();
  for(let i=1;i<n;i++){ const d=r.value==='m'?addMes(a.data,i):somaDias(a.data,i*parseInt(r.value));
    S.agenda.push({id:uid(),data:d,hora:a.hora,clienteId:a.clienteId,servicoId:a.servicoId,obs:a.obs,link:a.link||'',status:'marcado',serie:a.serie}) }
  return n-1;
}
function excluirAg(a){
  const futuros=a.serie?S.agenda.filter(z=>z.serie===a.serie&&z.id!==a.id&&z.status==='marcado'&&z.data>a.data):[];
  if(!futuros.length)return confirmar('Excluir este agendamento?','O horário some da agenda. Não dá para desfazer.','Excluir',
    ()=>{ S.agenda=S.agenda.filter(z=>z.id!==a.id); salvar(); render(); toast('Excluído') },true);
  abrirSheet('Excluir horário','Este horário faz parte de uma série que se repete',
    `<p class="conf-tx">Há mais <b>${futuros.length}</b> horário(s) marcados depois deste na mesma série.</p>
     <div style="display:grid;gap:8px;margin-top:16px">
       <button class="btn soft full" id="xs-um">Excluir só este</button>
       <button class="btn perigo full" id="xs-todos">Excluir este e os próximos</button>
       <button class="btn-tx" id="xs-no">Voltar</button></div>`,
    fechar=>{ $('#xs-no').onclick=fechar; $('#xs-no').focus();
      $('#xs-um').onclick=()=>{ S.agenda=S.agenda.filter(z=>z.id!==a.id); salvar(); fechar(); render(); toast('Excluído') };
      $('#xs-todos').onclick=()=>{ const ids=new Set(futuros.map(z=>z.id).concat(a.id)); S.agenda=S.agenda.filter(z=>!ids.has(z.id));
        salvar(); fechar(); render(); toast(ids.size+' horários excluídos') } });
}

/* ══════════ A RECEBER: atendido e ainda não pago (fiado, boleto, falta cobrada) ══════════
   Só vira faturamento quando o dinheiro entra, igual ao resto do Lucra. */
const totalReceber=()=>S.receber.reduce((a,r)=>a+num(r.valor),0);
function gruposReceber(){ const g={};
  S.receber.forEach(r=>{ const k=r.clienteId||'x', a=g[k]||(g[k]={cid:k,itens:[],total:0}); a.itens.push(r); a.total+=num(r.valor) });
  return Object.values(g).map(x=>(x.itens.sort((a,b)=>a.data.localeCompare(b.data)),x)).sort((a,b)=>a.itens[0].data.localeCompare(b.itens[0].data)) }
function tileReceber(){ if(!S.receber.length&&!ehPsico())return '';
  const gs=gruposReceber();
  return `<button class="tile" id="ir-rec"><span class="tile-top"><span class="ico">${ic('coins',17)}</span><span class="eyebrow">A receber</span></span>
    <div class="tile-n ${gs.length?'v-war':'v-ok'}">${gs.length?brl(totalReceber()):'Tudo pago'}</div>
    <div class="sub">${gs.length?gs.length+' cliente(s) com valor em aberto':'ninguém devendo'}</div></button>` }
function secReceber(){ const gs=gruposReceber(); if(!gs.length)return '';
  let x=`<div class="sec"><div class="sec-top"><h2>A receber</h2><span class="pill war">${brl(totalReceber())}</span></div><div class="card">`;
  gs.forEach(g=>{ const c=cli(g.cid), d=diasEntre(g.itens[0].data,hojeISO());
    x+=`<div class="item"><div class="mn"><b>${esc(c?c.nome:'Sem cadastro')}</b>
      <small>${g.itens.length} item(ns) · ${g.itens.map(i=>dataBR(i.data)).join(', ')}${d>=30?` · <b class="v-bad">há ${d} dias</b>`:''}</small></div>
      <div class="vr">${brl(g.total)}</div>
      <div class="acts"><button class="btn sm pri" data-rec="${g.cid}">${ic('check',16)}Recebi</button>
        ${c?`<button class="btn sm soft" data-cob="${g.cid}">${ic('chat',16)}Cobrar</button>`:''}</div></div>` });
  return x+`</div></div>`;
}

/* ══════════ EVOLUÇÃO POR SESSÃO (psicologia) ══════════ */
const SINAIS=['Sinais depressivos','Ansiedade intensa','Alteração de sono','Alteração de apetite','Isolamento social','Uso de substâncias','Sinais de risco'];
const EVOL={melhora:['Evoluindo','ok'],estavel:['Estável',''],piora:['Regredindo','bad']};
const evolucoesDe=cid=>S.evolucoes.filter(e=>e.clienteId===cid).sort((a,b)=>a.data.localeCompare(b.data)||String(a.id).localeCompare(String(b.id)));
function anotarSessao(cid,agId,data,evoId){
  const c=cli(cid); if(!c)return;
  const e=S.evolucoes.find(z=>evoId?z.id===evoId:(agId&&z.agId===agId))||null;
  const d=e?JSON.parse(JSON.stringify(e)):{data:data||hojeISO(),humor:5,sinais:[],evolucao:'',foco:'',chegada:'',notas:'',proximo:''};
  const ant=evolucoesDe(cid).filter(z=>(!e||z.id!==e.id)&&z.data<=d.data).pop();
  abrirSheet(e?'Anotação da sessão':'Anotar sessão',`${esc(c.nome)}`,
    `${ant?`<div class="nota" style="margin-bottom:14px">Sessão anterior (${dataBR(ant.data)}): humor <b>${ant.humor}/10</b>${ant.evolucao?' · '+EVOL[ant.evolucao][0].toLowerCase():''}${ant.proximo?`<br>Combinado: <b>${esc(ant.proximo)}</b>`:''}</div>`:''}
     <div class="field"><label for="ev-data">Data da sessão</label><input id="ev-data" type="date" value="${d.data}"></div>
     <div class="field"><label for="ev-foco">Foco da sessão</label><textarea id="ev-foco" rows="2" placeholder="tema principal trabalhado">${esc(d.foco)}</textarea></div>
     <div class="field"><label for="ev-cheg">Como chegou hoje</label><textarea id="ev-cheg" rows="2" placeholder="estado geral, queixas, acontecimentos da semana">${esc(d.chegada)}</textarea></div>
     <label for="ev-humor">Humor hoje: <b id="ev-hv">${d.humor}</b> de 10</label>
     <input id="ev-humor" class="faixa" type="range" min="1" max="10" step="1" value="${d.humor}">
     <div class="faixa-rot"><span>1 · muito baixo</span><span>10 · muito bom</span></div>
     <label id="ev-ls" style="margin-top:16px">Sinais observados</label>
     <div class="chips" role="group" aria-labelledby="ev-ls">${SINAIS.map(s=>`<button class="chip" data-sinal="${s}" aria-pressed="${d.sinais.includes(s)}">${s}</button>`).join('')}</div>
     <div class="nota risco" id="ev-risco" ${d.sinais.includes('Sinais de risco')?'':'hidden'} style="margin-top:10px">Registre nas anotações a avaliação feita e a conduta adotada.</div>
     <label id="ev-le" style="margin-top:16px">Evolução</label>
     <div class="abas" role="group" aria-labelledby="ev-le" style="margin-top:0">${Object.keys(EVOL).map(k=>`<button data-evol="${k}" aria-pressed="${d.evolucao===k}">${EVOL[k][0]}</button>`).join('')}</div>
     <div class="field" style="margin-top:16px"><label for="ev-notas">Anotações</label><textarea id="ev-notas" rows="5">${esc(d.notas)}</textarea></div>
     <div class="field"><label for="ev-prox">Para a próxima sessão</label><input id="ev-prox" placeholder="tarefa, tema para retomar..." value="${esc(d.proximo)}"></div>
     <div class="row"><button class="btn pri" id="ev-ok" style="flex:1">${ic('check')}Salvar anotação</button><button class="btn soft" id="ev-no">Cancelar</button></div>
     ${e?`<button class="btn-tx" id="ev-del" style="display:block;margin:8px auto 0">Excluir anotação</button>`:''}
     <p class="sub" style="margin-top:10px">A anotação fica só neste aparelho e entra no backup junto com o resto dos dados.</p>`,
    fechar=>{
      const h=$('#ev-humor'); h.addEventListener('input',()=>$('#ev-hv').textContent=h.value);
      document.querySelectorAll('[data-sinal]').forEach(b=>b.onclick=()=>{ b.setAttribute('aria-pressed',String(b.getAttribute('aria-pressed')!=='true'));
        $('#ev-risco').hidden=document.querySelector('[data-sinal="Sinais de risco"]').getAttribute('aria-pressed')!=='true' });
      document.querySelectorAll('[data-evol]').forEach(b=>b.onclick=()=>{ const on=b.getAttribute('aria-pressed')==='true';
        document.querySelectorAll('[data-evol]').forEach(z=>z.setAttribute('aria-pressed','false')); b.setAttribute('aria-pressed',String(!on)) });
      $('#ev-no').onclick=fechar;
      const depois=()=>{ if($('#h-evo'))pintaEvolucao(cid); render() };
      $('#ev-ok').onclick=()=>{
        const ev=document.querySelector('[data-evol][aria-pressed="true"]');
        const n={id:e?e.id:uid(),clienteId:cid,agId:e?e.agId:(agId||''),data:$('#ev-data').value||hojeISO(),
          foco:$('#ev-foco').value.trim(),chegada:$('#ev-cheg').value.trim(),humor:parseInt(h.value)||5,
          sinais:[...document.querySelectorAll('[data-sinal][aria-pressed="true"]')].map(b=>b.dataset.sinal),
          evolucao:ev?ev.dataset.evol:'',notas:$('#ev-notas').value.trim(),proximo:$('#ev-prox').value.trim()};
        if(e)Object.assign(e,n); else S.evolucoes.push(n);
        salvar(); fechar(); toast('Anotação salva'); depois() };
      if($('#ev-del'))$('#ev-del').onclick=()=>confirmar('Excluir esta anotação?','A anotação desta sessão é apagada deste aparelho. Não dá para desfazer.','Excluir',
        ()=>{ S.evolucoes=S.evolucoes.filter(z=>z.id!==e.id); salvar(); fechar(); toast('Anotação excluída'); depois() },true);
    });
}
function graficoHumor(evs){
  const pts=evs.slice(-16); if(pts.length<2)return '';
  const W=320,H=120,px=14,py=12, X=i=>px+i*(W-2*px)/(pts.length-1), Y=v=>H-py-(v-1)*(H-2*py)/9;

function extenso(v){
  const U=['','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez','onze','doze','treze','quatorze','quinze','dezesseis','dezessete','dezoito','dezenove'],
    D=['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'],
    C=['','cento','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];
  const ate999=n=>{ if(n===100)return 'cem'; const c=Math.floor(n/100), r=n%100, p=[];
    if(c)p.push(C[c]); if(r<20){ if(r)p.push(U[r]) } else { p.push(D[Math.floor(r/10)]+(r%10?' e '+U[r%10]:'')) } return p.join(' e ') };
  const inteiro=n=>{ if(!n)return 'zero'; const mi=Math.floor(n/1e6), mil=Math.floor(n%1e6/1000), r=n%1000, p=[];
    if(mi)p.push(mi===1?'um milhão':ate999(mi)+' milhões'); if(mil)p.push(mil===1?'mil':ate999(mil)+' mil');
    if(r){ if(p.length&&(r<100||r%100===0))return p.join(' ')+' e '+ate999(r); p.push(ate999(r)) }
    return p.join(' ') };
  const ct=Math.round(v*100), r=Math.floor(ct/100), c=ct%100;
  const pr=r?inteiro(r)+(r===1?' real':(r%1e6===0?' de reais':' reais')):'', pc=c?ate999(c)+(c===1?' centavo':' centavos'):'';
  return [pr,pc].filter(Boolean).join(' e ')||'zero reais';
}
const dataLonga=iso=>{ const [a,m,d]=iso.split('-'); return `${+d} de ${MESES[+m-1]} de ${a}` };
const dataCheia=iso=>{ const [a,m,d]=String(iso).split('-'); return `${d}/${m}/${a}` };

/* uma linha por pagamento do mês: sessão avulsa pelo dia, pacote inteiro no mês em que foi pago */
function linhasRecibo(cid,mes){
  const hj=hojeISO(), ls=[];
  S.vendas.filter(v=>v.clienteId===cid).forEach(v=>{ const k=conta(v); if(k.estornado&&k.devolvido>=k.bruto)return;
    const fator=k.bruto?(k.bruto-k.devolvido)/k.bruto:1;
    if(k.sessoes>1){ if(mesDe(v.data)===mes&&k.bruto>0)ls.push({data:v.data,valor:k.bruto*fator,desc:`Pacote de ${k.sessoes} sessões${v.pacTotal&&v.pacTotal>k.bruto?' (parte)':''} pago em ${dataCheia(v.data)}`}) }
    else { const d=v.desc&&!serv(v.servicoId)?v.data:(v.sessao||v.data); if(mesDe(d)===mes)ls.push({data:d,valor:k.bruto*fator,desc:v.desc&&!serv(v.servicoId)?`${v.desc} pago em ${dataCheia(d)}`:''}) } });
  return ls.sort((a,b)=>a.data.localeCompare(b.data));
}

/* ══════════ DADOS POR ÁREA ══════════
   Cada área tem a sua gaveta: o paciente da psicologia nunca aparece na odontologia.
   O 'lucra:v1' continua existindo e fica com a área que já estava nele. */
const CHAVE_BASE='lucra:v1', AREAS_OK=['estetica','odonto','psico'];
function chaveDe(a){
  if(UI.chaves[a])return UI.chaves[a];
  const usada=Object.values(UI.chaves).includes(CHAVE_BASE);
  UI.chaves[a]=a==='estetica'&&!usada?CHAVE_BASE:CHAVE_BASE+':'+a; salvarUI(); return UI.chaves[a];
}
function prepararArea(){
  if(!AREAS_OK.includes(UI.area)){
    let a='estetica';
    try{ const d=JSON.parse(localStorage.getItem(CHAVE_BASE)||'null'); if(d&&AREAS_OK.includes(d.area))a=d.area }catch(e){}
    UI.area=a; UI.chaves={}; UI.chaves[a]=CHAVE_BASE; UI.clinicas={}; UI.clinicas[a]=UI.clinica; salvarUI();
  }
  CHAVE=chaveDe(UI.area);
  if(UI.clinicas[UI.area]!=null)UI.clinica=UI.clinicas[UI.area];
}
/* troca a gaveta inteira: salva a área atual e carrega a outra */
function trocaGaveta(k){
  salvar(); UI.clinicas[UI.area]=UI.clinica;
  const t=S.tema; UI.clinica=UI.clinicas[k]||''; UI.area=k; CHAVE=chaveDe(k);   /* nome primeiro: chaveDe já grava as preferências */
  S=JSON.parse(JSON.stringify(PAD)); carregar(); S.area=k; S.tema=t;
  mesSel=mesAtual(); salvar(); salvarUI();
}
/* fotos de quem não existe em nenhuma área são apagadas; as das outras áreas ficam */
function fotosOrfas(){
  const ids=new Set(S.clientes.map(c=>c.id));
  AREAS_OK.filter(a=>a!==UI.area&&UI.chaves[a]).forEach(a=>{ try{ const d=JSON.parse(localStorage.getItem(UI.chaves[a])||'null');
    if(d&&Array.isArray(d.clientes))d.clientes.forEach(c=>ids.add(c.id)) }catch(e){} });
  return FOTOS.todos().then(rs=>Promise.all(rs.filter(r=>!ids.has(r.clienteId)).map(r=>FOTOS.apagar(r.id)))).catch(()=>{});
}

function abreMenu(abre){

  const b=$('#b-menu'); if(b){ b.setAttribute('aria-expanded',String(abre)); b.setAttribute('aria-label',abre?'Fechar menu':'Abrir menu') }
  if(abre){ const a=document.querySelector('#menu button[aria-current="true"]')||document.querySelector('#menu button'); if(a)a.focus({preventScroll:true}) }
  else if(document.activeElement&&document.activeElement.closest('#menu')&&b&&getComputedStyle(b).display!=='none')b.focus({preventScroll:true});
}
function marcaMenu(t){ document.querySelectorAll('#menu button[data-t]').forEach(b=>b.setAttribute('aria-current',String(b.dataset.t===({reserva:'painel',vendas:'registrar',atendmes:'registrar',saidas:'saida',simpag:'sim',simorc:'sim'}[t]||t)))) }

  el.classList.toggle('pn',tela==='painel');
  const k=el.querySelector(':scope > [data-pn=kpis]'); if(tela!=='painel'||!k)return;
  if(!el.querySelector(':scope > [data-pn=esq]')){ const d=document.createElement('div'); d.className='pn-dir pn-so'; el.querySelectorAll(':scope > [data-pn=dir]').forEach(c=>d.appendChild(c)); k.after(d); return }
  const cols=document.createElement('div'); cols.className='pn-cols';
  const esq=document.createElement('div'); esq.className='pn-esq'; const dir=document.createElement('div'); dir.className='pn-dir';

}

/* ── WhatsApp: uma aba só (ou o aplicativo do computador) ── */
const ehCelular=()=>/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
function partesZap(url){ try{ const u=new URL(url,location.href);
  if(u.hostname==='wa.me')return {fone:u.pathname.replace(/\D/g,''),texto:u.searchParams.get('text')||''};
  if(/(^|\.)whatsapp\.com$/.test(u.hostname)&&/send/.test(u.pathname))return {fone:(u.searchParams.get('phone')||'').replace(/\D/g,''),texto:u.searchParams.get('text')||''};
  }catch(e){} return null }
function abreZap(url){ const p=partesZap(url);
  if(!p||ehCelular()){ window.open(url,'_blank','noopener'); return }
  const q=`${p.fone?'phone='+p.fone+'&':''}text=${encodeURIComponent(p.texto)}`;
  if(UI.zap==='app'){ location.href='whatsapp://send?'+q; return }
  const w=window.open('https://web.whatsapp.com/send?'+q,'lucra-whatsapp');
  if(w){ try{w.focus()}catch(e){} } }
function perguntaZap(depois){
  abrirSheet('WhatsApp neste computador','Pergunto uma vez só. Dá para mudar em Ajustes.',
    `<div style="display:grid;gap:8px">
       <button class="btn pri full" data-zm="app">${ic('chat')}Tenho o aplicativo do WhatsApp</button>
       <button class="btn soft full" data-zm="web">Uso o WhatsApp Web no navegador</button></div>
     <p class="sub" style="margin-top:12px">Com o aplicativo, a conversa abre direto nele, sem carregar nada. No WhatsApp Web, o Lucra usa sempre a mesma aba, em vez de abrir uma nova a cada mensagem.</p>`,
    fechar=>document.querySelectorAll('[data-zm]').forEach(b=>b.onclick=()=>{ UI.zap=b.dataset.zm; salvarUI(); fechar(); depois() }));
}
function zapAbrir(url){ if(!ehCelular()&&!UI.zap&&partesZap(url))return perguntaZap(()=>abreZap(url)); abreZap(url) }
/* os botões de WhatsApp são links: na fase de subida o href já está pronto */
document.addEventListener('click',e=>{
  if(e.defaultPrevented||e.button||e.metaKey||e.ctrlKey||e.shiftKey)return;
  const a=e.target.closest&&e.target.closest('a[href]'); if(!a||!partesZap(a.href)||ehCelular())return;
  e.preventDefault(); zapAbrir(a.href);
});
function secZap(){

  return `<div class="sec" id="sec-zap"><div class="card"><h2 style="margin-bottom:4px">WhatsApp no computador</h2>

const soDig=v=>String(v||'').replace(/\D/g,'');
const molde=(d,m)=>{ let r='',i=0; for(const ch of m){ if(i>=d.length)break; if(ch==='#')r+=d[i++]; else r+=ch } return r };
function fmtTel(v){ let d=soDig(v); if(d.length>11&&d.startsWith('55'))d=d.slice(2); d=d.slice(0,11);
  return d.length>10?molde(d,'(##) #####-####'):molde(d,'(##) ####-####') }
const fmtCpf=v=>molde(soDig(v).slice(0,11),'###.###.###-##');
const fmtCnpj=v=>molde(soDig(v).slice(0,14),'##.###.###/####-##');
const fmtDoc=v=>{ const d=soDig(v); if(!d)return String(v||''); return d.length>11?fmtCnpj(d):fmtCpf(d) };
const MASC=[['#c-tel,input[inputmode=tel]',fmtTel],['#c-cpf,#rb-cpf,#rb-pc',fmtCpf],['#rb-d,#pf-doc',fmtDoc]];
document.addEventListener('input',e=>{ const t=e.target; if(!t||t.tagName!=='INPUT')return;
  const m=MASC.find(z=>t.matches(z[0])); if(!m)return;
  const fim=t.selectionStart===t.value.length, novo=m[1](t.value); if(novo===t.value)return;
  t.value=novo; if(fim)try{t.setSelectionRange(novo.length,novo.length)}catch(err){} },true);

/* ── conversa com o servidor ── */
async function sb(caminho,{metodo='GET',corpo,auth=true}={}){
  const h={apikey:SB_KEY,'Content-Type':'application/json'};
  if(auth&&SES)h.Authorization='Bearer '+SES.access_token;
  let r;
  try{ r=await fetch(SB_URL+caminho,{method:metodo,headers:h,body:corpo==null?undefined:JSON.stringify(corpo)}) }
  catch(e){ const x=new Error('sem_internet'); x.rede=true; throw x }
  const t=await r.text(); let d=null; try{ d=t?JSON.parse(t):null }catch(e){ d=t }
  if(!r.ok){ const x=new Error((d&&(d.msg||d.message||d.error_description||d.error_code||d.error))||('erro '+r.status)); x.status=r.status; x.dados=d; throw x }
  return d;
}
function guardaSessao(d){
  if(!d||!d.access_token)return;
  SES={access_token:d.access_token,refresh_token:d.refresh_token,
    expires_at:d.expires_at?+d.expires_at:Math.floor(Date.now()/1000)+(+d.expires_in||3600),
    user:{id:(d.user||{}).id||(SES&&SES.user.id),email:(d.user||{}).email||(SES&&SES.user.email)}};
  gravarJ(K_SES,SES);
}
async function garanteToken(){
  if(!SES)throw Object.assign(new Error('sem_login'),{status:401});
  if(Date.now()/1000<SES.expires_at-90)return;
  try{ guardaSessao(await sb('/auth/v1/token?grant_type=refresh_token',{metodo:'POST',corpo:{refresh_token:SES.refresh_token},auth:false})) }
  catch(e){ if(!e.rede){ e.status=401 } throw e }
}

/* ── sincronização: junta as mudanças daqui com as da equipe ── */
const canon=v=>Array.isArray(v)?'['+v.map(canon).join(',')+']'
  :v&&typeof v==='object'?'{'+Object.keys(v).filter(k=>v[k]!==undefined).sort().map(k=>JSON.stringify(k)+':'+canon(v[k])).join(',')+'}':JSON.stringify(v===undefined?null:v);
const igual=(a,b)=>canon(a)===canon(b);
const chaveItem=x=>x&&typeof x==='object'&&!Array.isArray(x)?(x.id!=null?'i:'+x.id:x.clienteId!=null?'c:'+x.clienteId:null):null;
function mergeLista(b,l,r){
  const mapa=a=>new Map(a.map(x=>[chaveItem(x),x])), mb=mapa(b), ml=mapa(l), mr=mapa(r);
  const ordem=[...new Set([...r.map(chaveItem),...l.map(chaveItem)])], res=[];
  ordem.forEach(k=>{ const xb=mb.get(k), xl=ml.get(k), xr=mr.get(k);
    const v=igual(xl,xb)?xr:igual(xr,xb)?xl:(xl!==undefined?xl:xr);   /* os dois mexeram: vale o daqui */
    if(v!==undefined)res.push(v) });
  return res;
}
function merge3(b,l,r){
  b=b||{}; l=l||{}; r=r||{}; const out={};
  new Set([...Object.keys(l),...Object.keys(r)]).forEach(k=>{
    const vb=b[k], vl=l[k], vr=r[k]; let v;
    if(Array.isArray(vl)&&Array.isArray(vr)&&vl.concat(vr).every(chaveItem))v=mergeLista(Array.isArray(vb)?vb:[],vl,vr);
    else v=igual(vl,vb)?vr:vl;
    if(v!==undefined)out[k]=v });
  return out;
}
function parteDe(obj,p){ const o={};
  Object.keys(obj).forEach(k=>{ if(k==='tema'||k==='area')return; if(CLINICO.includes(k)===(p==='clinico'))o[k]=obj[k] });
  return JSON.parse(JSON.stringify(o)) }
const partes=()=>podeClinico()?['dados','clinico']:['dados'];
function aplicaParte(p,estado){
  const t=S.tema;
  Object.keys(parteDe(S,p)).forEach(k=>{ if(!(k in estado))delete S[k] });
  Object.assign(S,JSON.parse(JSON.stringify(estado)));
  S.tema=t; S.area=CONTA.area; normalizar(); salvarLocal(); renderSeguro();
}
const pendente=()=>CONTA&&partes().some(p=>!igual(parteDe(S,p),(BASE[p]||{estado:{}}).estado));
async function sincParte(p,tent){
  const cid=CONTA.cid, rem=((await api(`/rest/v1/${p}?select=estado,versao&clinica_id=eq.${cid}`))||[])[0];
  if(!rem||!CONTA||CONTA.cid!==cid)return;
  const base=BASE[p]||{estado:{},versao:-1}, local=parteDe(S,p);
  let fim=local;
  if(base.versao<0){
    /* aparelho sem histórico (acabou de entrar): o que está na nuvem manda. Os valores padrão daqui não são mudanças de ninguém */
    if(rem.versao>0){ fim=JSON.parse(JSON.stringify(rem.estado||{})); aplicaParte(p,fim) }
  }else if(rem.versao!==base.versao){ fim=merge3(base.estado,local,rem.estado||{}); if(!igual(fim,local))aplicaParte(p,fim) }
  BASE[p]={estado:rem.estado||{},versao:rem.versao}; gravarJ(CHAVE+':base',BASE);
  if(igual(fim,rem.estado||{}))return;
  try{ const nova=await rpc('salvar',{p_cid:cid,p_parte:p,p_estado:fim,p_versao:rem.versao});
    BASE[p]={estado:fim,versao:+nova}; gravarJ(CHAVE+':base',BASE) }
  catch(e){ if(/conflito/.test(e.message)&&(tent||0)<3)return sincParte(p,(tent||0)+1); throw e }
}
async function sincronizar(){
  if(!CONTA||!SES)return;

/* 10000 vira 10.000 enquanto digita; os centavos vão depois da vírgula */
function fmtMilhar(v,inicial){
  let s=String(v==null?'':v).trim(); if(!s)return '';
  if(inicial&&/^\d+\.\d{1,2}$/.test(s))s=s.replace('.',',');
  s=s.replace(/[^\d,]/g,''); const i=s.indexOf(','); let int=i<0?s:s.slice(0,i), dec=i<0?null:s.slice(i+1).replace(/,/g,'').slice(0,2);
  int=int.replace(/^0+(?=\d)/,''); int=int.replace(/\B(?=(\d{3})+(?!\d))/g,'.');
  return dec==null?int:(int||'0')+','+dec;
}

function preparaNasc(o){
  if(!o||o.type!=='date'||o.dataset.tx)return; o.dataset.tx='1';
  const iso=o.value, tx=document.createElement('input');
  tx.id='c-nasc-tx'; tx.inputMode='numeric'; tx.placeholder='dd/mm/aaaa'; tx.autocomplete='bday'; tx.maxLength=10;
  tx.value=/^\d{4}-\d{2}-\d{2}$/.test(iso)?iso.slice(8)+'/'+iso.slice(5,7)+'/'+iso.slice(0,4):'';
  const lb=o.closest('.field')&&o.closest('.field').querySelector('label'); if(lb)lb.setAttribute('for','c-nasc-tx');
  o.type='hidden'; o.after(tx);
  const valida=()=>{ const d=soDig(tx.value); tx.value=molde(d.slice(0,8),'##/##/####');
    if(d.length===8){ const dd=+d.slice(0,2), mm=+d.slice(2,4), aa=+d.slice(4), dt=new Date(aa,mm-1,dd);
      const ok=aa>1900&&dt.getFullYear()===aa&&dt.getMonth()===mm-1&&dt.getDate()===dd&&dt<=new Date();
      o.value=ok?`${aa}-${String(mm).padStart(2,'0')}-${String(dd).padStart(2,'0')}`:''; tx.setCustomValidity(ok?'':'Data inválida'); tx.classList.toggle('invalido',!ok) }
    else{ o.value=''; tx.classList.remove('invalido') } };
  tx.addEventListener('input',valida); tx.addEventListener('blur',()=>{ if(tx.value&&!o.value)toast('Confira o aniversário: use dd/mm/aaaa') });
}

/* ══════════ OCUPAÇÃO DA AGENDA ══════════
   Quanto do horário de trabalho virou atendimento, onde sobram horários e quanto se perde com falta. */
const EXP_PAD={dias:[1,2,3,4,5],ini:'08:00',fim:'18:00',dur:60};
const exped=()=>Object.assign({},EXP_PAD,S.expediente||{});
const minDe=h=>{ const [a,b]=String(h||'0:0').split(':').map(Number); return a*60+(b||0) };

function periodoOc(){ const h=hojeISO(), ini=somaDias(h,-dowDe(h));
  if(ocPer==='passada')return [somaDias(ini,-7),somaDias(ini,-1),'Semana passada'];
  if(ocPer==='proxima')return [somaDias(ini,7),somaDias(ini,13),'Próxima semana'];
  if(ocPer==='mes'){ const [a,m]=h.split('-').map(Number), f=new Date(a,m,0).getDate(); return [`${h.slice(0,7)}-01`,`${h.slice(0,7)}-${String(f).padStart(2,'0')}`,MES_L[m-1][0].toUpperCase()+MES_L[m-1].slice(1)] }
  return [ini,somaDias(ini,6),'Esta semana'];
}
function calcOcupacao(de,ate){
  const e=exped(), porDia=Math.max(0,Math.floor((minDe(e.fim)-minDe(e.ini))/Math.max(15,num(e.dur)||60)));
  const r={cap:0,ocup:0,falta:0,feito:0,dow:Array.from({length:7},()=>({cap:0,ocup:0})),faixa:{manha:0,tarde:0,noite:0},dias:[]};
  for(let d=de;d<=ate;d=somaDias(d,1)){ const w=dowDe(d), trab=e.dias.includes(w);
    const ags=S.agenda.filter(a=>a.data===d&&['marcado','concluido','faltou'].includes(a.status));
    const cap=trab?porDia:0, oc=ags.length;
    r.cap+=cap; r.ocup+=Math.min(oc,cap||oc); r.falta+=ags.filter(a=>a.status==='faltou').length; r.feito+=ags.filter(a=>a.status==='concluido').length;
    r.dow[w].cap+=cap; r.dow[w].ocup+=oc;
    ags.forEach(a=>{ const m=minDe(a.hora); r.faixa[m<12*60?'manha':m<18*60?'tarde':'noite']++ });
    if(trab)r.dias.push({d,cap,oc,vagos:Math.max(0,cap-oc)});
  }
  r.taxa=r.cap?Math.min(100,r.ocup/r.cap*100):0; r.vagos=Math.max(0,r.cap-r.ocup); r.taxaFalta=(r.feito+r.falta)?r.falta/(r.feito+r.falta)*100:0;
  return r;
}

/* ══════════ IMPORTAR PACIENTES (Clinicorp, outro sistema ou planilha) ══════════
   Lê .xlsx (Excel) e .csv sem biblioteca: o .xlsx é um zip, aberto com o descompactador do navegador. */
async function lerZip(buf){
  const v=new DataView(buf), u8=new Uint8Array(buf); let fim=-1;
  for(let i=u8.length-22;i>=Math.max(0,u8.length-65557);i--)if(v.getUint32(i,true)===0x06054b50){ fim=i; break }
  if(fim<0)throw new Error('zip');
  const n=v.getUint16(fim+10,true); let p=v.getUint32(fim+16,true); const arqs={};

  const pt=e=>{ const b=cv.getBoundingClientRect(); return [e.clientX-b.left,e.clientY-b.top] };
  cv.addEventListener('pointerdown',e=>{ e.preventDefault(); cv.setPointerCapture(e.pointerId); ant=pt(e); g.beginPath(); g.arc(ant[0],ant[1],1,0,7); g.fillStyle='#111'; g.fill(); ok=true });
  cv.addEventListener('pointermove',e=>{ if(!ant)return; const p=pt(e); g.beginPath(); g.moveTo(ant[0],ant[1]); g.lineTo(p[0],p[1]); g.stroke(); ant=p });
  const solta=()=>{ ant=null }; cv.addEventListener('pointerup',solta); cv.addEventListener('pointercancel',solta);
  return {limpa(){ g.clearRect(0,0,cv.width,cv.height); ok=false }, tem:()=>ok,
    imagem(){ const o=document.createElement('canvas'); o.width=480; o.height=Math.round(480*alt/larg); const og=o.getContext('2d'); og.drawImage(cv,0,0,o.width,o.height); return o.toDataURL('image/png') }};
}

const MOTIVOS=['Achou caro','Sumiu, não respondeu','Fechou com outro lugar','Não era o momento','Outro motivo'];
const etapaOrc=o=>o.status==='fechado'?'fechado':o.status==='perdido'?'perdido':(o.etapa||'enviado');
const ultimoContato=o=>(o.contatos||[]).slice(-1)[0]||o.data;
const orcParaChamar=()=>temFunil()?(S.orcamentos||[]).filter(o=>{ const e=etapaOrc(o); return (e==='enviado'||e==='conversa')&&o.clienteId&&diasEntre(ultimoContato(o),hojeISO())>=3 }):[];

  const decid=fech.length+perd.length, taxa=decid?fech.length/decid*100:0, tot=o=>calcOrc(o).total;

      <small>${dataBR(o.data)} · ${o.itens.map(i=>{ const s=serv(i.servicoId); return esc(s?s.nome:'procedimento') }).join(', ')}${(e==='enviado'||e==='conversa')?` · ${(o.contatos||[]).length?'último contato há '+dc+(dc===1?' dia':' dias'):'enviado há '+dc+(dc===1?' dia':' dias')}`:''}</small></div>
      <div class="vr">${brl(tot(o))}</div>
      ${e==='enviado'||e==='conversa'?`<div class="acts">${c&&c.tel?`<button class="btn sm soft" data-fu-zap="${o.id}">${ic('chat',16)}Chamar</button>`:''}
        ${e==='enviado'?`<button class="btn sm soft" data-fu-conv="${o.id}">Respondeu</button>`:''}

  el.innerHTML=`<h1>Orçamentos</h1><p class="sub">Quem recebeu um orçamento e ainda não fechou</p>

      <div class="kpi"><span class="lb">Fecham (90 dias)</span><div class="kv">${decid?taxa.toFixed(0)+'%':'—'}</div><p class="kx">${fech.length} de ${decid} que já tiveram resposta</p></div>
      <div class="kpi"><span class="lb">Fechado (90 dias)</span><div class="kv">${brl(fech.reduce((a,o)=>a+tot(o),0))}</div><p class="kx">${perd.length} não fecharam</p></div></section>
    ${Object.keys(motivos).length?`<div class="sec"><div class="sec-top"><h2>Por que não fecharam</h2></div><div class="card">${Object.entries(motivos).sort((a,b)=>b[1]-a[1]).map(([m,n])=>`<div class="oc-l"><span>${esc(m)}</span><span class="oc-b"><i style="width:${(n/perd.length*100).toFixed(0)}%"></i></span><b>${n}</b></div>`).join('')}</div></div>`:''}
    <div class="row" style="margin-top:10px;gap:8px;align-items:center;flex-wrap:wrap"><div class="chips" role="group" aria-label="Mostrar">${[['abertos','Em aberto ('+abertos.length+')'],['fechados','Fecharam'],['perdidos','Não fecharam']].map(([k,n])=>`<button class="chip" data-fu-v="${k}" aria-pressed="${funVer===k}">${n}</button>`).join('')}</div>
      <button class="btn sm pri" id="fu-novo" style="margin-left:auto">${ic('plus',16)}Novo orçamento</button></div>
    <div class="sec"><div class="card">${lista.map(linha).join('')||`<div class="vazio"><b>${funVer==='abertos'?'Nenhum orçamento em aberto':'Nada aqui ainda'}</b><p>${funVer==='abertos'?'Monte um orçamento no Simulador e salve. Ele aparece aqui até a pessoa responder.':'Quando você marcar Fechou ou Não fechou, o orçamento vem para cá.'}</p></div>`}</div></div>`;

    o.contatos=(o.contatos||[]).concat(h); salvar();
    zapAbrir(zap(c.tel,`Oi, ${c.nome.split(' ')[0]}! Tudo bem? Passando para saber se ficou alguma dúvida sobre o orçamento que te enviei (${o.itens.map(i=>{ const s=serv(i.servicoId); return s?s.nome:'' }).filter(Boolean).join(', ')}). Se quiser, já posso ver um horário para você.`)); render() });
  el.querySelectorAll('[data-fu-conv]').forEach(b=>b.onclick=()=>{ const o=acha(b.dataset.fuConv); o.etapa='conversa'; o.contatos=(o.contatos||[]).concat(h); salvar(); render() });

    abrirSheet('Não fechou','Por quê? Ajuda a entender onde você perde paciente.',`<div class="grupo-f">${MOTIVOS.map(m=>`<button class="btn soft" data-mo="${esc(m)}">${esc(m)}</button>`).join('')}</div>`,fechar=>{

  el.querySelectorAll('[data-fu-ok]').forEach(b=>b.onclick=()=>fechouOrc(acha(b.dataset.fuOk)));
};
function fechouOrc(o){ const t=calcOrc(o), c=cli(o.clienteId);
  const lanca=()=>{ o.itens.forEach(i=>{ if(!serv(i.servicoId))return;
      S.vendas.push({id:uid(),data:hojeISO(),servicoId:i.servicoId,valor:Math.round(num(i.valor)*t.f*100)/100,forma:o.forma,parcelas:o.forma==='parc'?o.parcelas:1,sessoes:i.sessoes,usadas:[],desloc:0,pagoConf:1,clienteId:o.clienteId||'',cliente:c?c.nome:''}) });
    o.status='fechado'; o.decidido=hojeISO(); mesSel=mesAtual(); salvar(); toast('Lançado no caixa'); render() };
  if(!temPlano()||!o.clienteId)return confirmar('Fechou!',`Isso lança <b>${brl(t.total)}</b> no caixa com a data de hoje.`,'Lançar no caixa',lanca);
  abrirSheet('Fechou!',`${esc(c?c.nome:'')} · ${brl(t.total)}`,`<p class="conf-tx">Como você quer seguir?</p>
    <div style="display:grid;gap:8px;margin-top:14px"><button class="btn pri full" id="fo-pl">${ic('file')}Virar plano de tratamento</button>
      <small class="sub" style="text-align:center">As etapas ficam na ficha e dá para parcelar. O dinheiro entra quando for pago.</small>
      <button class="btn soft full" id="fo-cx">${ic('coins')}Já pagou tudo · lançar no caixa</button></div>`,fechar=>{
    $('#fo-cx').onclick=()=>{ fechar(); lanca() };
    $('#fo-pl').onclick=()=>{ const ets=[]; o.itens.forEach(i=>{ const s=serv(i.servicoId), n=Math.max(1,parseInt(i.sessoes)||1); for(let k=0;k<n;k++)ets.push(etapaDe(s,'',num(i.valor)*t.f/n)) });
      const p=novoPlano(o.clienteId,ets); p.orcId=o.id; o.status='fechado'; o.decidido=hojeISO(); salvar(); fechar(); render(); setTimeout(()=>abrePlano(p.id),260) } });
}
/* ══════════ AGENDAMENTO ONLINE E PESQUISA DE SATISFAÇÃO ══════════
   A clínica publica só os horários livres (sem nomes). O paciente pede um horário por um link;
   o pedido aparece no Hoje para aceitar ou recusar. Depois do atendimento, um link de avaliação de 0 a 10. */
const onl=()=>Object.assign({ativo:false,servicos:[],dias:21,antes:2,titulo:'',aviso:'',codigo:'',preco:false},S.online||{});
const linkAgendar=()=>onl().codigo?SITE()+'?agendar='+onl().codigo:'';
function livresAgora(){ const o=onl(), e=exped(), h=hojeISO(), agora=new Date(), r={};
  const dur=Math.max(15,num(e.dur)||60), mi=t=>{ const [a,b]=String(t).split(':').map(Number); return a*60+(b||0) }, hm=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
  const limite=agora.getHours()*60+agora.getMinutes()+num(o.antes)*60;
  for(let i=0;i<Math.min(60,num(o.dias)||21);i++){ const d=somaDias(h,i); if(!e.dias.includes(dowDe(d)))continue;
    const ocup=S.agenda.filter(a=>a.data===d&&a.status==='marcado'&&a.hora).map(a=>mi(a.hora));
    const ls=[]; for(let m=mi(e.ini);m+dur<=mi(e.fim);m+=dur){ if(i===0&&m<limite)continue; if(num(o.antes)>=24&&i<Math.ceil(num(o.antes)/24))continue;
      if(ocup.some(x=>Math.abs(x-m)<dur))continue; ls.push(hm(m)) }
    if(ls.length)r[d]=ls }
  return r }
/* publica os horários livres quando a agenda muda */
let pubUlt='', pubT=0;
function publicaLivres(){ if(!CONTA||!onl().ativo||!onl().codigo)return; clearTimeout(pubT);
  pubT=setTimeout(async()=>{ const l=livresAgora(), k=JSON.stringify(l); if(k===pubUlt)return;
    try{ await rpc('atualizar_livres',{p_cid:CONTA.cid,p_livres:l}); pubUlt=k }catch(e){} },2500) }
const _salvarOn=salvar;
salvar=function(){ _salvarOn(); publicaLivres() };
setInterval(()=>{ pubUlt=''; publicaLivres() },15*60*1000);   /* horários que já passaram saem da lista */

        <div class="field"><label for="on-an">Antecedência mínima</label><select id="on-an">${[[1,'1 hora'],[2,'2 horas'],[4,'4 horas'],[12,'12 horas'],[24,'1 dia'],[48,'2 dias']].map(([v,n])=>`<option value="${v}" ${v===num(o.antes)?'selected':''}>${n}</option>`).join('')}</select></div></div>

  if($('#on-cp'))$('#on-cp').onclick=()=>{ try{ navigator.clipboard.writeText(lk); toast('Link copiado') }catch(e){ toast('Não deu para copiar') } };
  $('#on-ok').onclick=async()=>{ const at=$('#on-at').checked; if(at&&!tog.size)return toast('Escolha pelo menos um procedimento');
    const n=Object.assign(onl(),{ativo:at,servicos:[...tog],preco:$('#on-pr').checked,dias:+$('#on-d').value,antes:+$('#on-an').value,titulo:$('#on-tit').value.trim(),aviso:$('#on-av').value.trim()});
    const svs=n.servicos.map(id=>{ const s=serv(id); return {id,nome:s.nome,preco:n.preco?num(s.preco):null} });
    const b=$('#on-ok'); b.disabled=true;
    try{ n.codigo=await rpc('configurar_vitrine',{p_cid:CONTA.cid,p_ativo:at,p_titulo:n.titulo||UI.clinica||'',p_aviso:n.aviso,p_servicos:svs}); S.online=n; pubUlt=''; salvar(); toast(at?'Agenda online ligada':'Agenda online desligada'); render() }
    catch(e){ b.disabled=false; toast(/configurar_vitrine|PGRST202|404/.test(String(e.message)+e.status)?'Falta rodar o script publico.sql no Supabase':msgErro(e)) } };
};
const e2txt=()=>{ const e=exped(), D=['dom','seg','ter','qua','qui','sex','sáb']; return e.dias.slice().sort().map(d=>D[d]).join(', ')+', '+e.ini+' às '+e.fim };

/* ══════════ PÁGINAS PÚBLICAS: ?agendar=código e ?avaliar=token ══════════ */
function paginaPublica(){ let q; try{ q=new URLSearchParams(location.search) }catch(e){ return false }
  const ag=q.get('agendar'), avl=q.get('avaliar'), rsp=q.get('responder'), txt=q.has('privacidade')?'privacidade':q.has('termos')?'termos':''; if(!ag&&!avl&&!rsp&&!txt)return false;
  const previa=(q.has('previa')&&!q.has('dentro'))||q.has('privacidade')||q.has('termos');
  document.body.className='publico'; document.body.innerHTML=`${previa?`<button class="btn soft pub-volta" id="pub-volta">${ic('left',18)}Voltar ao Lucra</button>`:''}<main class="pub" id="pub"><div class="pub-c"><p class="sub">Carregando…</p></div></main><div class="toast" id="toast" role="status" aria-live="polite"></div>`;
  if($('#pub-volta'))$('#pub-volta').onclick=()=>{ if(history.length>1)history.back(); else location.href=SITE() };
  const pub=$('#pub'), pubRpc=(n,a)=>sb('/rest/v1/rpc/'+n,{metodo:'POST',corpo:a,auth:false});
  const cor=ar=>{ if(AREAS[ar])document.documentElement.style.setProperty('--ac',AREAS[ar].cor) };
  const erro=t=>{ pub.innerHTML=`<div class="pub-c"><h1>Ops</h1><p class="sub">${t}</p></div>` };
  if(txt){ paginaTexto(txt,pub); document.title=(txt==='termos'?'Termos de uso':'Política de privacidade')+' · Lucra'; return true }
  if(rsp){ paginaQuest(rsp,pub,pubRpc,cor,erro); return true }
  if(ag){
    pubRpc('ver_vitrine',{p_codigo:ag}).then(v=>{ if(!v)return erro('Este link de agendamento não está ativo. Fale direto com a clínica.'); cor(v.area);
      const h=hojeISO(), dias=Object.keys(v.livres||{}).filter(d=>d>=h&&(v.livres[d]||[]).length).sort(); let sv=(v.servicos[0]||{}).id||'', dia=dias[0]||'', hora='';
      const pinta=()=>{ pub.innerHTML=`<div class="pub-c"><p class="eyebrow">Agendar horário</p><h1>${esc(v.titulo||'')}</h1>${v.aviso?`<p class="sub">${esc(v.aviso)}</p>`:''}
        <h2 class="pub-h">O que você quer marcar?</h2><div class="chips" role="group" aria-label="Procedimento">${v.servicos.map(s=>`<button class="chip" data-p-s="${esc(s.id)}" aria-pressed="${s.id===sv}">${esc(s.nome)}${s.preco!=null?' · '+brl(s.preco):''}</button>`).join('')}</div>
        ${dias.length?`<h2 class="pub-h">Dia</h2><div class="pub-dias" role="group" aria-label="Dia">${dias.map(d=>`<button class="chip" data-p-d="${d}" aria-pressed="${d===dia}"><small>${DOW_L[dowDe(d)].slice(0,3)}</small>${dataBR(d).slice(0,5)}</button>`).join('')}</div>
          <h2 class="pub-h">Horário</h2><div class="chips" role="group" aria-label="Horário">${(v.livres[dia]||[]).map(t=>`<button class="chip" data-p-h="${t}" aria-pressed="${t===hora}">${t}</button>`).join('')}</div>
          <div class="field" style="margin-top:16px"><label for="p-n">Seu nome</label><input id="p-n" autocomplete="name"></div>
          <div class="field"><label for="p-t">WhatsApp</label><input id="p-t" inputmode="tel" autocomplete="tel" placeholder="(11) 90000-0000"></div>
          <div class="field"><label for="p-o">Quer avisar algo? (opcional)</label><input id="p-o" maxlength="300"></div>
          <button class="btn pri full" id="p-ok">Pedir este horário</button><p class="sub" style="margin-top:8px;text-align:center">A clínica confirma pelo WhatsApp.</p>`
          :`<div class="card" style="margin-top:16px"><p class="sub" style="margin:0">Não há horários livres nos próximos dias. Fale direto com a clínica.</p></div>`}</div>`;
        pub.querySelectorAll('[data-p-s]').forEach(b=>b.onclick=()=>{ sv=b.dataset.pS; guarda(); pinta() });
        pub.querySelectorAll('[data-p-d]').forEach(b=>b.onclick=()=>{ dia=b.dataset.pD; hora=''; guarda(); pinta() });
        pub.querySelectorAll('[data-p-h]').forEach(b=>b.onclick=()=>{ hora=b.dataset.pH; guarda(); pinta() });
        ['#p-n','#p-t','#p-o'].forEach(q=>{ const e=$(q); if(e&&mem[q])e.value=mem[q] });
        const t=$('#p-t'); if(t)t.addEventListener('input',()=>{ t.value=fmtTel(t.value) });
        if($('#p-ok'))$('#p-ok').onclick=async()=>{ guarda(); const nm=$('#p-n').value.trim(), tl=$('#p-t').value;
          if(!hora)return toast('Escolha o horário'); if(nm.length<2)return toast('Escreva o seu nome'); if(soDig(tl).length<10)return toast('Confira o WhatsApp com DDD');
          const b=$('#p-ok'); b.disabled=true; b.textContent='Enviando…';
          try{ await pubRpc('pedir_horario',{p_codigo:ag,p_nome:nm,p_tel:soDig(tl),p_servico:sv,p_data:dia,p_hora:hora,p_obs:$('#p-o').value.trim()});
            const s=v.servicos.find(x=>x.id===sv);
            pub.innerHTML=`<div class="pub-c pub-ok"><span class="av-ic ok">${ic('check',26)}</span><h1>Pedido enviado!</h1><p class="sub">${esc(s?s.nome:'')} · ${DOW_L[dowDe(dia)]}, ${dataBR(dia)} às ${hora}</p><p>${esc(v.titulo||'A clínica')} vai confirmar pelo WhatsApp.</p></div>` }
          catch(e){ b.disabled=false; b.textContent='Pedir este horário'; const m=String(e.message);
            if(/ocupado/.test(m)){ v.livres[dia]=(v.livres[dia]||[]).filter(x=>x!==hora); hora=''; pinta(); toast('Esse horário acabou de ser pedido. Escolha outro.') }
            else toast(/muitos/.test(m)?'Já recebemos pedidos seus. Aguarde a clínica responder.':e.rede?'Sem internet. Tente de novo.':'Não deu certo. Confira os dados e tente de novo.') } } };
      const mem={}; const guarda=()=>['#p-n','#p-t','#p-o'].forEach(q=>{ const e=$(q); if(e)mem[q]=e.value });
      pinta() }).catch(e=>erro(e.rede?'Sem internet. Confira a conexão e recarregue.':'Este link de agendamento não está ativo. Fale direto com a clínica.'));
  } else {
    pubRpc('ver_pesquisa',{p_token:avl}).then(v=>{ if(!v)return erro('Este link de avaliação não existe.'); cor(v.area);
      if(v.respondida)return pub.innerHTML=`<div class="pub-c pub-ok"><span class="av-ic ok">${ic('check',26)}</span><h1>Obrigado!</h1><p class="sub">Esta avaliação já foi enviada.</p></div>`;
      let nota=null;
      const pinta=()=>{ const cm=$('#p-c')?$('#p-c').value:'';
        pub.innerHTML=`<div class="pub-c"><p class="eyebrow">${esc(v.clinica||'')}</p><h1>Como foi o seu atendimento?</h1>
          <p class="sub">De 0 a 10, quanto você indicaria para um amigo ou parente?</p>
          <div class="pub-nps" role="group" aria-label="Nota de 0 a 10">${Array.from({length:11},(_,i)=>`<button class="chip ${i<=6?'n-b':i<=8?'n-m':'n-a'}" data-p-n="${i}" aria-pressed="${nota===i}">${i}</button>`).join('')}</div>
          <div class="pub-esc"><small>nada provável</small><small>muito provável</small></div>
          <div class="field" style="margin-top:14px"><label for="p-c">${nota!=null&&nota<=6?'O que podemos melhorar?':'Quer deixar um comentário? (opcional)'}</label><textarea id="p-c" rows="3" maxlength="500"></textarea></div>
          <button class="btn pri full" id="p-ok" ${nota==null?'disabled':''}>Enviar avaliação</button></div>`;
        $('#p-c').value=cm;
        pub.querySelectorAll('[data-p-n]').forEach(b=>b.onclick=()=>{ nota=+b.dataset.pN; pinta() });
        $('#p-ok').onclick=async()=>{ const b=$('#p-ok'); b.disabled=true;
          try{ await pubRpc('responder_pesquisa',{p_token:avl,p_nota:nota,p_comentario:$('#p-c').value.trim()});
            pub.innerHTML=`<div class="pub-c pub-ok"><span class="av-ic ok">${ic('check',26)}</span><h1>Obrigado!</h1><p class="sub">A sua avaliação foi enviada${v.clinica?' para '+esc(v.clinica):''}.</p></div>` }
          catch(e){ b.disabled=false; toast(e.rede?'Sem internet. Tente de novo.':'Este link expirou ou já foi usado.') } } };
      pinta() }).catch(e=>erro(e.rede?'Sem internet. Confira a conexão e recarregue.':'Este link de avaliação não existe.'));
  }
  return true;
}

/* traz as respostas que chegaram pelo link */

/* ══════════ PERIOGRAMA (odontologia) ══════════

const TXT_PRIV=`<h1>Política de privacidade</h1><p class="sub">Lucra · gestão para clínicas e consultórios</p>
<h2>Quem é quem</h2><p>O Lucra é uma ferramenta usada por clínicas e profissionais de saúde para organizar agenda, atendimentos e finanças. A clínica ou o profissional que usa o Lucra decide quais dados guardar e para quê: é o <b>controlador</b> dos dados, nos termos da LGPD (Lei nº 13.709/2018). O Lucra apenas guarda e processa os dados em nome dela, como <b>operador</b>.</p>
<h2>Que dados ficam guardados</h2><p>Dados da conta (nome e e-mail de quem usa o app) e os dados que a clínica registra: cadastro de pacientes, agenda, atendimentos, pagamentos, anotações, prontuário, documentos e fotos. Dados de saúde são dados sensíveis e só aparecem para quem a clínica autorizou: a recepção, por exemplo, não vê prontuário nem fotos.</p>
<h2>Onde ficam</h2><p>Em servidores na nuvem, protegidos por senha e com regras de acesso por clínica e por papel. Uma cópia também fica no próprio aparelho, para o app funcionar sem internet.</p>
<h2>Para que são usados</h2><p>Só para o funcionamento do app para quem o usa. O Lucra não vende dados, não usa os dados para propaganda e não os compartilha com terceiros, exceto o serviço que os armazena na nuvem.</p>
<h2>Pacientes</h2><p>Para pedir uma cópia, correção ou informações sobre seus dados, fale com a clínica ou o profissional que atende você: é ela quem responde por eles. A clínica consegue gerar no app um arquivo com todos os seus dados.</p>
<h2>Quanto tempo</h2><p>Enquanto a clínica mantiver a conta. Registros de saúde devem ser guardados pelo prazo mínimo exigido pela lei e pelo conselho profissional, e cabe a quem usa o app respeitar esse prazo.</p>
<h2>Links de agendamento e questionário</h2><p>Quando você usa um link enviado por quem atende você, o que você preenche vai direto para esse profissional. Não usamos cookies de rastreamento nem ferramentas de análise de terceiros.</p>`;
const TXT_TERMOS=`<h1>Termos de uso</h1><p class="sub">Lucra · gestão para clínicas e consultórios</p>
<h2>O que é</h2><p>O Lucra ajuda clínicas e profissionais a organizar agenda, pacientes, atendimentos e finanças. Os cálculos de lucro, taxas e impostos são estimativas para apoiar decisões e não substituem a contabilidade.</p>
<h2>Responsabilidade pelos dados</h2><p>Quem cria a conta é responsável pelos dados que registra, por informar os pacientes e por ter base legal para tratá-los (LGPD). Também é responsável pelo conteúdo técnico dos documentos que emite (receitas, atestados, laudos, relatórios), que precisam seguir as normas do seu conselho profissional.</p>

     <ul class="pl-lista">${p.itens.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>
     <button class="btn pri full" id="pl-ver" style="margin-top:14px">Ver os planos</button>`,fechar=>{ $('#pl-ver').onclick=()=>{ fechar(); setTimeout(()=>{ ir('ajustes'); setTimeout(()=>{ const e=$('#sec-plano'); if(e)e.scrollIntoView({block:'start'}) },150) },220) } }) }

ir=function(t){ if(RECURSO_PL[t]&&!temRecurso(t))return planoSheet(t); return _irPn.apply(this,arguments) };
const _aplNavPn=aplicaNav;
aplicaNav=function(){ _aplNavPn(); document.querySelectorAll('#menu button[data-t]').forEach(b=>{ const t=b.dataset.t, bl=RECURSO_PL[t]&&!temRecurso(t);
  b.classList.toggle('bloq',!!bl); let c=b.querySelector('.cad'); if(bl&&!c)b.insertAdjacentHTML('beforeend',`<span class="cad" aria-label="plano ${PLANOS[RECURSO_PL[t]].n}">${PLANOS[RECURSO_PL[t]].n}</span>`); if(!bl&&c)c.remove() });
  if(typeof pintaBarra==='function')pintaBarra() };

  if(tela==='ajustes'&&!$('#sec-plano')&&typeof CONTA!=='undefined'&&CONTA&&ehDono()){ const pa=planoAtual();

      ${emTeste()?`<div class="nota" style="margin-top:10px">Teste grátis até <b>${dataBR(String(CONTA.teste).slice(0,10))}</b>, com tudo liberado. Depois, a conta segue no plano <b>${PLANOS[planoDepois()].n}</b>, a não ser que você escolha outro.</div>`:''}
      <div class="pl-grid">${ORDEM_PL.map(k=>`<div class="pl-c ${k===(emTeste()?planoDepois():pa)?'atual':''}"><b>${PLANOS[k].n}</b><span class="pl-p">${PLANOS[k].preco}${PLANOS[k].preco!=='a definir'?'<small>/mês</small>':''}</span>
        ${PLANOS[k].depois?`<small class="sub">nos 3 primeiros meses, depois ${PLANOS[k].depois}</small>`:''}<ul class="pl-lista">${PLANOS[k].itens.map(i=>`<li>${esc(i)}</li>`).join('')}</ul></div>`).join('')}</div>
      <p class="sub" style="margin-top:10px">Para mudar de plano, fale com o suporte do Lucra.</p></div></div>`;

const _aNavA=aplicaNav;

/* ══════════ BOAS-VINDAS ══════════

  odonto:[['Avaliação',150,5],['Limpeza (profilaxia)',250,20],['Restauração em resina',300,40],['Clareamento em consultório',1200,250],
    ['Clareamento caseiro',800,150],['Tratamento de canal',1200,120],['Extração simples',300,30],['Extração de siso',700,60],
    ['Raspagem periodontal',400,30],['Faceta em resina',600,80],['Coroa de porcelana',2000,600],['Implante',3500,1200],
    ['Instalação de aparelho',1500,400],['Manutenção de aparelho',200,15]]};
function boasVindas(){
  if(document.querySelector('.ob'))return;
  const TOT=4; let passo=0, servId='', criados=[];
  let sugA=area(); const sel={};
  const SUGX=()=>{ if(sugA!==area()){ sugA=area(); Object.keys(sel).forEach(k=>delete sel[k]) } return SUGESTOES[area()]||null };
  const d={clinica:UI.clinica||'',meta:S.meta||'',nome:'',preco:'',custo:'',
    deb:S.taxas.debito,c1:S.taxas.cred1,parc:S.taxas.parc,extra:S.taxas.parcExtra,imp:S.imposto};
  const bg=document.createElement('div'); bg.className='ob';
  bg.setAttribute('role','dialog'); bg.setAttribute('aria-modal','true'); bg.setAttribute('aria-label','Boas-vindas ao Lucra');
  document.body.appendChild(bg); document.body.style.overflow='hidden';
  requestAnimationFrame(()=>requestAnimationFrame(()=>bg.classList.add('on')));
  const q=s=>bg.querySelector(s);
  const v=k=>esc(String(d[k]==null?'':d[k]).replace('.',','));
  const sair=msg=>{ UI.boasVindas=true; salvarUI(); bg.classList.remove('on'); document.body.style.overflow='';
    setTimeout(()=>bg.remove(),300); marca(); ir('painel'); if(msg)toast(msg) };
  const topo=()=>`<div class="ob-top"><button class="ibtn" id="ob-volta" aria-label="Voltar um passo">${ic('left')}</button>

        ${[1,2,3,4].map(n=>`<i class="${n<=passo?'on':''}"></i>`).join('')}</div>
      <button class="btn-tx" id="ob-pula">Pular</button></div>
    <p class="eyebrow">Passo ${passo} de ${TOT}</p>`;
  const acoes=r=>`<div class="ob-acoes"><button class="btn pri full lg" id="ob-ok">${r||'Continuar'}${ic('arrow')}</button></div>`;

  const P=[
    ()=>`<div class="ob-logo">${MARCA}</div>
      <h1>Quanto sobra de verdade em cada atendimento?</h1>
      <p class="ob-lead">O Lucra desconta a maquininha, o produto, a comissão e o imposto, e mostra o que fica com você.</p>
      <ul class="ob-lista">
        <li>${ic('coins',20)}<span><b>Lucro real por procedimento</b>não só o que entrou no caixa</span></li>
        <li>${ic('sliders',20)}<span><b>Pix ou parcelado?</b>veja a diferença antes de fechar o preço</span></li>
        <li>${ic('box',20)}<span><b>Dinheiro da reposição separado</b>para o mês não fechar sem produto</span></li>
      </ul>
      <div class="ob-acoes">
        <button class="btn pri full lg" id="ob-ok">Começar · leva 2 minutos${ic('arrow')}</button>
        <button class="btn-tx" id="ob-fora">Agora não, quero explorar primeiro</button>
        <p class="ob-nota">${typeof CONTA!=='undefined'&&CONTA?'Tudo fica salvo na sua conta.':'Seus dados ficam só neste aparelho.'}</p>
      </div>`,
    ()=>`${topo()}<h1>Como se chama o seu espaço?</h1>
      <p class="ob-lead">Pode ser o nome da clínica, do studio ou o seu próprio nome.</p>
      <div class="ob-campos"><label id="ob-la">Sua área</label>
        <div class="chips" role="group" aria-labelledby="ob-la" style="margin:0 0 18px">${chipsArea()}</div>
        <div class="field"><label for="ob-clinica">Nome</label>
        <input id="ob-clinica" data-k="clinica" data-foco placeholder="Ex.: Studio Bela Pele" value="${esc(d.clinica)}" maxlength="40" autocomplete="organization"></div>
        <label id="ob-leq">Como você trabalha?</label>
        <div class="chips" role="group" aria-labelledby="ob-leq"><button class="chip" data-eq="0" aria-pressed="${!modOn('equipe')}">Só eu</button>
          <button class="chip" data-eq="1" aria-pressed="${modOn('equipe')}">Com equipe</button></div></div>
      ${acoes()}`,
    ()=>`${topo()}<h1>Quanto você quer faturar neste mês?</h1>
      <p class="ob-lead">É o total que entra, antes dos custos. O Painel mostra o quanto falta para chegar lá.</p>
      <div class="ob-campos"><div class="field"><label for="ob-meta">Meta de faturamento (R$)</label>
        <input id="ob-meta" data-k="meta" data-foco inputmode="decimal" placeholder="0,00" value="${v('meta')}"></div>
        <div class="chips">${[5000,10000,20000,30000].map(n=>`<button class="chip" data-meta="${n}">${brl(n).replace(',00','')}</button>`).join('')}</div></div>
      <div class="nota" style="margin-top:18px">Não tem certeza? Chute um valor. Dá para mudar a qualquer hora no Painel.</div>
      ${acoes()}`,
    ()=>SUGX()?`${topo()}<h1>Quais serviços você faz?</h1>
      <p class="ob-lead">Toque nos que você oferece. Os valores são só um ponto de partida: troque pelo seu preço e pelo que você gasta de produto.</p>
      <div class="chips ob-sug" role="group" aria-label="Serviços comuns">${SUGX().map((s,i)=>`<button type="button" class="chip" data-sug="${i}" aria-pressed="${!!sel[i]}">${esc(s[0])}</button>`).join('')}</div>
      ${Object.keys(sel).length?`<div class="ob-esc">${Object.keys(sel).map(i=>`<div class="ob-esc-l"><b>${esc(SUGX()[i][0])}</b>
        <div class="field"><label for="sp-${i}">Preço (R$)</label><input id="sp-${i}" data-sp="${i}" data-c="preco" inputmode="decimal" value="${esc(String(sel[i].preco).replace('.',','))}"></div>
        <div class="field"><label for="sc-${i}">Produto (R$)</label><input id="sc-${i}" data-sp="${i}" data-c="custo" inputmode="decimal" value="${esc(String(sel[i].custo).replace('.',','))}"></div>
        <button type="button" class="ibtn" data-tira="${i}" aria-label="Tirar ${esc(SUGX()[i][0])}">${ic('x',18)}</button></div>`).join('')}</div>`:''}
      <p class="eyebrow" style="margin-top:18px">Faz algum que não está na lista?</p>
      <div class="ob-campos">
        <div class="field"><label for="ob-nome">Nome do procedimento</label>
          <input id="ob-nome" data-k="nome" placeholder="opcional" value="${esc(d.nome)}"></div>
        <div class="grid2">
          <div class="field"><label for="ob-preco">Preço cobrado (R$)</label>
            <input id="ob-preco" data-k="preco" inputmode="decimal" placeholder="0,00" value="${v('preco')}"></div>
          <div class="field"><label for="ob-custo">Custo de produto (R$)</label>
            <input id="ob-custo" data-k="custo" inputmode="decimal" placeholder="0,00" value="${v('custo')}"></div>
        </div></div>
      <div class="nota">O <b>custo de produto</b> é o que sai do seu bolso a cada atendimento: ${area()==='odonto'?'resina, anestésico, descartável, laboratório':'creme, descartável, agulha, toxina'}. Um valor aproximado já serve.</div>
      ${acoes()}`
    :`${topo()}<h1>${ehPsico()?'Quanto custa a sua sessão?':'Qual procedimento você mais faz?'}</h1>
      <p class="ob-lead">Cadastre só um agora. Os outros você adiciona depois em Serviços.</p>
      <div class="ob-campos">
        <div class="field"><label for="ob-nome">Nome do procedimento</label>
          <input id="ob-nome" data-k="nome" data-foco placeholder="Limpeza de pele, drenagem, laser..." value="${esc(d.nome)}"></div>
        ${ehPsico()?`<div class="field"><label for="ob-preco">Valor da sessão (R$)</label>
            <input id="ob-preco" data-k="preco" inputmode="decimal" placeholder="0,00" value="${v('preco')}"></div></div>
      <div class="nota">Atende online e presencial com valores diferentes? Cadastre os dois depois, em Valores.</div>`:`<div class="grid2">
          <div class="field"><label for="ob-preco">Preço cobrado (R$)</label>
            <input id="ob-preco" data-k="preco" inputmode="decimal" placeholder="0,00" value="${v('preco')}"></div>
          <div class="field"><label for="ob-custo">Custo de produto (R$)</label>
            <input id="ob-custo" data-k="custo" inputmode="decimal" placeholder="0,00" value="${v('custo')}"></div>
        </div></div>
      <div class="nota">O <b>custo de produto</b> é o que sai do seu bolso a cada atendimento: creme, descartável, agulha, toxina. Um valor aproximado já serve.</div>`}
      ${acoes()}`,
    ()=>`${topo()}<h1>As taxas da sua maquininha</h1>

      <div class="ob-campos">
        <div class="grid2">
          <div class="field"><label for="ob-deb">Débito (%)</label><input id="ob-deb" data-k="deb" data-foco inputmode="decimal" value="${v('deb')}"></div>
          <div class="field"><label for="ob-c1">Crédito à vista (%)</label><input id="ob-c1" data-k="c1" inputmode="decimal" value="${v('c1')}"></div>
        </div>
        <div class="grid2">
          <div class="field"><label for="ob-parc">Crédito 2x (%)</label><input id="ob-parc" data-k="parc" inputmode="decimal" value="${v('parc')}"></div>
          <div class="field"><label for="ob-extra">A mais por parcela (%)</label><input id="ob-extra" data-k="extra" inputmode="decimal" value="${v('extra')}"></div>
        </div>
        <div class="field"><label for="ob-imp">Imposto sobre o faturamento (%)</label>
          <input id="ob-imp" data-k="imp" inputmode="decimal" value="${v('imp')}"></div></div>
      <div class="nota">Não sabe agora? Continue com esses valores e ajuste depois em Serviços, na parte de taxas e encargos.</div>
      ${acoes('Concluir')}`,
    ()=>{ const s=serv(servId); let pay='';
      if(s){ const a=conta({servicoId:s.id,valor:s.preco,forma:'pix',parcelas:1}),
                   b=conta({servicoId:s.id,valor:s.preco,forma:'parc',parcelas:12});
        pay=`<div class="ob-pay"><span class="eyebrow">${esc(s.nome)} por ${brl(s.preco)}</span>
          <div class="ob-pay-l"><span>No Pix sobram</span><b class="${a.lucro>=0?'v-ok':'v-bad'}">${brl(a.lucro)}</b></div>
          <div class="ob-pay-l"><span>Em 12x sobram</span><b class="${b.lucro>=0?'v-war':'v-bad'}">${brl(b.lucro)}</b></div>
          <p>São <b>${brl(a.lucro-b.lucro)}</b> de diferença no mesmo atendimento. É esse tipo de número que o Lucra mostra todo dia.</p></div>` }
      return `<div class="ob-logo">${MARCA}</div>
        <h1>Tudo pronto${UI.clinica?', '+esc(UI.clinica):''}</h1>

        ${pay}
        <div class="ob-acoes">
          <button class="btn pri full lg" id="ob-fim">${s?'Ir para o Painel':'Cadastrar um serviço'}${ic('arrow')}</button>

  ];

  const guarda=()=>{ bg.querySelectorAll('[data-k]').forEach(i=>d[i.dataset.k]=i.value);
    bg.querySelectorAll('[data-sp]').forEach(i=>{ if(sel[i.dataset.sp])sel[i.dataset.sp][i.dataset.c]=i.value }) };
  const avanca=()=>{ guarda();
    if(passo===1){ UI.clinica=String(d.clinica).trim(); salvarUI(); marca() }
    if(passo===2){ S.meta=num(d.meta); salvar() }
    if(passo===3&&SUGX()){ const n=String(d.nome).trim(), lista=Object.keys(sel).map(i=>({nome:SUGX()[i][0],preco:num(sel[i].preco),custo:num(sel[i].custo)}));

      const ja=serv(servId);
      if(ja)Object.assign(ja,{nome:n,preco:p,custo:num(d.custo)});
      else{ servId=uid(); S.servicos.push({id:servId,nome:n,preco:p,precoMax:0,custo:num(d.custo),comissao:0,retorno:0}) }
      salvar() }
    if(passo===4){ S.taxas=Object.assign({},S.taxas,{debito:num(d.deb),cred1:num(d.c1),parc:num(d.parc),parcExtra:num(d.extra)});
      S.imposto=num(d.imp); salvar() }
    passo++; desenha() };
  const desenha=()=>{
    bg.innerHTML=`<div class="ob-card"><div class="ob-in">${P[passo]()}</div></div>`; bg.scrollTop=0; traduz(bg);
    if(q('#ob-ok'))q('#ob-ok').onclick=avanca;
    if(q('#ob-volta'))q('#ob-volta').onclick=()=>{ guarda(); passo--; desenha() };
    if(q('#ob-pula'))q('#ob-pula').onclick=()=>{ guarda(); passo++; desenha() };
    if(q('#ob-fora'))q('#ob-fora').onclick=()=>sair();
    if(q('#ob-demo'))q('#ob-demo').onclick=()=>{ demoArea(); sair('Exemplo carregado') };
    if(q('#ob-fim'))q('#ob-fim').onclick=()=>{ const tem=!!serv(servId); sair(); if(!tem)ir('servicos') };
    if(q('#ob-cx'))q('#ob-cx').onclick=()=>{ sair(); ir('registrar') };
    bg.querySelectorAll('[data-sug]').forEach(b=>b.onclick=()=>{ guarda(); const i=b.dataset.sug;
      if(sel[i])delete sel[i]; else sel[i]={preco:SUGX()[i][1],custo:SUGX()[i][2]}; const y=bg.scrollTop; desenha(); bg.scrollTop=y });
    bg.querySelectorAll('[data-tira]').forEach(b=>b.onclick=()=>{ guarda(); delete sel[b.dataset.tira]; const y=bg.scrollTop; desenha(); bg.scrollTop=y });
    bg.querySelectorAll('[data-area]').forEach(b=>b.onclick=()=>{ guarda(); mudaArea(b.dataset.area,true); desenha() });
    bg.querySelectorAll('[data-eq]').forEach(b=>b.onclick=()=>{ UI.mod.equipe=b.dataset.eq==='1'; salvarUI();
      bg.querySelectorAll('[data-eq]').forEach(z=>z.setAttribute('aria-pressed',String(z===b))) });
    bg.querySelectorAll('[data-meta]').forEach(b=>b.onclick=()=>{ q('#ob-meta').value=b.dataset.meta; q('#ob-ok').focus() });
    const f=q('[data-foco]')||q('#ob-ok')||q('#ob-fim'); if(f)setTimeout(()=>{try{f.focus({preventScroll:true})}catch(e){}},80);
  };
  bg.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.tagName==='INPUT'&&q('#ob-ok')){ e.preventDefault(); avanca() } });
  desenha();
}

/* ── exemplo ── */
/* Exemplo com preços de mercado de 2026 e taxas reais da InfinitePay
   (Mastercard/Visa, faturamento até R$ 20 mil). Custos de produto são
   estimativas de mercado — cada clínica ajusta para os próprios. */
function demo(){
  const t=S.tema;
  S=JSON.parse(JSON.stringify(PAD)); S.tema=t; S.meta=25000; S.imposto=6;
  const sv=[
    {nome:'Limpeza de pele profunda',        preco:220,  custo:24,  comissao:30, retorno:45,  qtd:22},
    {nome:'Peeling químico superficial',     preco:280,  custo:45,  comissao:30, retorno:30,  qtd:6},
    {nome:'Microagulhamento facial',         preco:380,  custo:90,  comissao:30, retorno:30,  qtd:8},
    {nome:'Radiofrequência facial',          preco:200,  custo:15,  comissao:30, retorno:15,  qtd:10},
    {nome:'Drenagem linfática (1h)',         preco:130,  precoMax:160, custo:12, comissao:40, retorno:7, qtd:18},
    {nome:'Massagem modeladora (1h)',        preco:150,  precoMax:200, custo:15, comissao:40, retorno:7, qtd:8},
    {nome:'Criolipólise · 1 área',           preco:480,  custo:60,  comissao:20, retorno:60,  qtd:6},
    {nome:'Laser · axilas',                  preco:150,  custo:18,  comissao:20, retorno:40,  qtd:14},
    {nome:'Laser · virilha completa',        preco:280,  custo:30,  comissao:20, retorno:40,  qtd:7},
    {nome:'Toxina botulínica · 3 áreas',     preco:1500, custo:520, comissao:0,  retorno:180, qtd:3}
  ].map(s=>Object.assign({id:uid()},s));
  S.servicos=sv.map(({id,nome,preco,precoMax,custo,comissao,retorno})=>
    ({id,nome,preco,precoMax:precoMax||0,custo,comissao,retorno}));
  S.custoDomicilio=35;

  /* mês fechado anterior, para o exemplo ter um mês inteiro de movimento */
  const h=new Date(), ant=new Date(h.getFullYear(),h.getMonth()-1,1);
  const mes=`${ant.getFullYear()}-${String(ant.getMonth()+1).padStart(2,'0')}`;
  const ultimo=new Date(ant.getFullYear(),ant.getMonth()+1,0).getDate();
  const dia=d=>`${mes}-${String(Math.max(1,Math.min(ultimo,d))).padStart(2,'0')}`;

  /* mistura de pagamento parecida com a de clínica pequena */
  const formas=[['pix',1],['pix',1],['pix',1],['debito',1],['debito',1],
    ['cred1',1],['cred1',1],['cred1',1],['parc',3],['parc',3],['parc',6],['parc',10]];
  let seed=20261101; const rnd=n=>{seed=(seed*1103515245+12345)%2147483648;return Math.floor(seed/2147483648*n)};

  S.clientes=['Juliana Prado','Camila Torres','Fernanda Lopes','Patrícia Melo','Roberta Dias','Luana Freitas']
    .map(n=>({id:uid(),nome:n,tel:'',email:'',nasc:'',obs:''}));

  sv.forEach(s=>{ for(let i=0;i<s.qtd;i++){
    const f=formas[rnd(formas.length)];
    /* procedimento caro quase nunca sai à vista no débito */
    const forma=(s.preco>=480&&f[0]==='debito')?'parc':f[0];
    const parc=forma==='parc'?(f[0]==='parc'?f[1]:6):1;
    const c=S.clientes[rnd(S.clientes.length)];
    S.vendas.push({id:uid(),data:dia(1+rnd(ultimo)),servicoId:s.id,valor:s.preco,
      forma,parcelas:parc,clienteId:c.id,cliente:c.nome});
  }});

  /* pacotes vendidos e atendimento em domicílio */
  const eu=S.clientes[0];
  S.vendas.push({id:uid(),data:dia(9),servicoId:sv[4].id,valor:700,forma:'pix',parcelas:1,
    sessoes:5,usadas:[dia(9),dia(13),dia(17)],desloc:0,clienteId:eu.id,cliente:eu.nome});
  S.vendas.push({id:uid(),data:dia(16),servicoId:sv[5].id,valor:1500,forma:'parc',parcelas:2,
    sessoes:10,usadas:[dia(16),dia(20)],desloc:35,clienteId:eu.id,cliente:eu.nome});

  /* alguns horários marcados para os próximos dias */
  const hj=hojeISO();
  const horas=['09:00','10:30','13:00','14:30','16:00','17:30'];
  for(let d=0;d<6;d++){ const qt=d===0?3:1+rnd(3);
    for(let i=0;i<qt;i++){
      const s=sv[rnd(sv.length)], c=S.clientes[rnd(S.clientes.length)];
      S.agenda.push({id:uid(),data:somaDias(hj,d),hora:horas[(i+d)%horas.length],
        clienteId:c.id,servicoId:s.id,obs:'',status:'marcado'});
    }}

  S.despesas=[
    {id:uid(),data:dia(5),  desc:'Aluguel da sala',                 valor:2200, servicoId:''},
    {id:uid(),data:dia(5),  desc:'Energia, água e internet',        valor:480,  servicoId:''},
    {id:uid(),data:dia(6),  desc:'Contador',                        valor:300,  servicoId:''},
    {id:uid(),data:dia(7),  desc:'Impulsionamento no Instagram',    valor:400,  servicoId:''},
    {id:uid(),data:dia(8),  desc:'Compra de toxina botulínica',     valor:1600, servicoId:sv[9].id},
    {id:uid(),data:dia(10), desc:'Cosméticos e descartáveis',       valor:520,  servicoId:sv[0].id},
    {id:uid(),data:dia(14), desc:'Ponteiras de microagulhamento',   valor:700,  servicoId:sv[2].id},
    {id:uid(),data:dia(18), desc:'Mantas e gel de criolipólise',    valor:380,  servicoId:sv[6].id},
    {id:uid(),data:dia(22), desc:'Óleos e cremes de massagem',      valor:240,  servicoId:sv[4].id},
    {id:uid(),data:dia(25), desc:'Sistema de agendamento',          valor:150,  servicoId:''}
  ];
  mesSel=mes;
  salvar();
}
